# Runs on pushes to main and development, and on every pull request. Vercel deploys
# main on push whatever this says, so a red run on main means the deployed app may be
# broken: fix forward at once.
name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: Live client against the built server (jsdom)
        run: EDW_INTEGRATION=1 pnpm --filter @edw/client exec vitest run src/integration
      - name: Browser check of the core flow
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
