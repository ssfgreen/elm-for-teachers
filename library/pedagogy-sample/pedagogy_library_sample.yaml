- id: cau-ACC-asl-act-code-of-practice
  type: caution
  title: Education (Additional Support for Learning) (Scotland) Act 2004 and Code of Practice
  summary: 'Scotland''s legal framework defines additional support needs broadly: any barrier, any reason,
    short or long term, with support in teaching approaches, people and resources.'
  body: 'Any pupil who for whatever reason needs support beyond what is generally provided to peers has
    additional support needs. Barriers include the learning environment itself, so adapting teaching is
    part of meeting the duty. Adaptations in this library are "approaches to learning and teaching". The
    code cited here is the third edition (2017); gov.scot lists a fourth edition (2026) that should be
    checked before publishing.

    '
