- id: exm-HIS-arbroath-enquiry
  type: exemplar
  title: 'Exemplar S1 enquiry: Why did Scotland''s leaders send the Declaration of Arbroath in 1320?'
  summary: A worked six-lesson S1 enquiry on the Wars of Independence combining narrative, archive source
    work, a causation card sort and an extended written answer.
  body: 'Enquiry question: Why did Scotland''s leaders send the Declaration of Arbroath to the Pope in
    1320? (focus concept: cause and motive)

    1. Narrative: the Wars of Independence to 1320, with timeline retrieval (act-HIS-chronology-timeline).

    2. Knowledge: Robert I, excommunication and papal recognition; quiz.

    3. Archive source: image and transcription of the Declaration from National Records of Scotland resources
    (act-HIS-scottish-archives, act-HIS-source-analysis-scaffold).

    4. Corroboration: a second source on the papal dispute; usefulness for our question.

    5. Card sort of motives (independence, recognition of Robert, papal pressure, nobles'' self-interest)
    with relevance zones and justification (act-HIS-causation-card-sort).

    6. Extended answer using big point paragraphs (sig-HIS-disciplinary-reading-writing).

    Assessment links: SOC 3-06a (motives and consequences of a turning point) and SOC 3-01a (interpreting
    evidence). The NRS offers a Declaration of Arbroath investigation for P7/S1, so this can serve as
    a transition enquiry.

