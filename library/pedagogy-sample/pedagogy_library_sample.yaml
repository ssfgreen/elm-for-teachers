- id: prn-EVD-formative-assessment
  type: principle
  title: Formative assessment (assessment for learning)
  summary: Gather evidence of what all pupils understand during learning and use it to adapt teaching
    straight away.
  body: '**What it is.** Assessment is formative when the evidence is used to change teaching or learning.
    In Scotland this is often called Assessment is for Learning.


    **How to do it.**

    - Share clear learning intentions and success criteria.

    - Ask questions that reveal thinking; give wait time; get responses from all pupils (whiteboards,
    hinge questions).

    - Act on the evidence: reteach, regroup, move on.

    - Use comment feedback and train pupils in self- and peer-assessment.


    **Scottish context.** GTCS standards describe assessment as integral to learning and teaching and
    value learner dialogue about progress.

    '
