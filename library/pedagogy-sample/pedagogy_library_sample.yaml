  type: caution
  title: Morgan review of ASL implementation (2020)
  summary: The legislation is sound but implementation is inconsistent; reliance on diagnosis to unlock
    support is a problem.
  body: 'Use as context when planning: do not make classroom adaptations conditional on a diagnosis; treat
    inclusion as every teacher''s responsibility; put relationships before process.

