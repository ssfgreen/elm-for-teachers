- id: cau-ACC-dyslexia-fonts
  type: caution
  title: 'Specialist dyslexia fonts: no reading benefit'
  summary: Trials of OpenDyslexic and Dyslexie found no gains in reading speed or accuracy; spacing, not
    letter shape, is the likely active ingredient.
  body: 'Do not convert class materials to a specialist dyslexia font or present it as support. Use plain
    fonts with good spacing; allow an individual''s preferred font.

