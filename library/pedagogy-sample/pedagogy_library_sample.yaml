  - psg-EVD-ros-success
  support_type: paraphrase
- id: clm-EVD-ei-04
  entry_id: prn-EVD-explicit-instruction
  text: For novices, explicit instruction is more effective than partial guidance, and a meta-analysis
    found unassisted discovery underperformed explicit instruction.
