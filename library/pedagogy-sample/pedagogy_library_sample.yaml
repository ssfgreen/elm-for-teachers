- id: prn-EVD-scaffolding
  type: principle
  title: Scaffolding with planned fading
  summary: Provide temporary supports (prompts, sentence starters, templates, models, checklists) for
    difficult tasks and remove them as pupils become competent.
  body: '**What it is.** Planned support that lets pupils succeed at a task just beyond what they can
    do alone, withdrawn over time.


    **How to do it.**

    - Anticipate barriers and plan scaffolds in advance (visual supports, writing frames, verbal prompts,
    checklists, models).

    - Include guided stages between explanation and independent work.

    - Plan how and when each scaffold will be faded.

    - Use the same scaffolds for all pupils who need them; this is good teaching for all.

    '
