  source_id: src-LIT-fisher-frey-2015
  locator: pp.59-60 (rereading and annotating; action after reading)
  excerpt_type: paraphrase
  text: 'Three annotation marks are suggested: underline key ideas, circle unclear words and write margin
    notes in your own words. Close reading should lead on to writing, debate, investigation or presentation.'
  fetched_url: https://www.readinghalloffame.org/sites/default/files/kappan_close_read.pdf
  verified_by_fetch: true
- id: psg-LIT-ff15-rr-caution
  source_id: src-LIT-fisher-frey-2015
  locator: p.60
  excerpt_type: paraphrase
  text: Citing Nichols, Rupley and Rasinski (2009), the authors warn that repeated reading without guidance
    can reduce engagement and fail to show pupils how fluency serves meaning, so rereading needs scaffolding
    and conversation.
  fetched_url: https://www.readinghalloffame.org/sites/default/files/kappan_close_read.pdf
  verified_by_fetch: true
- id: psg-LIT-cremin06-abstract
  source_id: src-LIT-cremin-2006-drama-writing
  locator: Abstract (ORO repository record)
  excerpt_type: paraphrase
  text: A pilot compared drama aimed at a specific genre with a 'seize the moment' approach allowing spontaneity
    and choice; the main study used the latter and identified elements of drama that supported children's
    writing, concluding that drama has much to offer primary composition.
  fetched_url: https://oro.open.ac.uk/9778
  verified_by_fetch: true
- id: psg-LIT-aes-cremin06
  source_id: src-LIT-artsedsearch-cremin-2006
  locator: 'Study summary: findings and limitations'
  excerpt_type: paraphrase
  text: In three classes (two of 10 to 11 year olds), writing from a character's perspective after process
    drama was more focused and used setting, character and event detail more effectively; dramatic tension
    and sustained engagement also appeared to help. The study was non-experimental, so it cannot show
    drama caused the gains, and novelty may have played a part.
  fetched_url: https://www.artsedsearch.org/study/connecting-drama-and-writing-seizing-the-moment-to-write/
  verified_by_fetch: true
- id: psg-LIT-ukla-drama
  source_id: src-LIT-ukla-drama-viewpoint
  locator: pp.2-3
  excerpt_type: paraphrase
  text: Drama is linked to children's idea generation, fluency and motivation to write. Conventions such
    as freeze frame, hot seating and decision alley, and teacher in role, help children explore language
    and meaning; worked examples end with pupils writing a letter or diary entry in role after role-play.
  fetched_url: https://ukla.org/wp-content/uploads/2020/01/View_Drama.pdf
  verified_by_fetch: true
- id: psg-LIT-edhub-reciprocal
  source_id: src-LIT-edinburgh-hub-comprehension
  locator: p.8 and p.10
  excerpt_type: paraphrase
  text: The guide calls the model reciprocal because teacher control is reduced step by step as pupils
    move from groups to pairs to working alone, built on expert modelling, peer support and self-monitoring.
    It draws on Palincsar and Brown (1984).
  fetched_url: https://education.gov.scot/media/vaapuk03/lit13_teachingreadingcomprehensionfinaldraft.pdf
  verified_by_fetch: true
- id: psg-LIT-edhub-prompts
  source_id: src-LIT-edinburgh-hub-comprehension
  locator: pp.12-15 (prompt cards for predicting, questioning, clarifying, summarising)
  excerpt_type: paraphrase
  text: Prompt cards give sentence starters such as 'I predict...'; pupils write a question before reading
    so they read with purpose; clarifying is modelled through rereading, reading on and breaking words
    into parts; summarising uses summary wheels and asks for few words.
  fetched_url: https://education.gov.scot/media/vaapuk03/lit13_teachingreadingcomprehensionfinaldraft.pdf
  verified_by_fetch: true
- id: psg-LIT-edhub-model-try
  source_id: src-LIT-edinburgh-hub-comprehension
  locator: pp.27, 30, 32 (lesson plan structure)
  excerpt_type: paraphrase
  text: Lessons follow Model (teacher-led), Try (with peers), Apply (independent) and Secure (plenary),
    with talk partners and cooperative groups throughout.
  fetched_url: https://education.gov.scot/media/vaapuk03/lit13_teachingreadingcomprehensionfinaldraft.pdf
  verified_by_fetch: true
- id: psg-LIT-es-rr-programme
  source_id: src-LIT-es-reciprocal-reading-programme
  locator: Programme page, overview
  excerpt_type: paraphrase
  text: Education Scotland lists a Reciprocal Reading professional learning programme for primary and
    English teachers in the Forth Valley and West Lothian Regional Improvement Collaborative, developed
    with the University of Stirling and running for 6 to 12 weeks.
  fetched_url: https://education.gov.scot/professional-learning/learn/programmes/reciprocal-reading
  verified_by_fetch: true
entries:
- id: fmt-ACC-emphasis-bold
  type: format_rule
  title: Emphasise with bold, not italics, underlining or capitals
  summary: Use bold for key words and actions; never italics, underlining or blocks of capitals.
  body: '- Use **bold** for key vocabulary, command words and the action a pupil must take.

    - Do not use italics or underlining for emphasis; underlining is reserved for links in digital artefacts.

    - Do not write words or sentences in capitals for emphasis.

    - Keep emphasis sparing so the key action still stands out.

    '
  status: draft
  version: '0.1'
  curated_by:
  - ACC
  facets:
    jurisdiction:
    - scotland
    cfe_level:
    - early
    - first
    - second
    - third
    - fourth
    - senior
    curriculum_area:
    - all
    artefact_type:
    - slides
    - worksheet
    - form
    - lesson_plan
    barrier:
    - decoding
    - reading_fluency
    - attention
    access_dimension: layout
    changes_goal: false
  evidence:
    rating: practitioner_wisdom
    rationale: BDA and Dyslexia Scotland style guidance (clm-ACC-emph-bold).
  render_settings:
    emphasis: bold
    italics: false
    underline: false
    all_caps_for_emphasis: false
    max_bold_phrases_per_block: 3
  claims:
  - clm-ACC-emph-bold
  - clm-ACC-emph-no-caps
  - clm-ACC-emph-key-actions
- id: fmt-ACC-left-aligned-ragged-right
  type: format_rule
  title: Left aligned, ragged right, single column, short lines
  summary: Align text left without justification, in one column, with lines of about 60 to 70 characters.
  body: '- Left align all body text; never justify (uneven word gaps create ''rivers'').

    - Use one column; avoid newspaper-style columns on worksheets.

    - Keep lines short (about 60 to 70 characters, never more than 80).

    - Turn off automatic hyphenation.

    '
  status: draft
  version: '0.1'
  curated_by:
  - ACC
  facets:
    jurisdiction:
    - scotland
    cfe_level:
    - early
    - first
    - second
    - third
    - fourth
    - senior
    curriculum_area:
    - all
    artefact_type:
    - slides
    - worksheet
    - form
    barrier:
    - decoding
    - reading_fluency
    - visual_tracking
    access_dimension: layout
    changes_goal: false
  evidence:
    rating: practitioner_wisdom
    rationale: BDA, Dyslexia Scotland and WCAG 1.4.8 agree (clm-ACC-align-left, clm-ACC-align-wcag).
  render_settings:
    text_align: left
    justify: false
    hyphenation: false
    columns: 1
    max_line_length_chars: 70
  claims:
  - clm-ACC-align-left
  - clm-ACC-align-wcag
  - clm-ACC-line-length
- id: fmt-ACC-readable-font-size
  type: format_rule
  title: Plain sans serif font at a readable size
  summary: Use a plain, evenly spaced sans serif font, at least 12 point in print (14 preferred for pupils).
  body: '- Default font: a plain sans serif such as Arial, Verdana, Calibri, Century Gothic or Tahoma.

    - Body text at least 12 point in print; 14 point is a sensible default for P7 and S1 worksheets.

    - No decorative, handwriting-style or oblique fonts; avoid ligatures.

    - Do not switch a whole class to a specialist "dyslexia font": research shows no reading benefit (see
    cau-ACC-dyslexia-fonts). An individual pupil may use a preferred font.

    '
  status: draft
  version: '0.1'
  curated_by:
  - ACC
  facets:
    jurisdiction:
    - scotland
    cfe_level:
    - early
    - first
    - second
    - third
    - fourth
    - senior
    curriculum_area:
    - all
    artefact_type:
    - slides
    - worksheet
    - form
    barrier:
    - decoding
    - reading_fluency
    - visual_access
    access_dimension: layout
    changes_goal: false
  evidence:
    rating: practitioner_wisdom
    rationale: Style guides recommend sans serif; trials find no advantage for specialist fonts (clm-ACC-font-no-special-advantage).
  relations:
    caution_from:
    - cau-ACC-dyslexia-fonts
  render_settings:
    font_family:
    - Arial
    - Verdana
    - Calibri
    - Century Gothic
    - Tahoma
    font_class: sans-serif
    body_size_pt_min: 12
    body_size_pt_default: 14
    body_size_px_screen_min: 16
    decorative_fonts: false
    ligatures: false
    learner_override_allowed: true
  claims:
  - clm-ACC-font-sans
  - clm-ACC-font-no-special-advantage
  - clm-ACC-font-size
- id: fmt-ACC-text-spacing
  type: format_rule
  title: Generous line and paragraph spacing; tolerate user spacing
  summary: 1.5 line spacing, clear space between paragraphs, and layouts that survive increased letter
    and word spacing.
  body: '- Line spacing 1.5 for all body text.

    - Paragraph spacing about twice the font size; extra space before headings.

    - Build artefacts (text boxes, tables, answer lines) so they do not break if letter spacing is raised
    to 0.12 em or more and word spacing to 0.16 em or more. Individual pupils may need wider letter spacing
    (see adp-ACC-individual-spacing-background).

    '
  status: draft
  version: '0.1'
  curated_by:
  - ACC
  facets:
    jurisdiction:
    - scotland
    cfe_level:
    - early
    - first
    - second
    - third
    - fourth
    - senior
    curriculum_area:
    - all
    artefact_type:
    - slides
    - worksheet
    - form
    barrier:
    - decoding
    - reading_fluency
    - visual_tracking
    access_dimension: layout
    changes_goal: false
  evidence:
    rating: moderate
    rationale: WCAG 2.2 standard plus dyslexia style guides (clm-ACC-spacing-line, clm-ACC-spacing-tolerate).
  render_settings:
    line_spacing: 1.5
    paragraph_spacing_em: 2.0
    space_before_heading_em: 1.0
    must_tolerate_letter_spacing_em: 0.12
    must_tolerate_word_spacing_em: 0.16
    fixed_height_text_boxes: false
  claims:
  - clm-ACC-spacing-line
  - clm-ACC-spacing-tolerate
  - clm-ACC-spacing-paragraph
- id: fmt-ACC-uncluttered-white-space
  type: format_rule
  title: Uncluttered layout with white space
  summary: Plain background, no decorative images, white space grouping related content.
  body: '- Plain single-colour background; no watermarks, borders of clip art or background photos.

    - Only include images that carry meaning (a source, a labelled diagram, a vocabulary picture).

    - Use white space to group a question with its answer area and separate tasks.

    - Avoid multi-column layouts and text wrapped around images.

    '
  status: draft
  version: '0.1'
  curated_by:
  - ACC
  facets:
    jurisdiction:
    - scotland
    cfe_level:
    - early
    - first
    - second
    - third
    - fourth
    - senior
    curriculum_area:
    - all
    artefact_type:
    - slides
    - worksheet
    - form
    barrier:
    - sensory_load
    - attention
    - visual_tracking
    access_dimension: layout
    changes_goal: false
  evidence:
    rating: practitioner_wisdom
    rationale: Dyslexia style guides and Autism Toolbox sensory guidance (clm-ACC-clutter-white-space).
  render_settings:
    background_images: false
    decorative_images: false
    watermark: false
    columns: 1
    text_wrap_around_images: false
    block_gap_em: 1.5
  claims:
  - clm-ACC-clutter-white-space
  - clm-ACC-clutter-plain-background
  - clm-ACC-clutter-sensory
- id: fmt-ACC-one-task-per-block
  type: format_rule
  title: One task per block (chunking)
  summary: Each numbered block holds one task, short sentences, key information first.
  body: '- One task per numbered block, with its answer space directly beneath.

    - Sentences of about 25 words or fewer; paragraphs of about five lines or fewer.

    - Put the key information or action first in each block.

    - Break long tasks into smaller, sequenced steps under clear sub-headings.

    '
  status: draft
  version: '0.1'
  curated_by:
  - ACC
  facets:
    jurisdiction:
    - scotland
    cfe_level:
    - early
    - first
    - second
    - third
    - fourth
    - senior
    curriculum_area:
    - all
    artefact_type:
    - worksheet
    - form
    - slides
    barrier:
    - working_memory
    - attention
    - reading_fluency
    access_dimension: structure
    changes_goal: false
  evidence:
    rating: practitioner_wisdom
    rationale: Style guidance and EEF advice on small steps (clm-ACC-chunk-headings, clm-ACC-chunk-small-steps).
  relations:
    uses_principle:
    - prn-EVD-explicit-instruction
    - prn-EVD-scaffolding
  render_settings:
    tasks_per_block: 1
    number_tasks: true
    answer_space_below_task: true
    max_sentence_words: 25
    max_paragraph_lines: 5
    key_information_first: true
  claims:
  - clm-ACC-chunk-headings
  - clm-ACC-chunk-short-sentences
  - clm-ACC-chunk-small-steps
  - clm-ACC-chunk-one-at-a-time
- id: fmt-ACC-plain-language-instructions
  type: format_rule
  title: Plain language instructions
  summary: Active, positive, numbered instructions in everyday words, with every input clearly labelled.
  body: '- Write instructions in the active voice, starting with the verb ("Underline", "Write", "Compare").

    - Say what to do, not what not to do; no double negatives.

    - Use a numbered list for multi-step instructions.

    - Spell out abbreviations on first use; put subject terms in a glossary or word bank.

    - Label every answer space or form field.

    '
  status: draft
  version: '0.1'
  curated_by:
  - ACC
  facets:
    jurisdiction:
    - scotland
    cfe_level:
    - early
    - first
    - second
    - third
    - fourth
    - senior
    curriculum_area:
    - all
    artefact_type:
    - slides
    - worksheet
    - form
    - lesson_plan
    - interaction
    barrier:
    - language_comprehension
    - working_memory
    - figurative_language
    access_dimension: instructions
    changes_goal: false
  evidence:
    rating: practitioner_wisdom
    rationale: BDA writing guidance, NAS, WCAG 3.3.2, EEF explicit instruction (clm-ACC-plain-active).
  render_settings:
    voice: active
    double_negatives: false
    negative_instructions: avoid
    multi_step_format: numbered_list
    abbreviations_expanded_first_use: true
    field_labels_required: true
  claims:
  - clm-ACC-plain-active
  - clm-ACC-plain-lists
  - clm-ACC-plain-positive
  - clm-ACC-plain-labels
  - clm-ACC-plain-unambiguous
- id: fmt-ACC-colour-contrast-background
  type: format_rule
  title: Colour, contrast and background
  summary: Dark text on an off-white background with at least 4.5:1 contrast; never rely on colour alone.
  body: '- Default: dark grey or black text on off-white or cream, not pure white.

    - Contrast at least 4.5:1 for body text (3:1 for large text).

    - Never use colour as the only signal (for example "the red answers are wrong"); add a label, symbol
    or bold word.

    - Avoid red and green pairings.

    - Print on matt paper where possible.

    '
  status: draft
  version: '0.1'
  curated_by:
  - ACC
  facets:
    jurisdiction:
    - scotland
    cfe_level:
    - early
    - first
    - second
    - third
    - fourth
    - senior
    curriculum_area:
    - all
    artefact_type:
    - slides
    - worksheet
    - form
    barrier:
    - visual_access
    - sensory_load
    - decoding
    access_dimension: sensory
    changes_goal: false
  evidence:
    rating: moderate
    rationale: WCAG 2.2 contrast and colour criteria plus dyslexia guidance (clm-ACC-colour-contrast).
  render_settings:
    background_colour: '#FFFBEF'
    text_colour: '#1A1A1A'
    pure_white_background: false
    min_contrast_ratio: 4.5
    min_contrast_ratio_large_text: 3.0
    colour_only_meaning: false
    avoid_red_green_pairs: true
    paper_finish: matt
  claims:
  - clm-ACC-colour-contrast
  - clm-ACC-colour-not-white
  - clm-ACC-colour-not-sole
  - clm-ACC-colour-red-green
- id: fmt-ACC-heading-hierarchy
  type: format_rule
  title: Consistent heading hierarchy
  summary: Real, descriptive headings, larger and bolder than body text, used the same way across a lesson's
    artefacts.
  body: '- Use built-in heading styles (Heading 1, 2, 3), not just bigger text, so screen readers and
    text-to-speech can navigate.

    - Headings at least 20% larger than body text and bold; never smaller than body text.

    - Headings describe content ("Task 2: Compare the two sources"), not "Part B".

    - Use the same labels and icons for the same things across slides, worksheet and form (for example
    "Talk partner" always means the same routine).

    '
  status: draft
  version: '0.1'
  curated_by:
  - ACC
  facets:
    jurisdiction:
    - scotland
    cfe_level:
    - early
    - first
    - second
    - third
    - fourth
    - senior
    curriculum_area:
    - all
    artefact_type:
    - slides
    - worksheet
    - form
    - lesson_plan
    barrier:
    - predictability
    - working_memory
    - visual_access
    access_dimension: structure
    changes_goal: false
  evidence:
    rating: moderate
    rationale: WCAG 1.3.1, 2.4.6, 3.2.4 and dyslexia style guidance (clm-ACC-head-styles).
  render_settings:
    semantic_headings: true
    heading_min_scale: 1.2
    heading_weight: bold
    skip_heading_levels: false
    consistent_labels_across_artefacts: true
  claims:
  - clm-ACC-head-size
  - clm-ACC-head-styles
  - clm-ACC-head-descriptive
  - clm-ACC-head-consistent
- id: fmt-ACC-accessible-slides
  type: format_rule
  title: Accessible slides
  summary: Sparse, large text, one idea per slide, alt text on meaningful images, and a shareable accessible
    copy.
  body: '- One idea per slide; text sparing and large (32 point suggested minimum for slide text).

    - Use the slide''s title placeholder for a unique, descriptive title.

    - Give meaningful images alt text; mark decorative images as decorative.

    - Pair key words with an image or diagram, not decoration.

    - Share the deck in an editable format so pupils can use text-to-speech or change font and colour.

    '
  status: draft
  version: '0.1'
  curated_by:
  - ACC
  facets:
    jurisdiction:
    - scotland
    cfe_level:
    - early
    - first
    - second
    - third
    - fourth
    - senior
    curriculum_area:
    - all
    artefact_type:
    - slides
    barrier:
    - visual_access
    - reading_fluency
    - sensory_load
    - working_memory
    access_dimension: representation
    changes_goal: false
  evidence:
    rating: practitioner_wisdom
    rationale: Dyslexia Scotland format guidance and WCAG 1.1.1 (clm-ACC-slides-sparse).
  render_settings:
    min_slide_font_pt: 32
    ideas_per_slide: 1
    unique_slide_titles: true
    alt_text_required: true
    decorative_images_marked: true
    shared_format: editable
    background: plain
  claims:
  - clm-ACC-slides-sparse
  - clm-ACC-slides-alt-text
  - clm-ACC-slides-formats
  - clm-ACC-slides-dual
- id: adp-ACC-text-to-speech
  type: adaptation
  title: Text-to-speech and read aloud
  summary: Let the pupil hear text read aloud, using a Scottish computer voice or an adult reader, so
    decoding does not block access to content.
  body: 'Provide the text digitally (editable Word, Google Doc or accessible PDF) so a text-to-speech
    tool can read it. In Scotland, Scottish-accented voices are free to schools through CALL Scotland.
    Check the pupil can start, pause and replay. Where the purpose of the task is decoding practice, use
    text-to-speech for instructions only.

    '
  status: draft
  version: '0.1'
  curated_by:
  - ACC
  facets:
    jurisdiction:
    - scotland
    cfe_level:
    - second
    - third
    stage:
    - p7
    - s1
    curriculum_area:
    - all
    artefact_type:
    - worksheet
    - slides
    - form
    barrier:
    - decoding
    - reading_fluency
    - visual_access
    access_dimension: representation
    changes_goal: false
    often_relevant_to:
    - dyslexia
    - visual impairment
    - EAL
    - developmental language disorder
  evidence:
    rating: practitioner_wisdom
    rationale: Scottish assistive technology provision and dyslexia format guidance (clm-ACC-tts-scottish-voice).
  risks:
  - In a P7 reading lesson where independent decoding is the goal, reading the text aloud changes the
    task; restrict to instructions.
  - Scanned images of text cannot be read aloud; supply real text.
  render_settings:
    tts_compatible: true
    provide_editable_copy: true
    scanned_text_images: false
  artefact_recipes:
    worksheet: Supply an editable copy alongside print; put each task's text in real text, not images.
    slides: Share the deck in an editable format so it can be read aloud.
    interaction: 'S1 history: pupil listens to the primary source through headphones while peers read
      silently.'
  claims:
  - clm-ACC-tts-scottish-voice
  - clm-ACC-tts-call-tools
  - clm-ACC-tts-offer
  - clm-ACC-tts-technology
- id: adp-ACC-individual-spacing-background
  type: adaptation
  title: Individual letter spacing, font size and background preferences
  summary: Widen letter and word spacing and change background tint for a pupil, tuned to what they find
    easiest.
  body: 'Start from the baseline format rules, then trial with the pupil: wider letter spacing (towards
    0.35 em), word spacing in proportion, larger text, and a tinted background such as cream or pale yellow.
    Record what works in the pupil''s profile as overrides. Preferences vary, so ask rather than assume.

    '
  status: draft
  version: '0.1'
  curated_by:
  - ACC
  facets:
    jurisdiction:
    - scotland
    cfe_level:
    - second
    - third
    stage:
    - p7
    - s1
    curriculum_area:
    - all
    artefact_type:
    - worksheet
    - slides
    - form
    barrier:
    - decoding
    - reading_fluency
    - sensory_load
    - visual_crowding
    access_dimension: layout
    changes_goal: false
    often_relevant_to:
    - dyslexia
    - visual impairment
  evidence:
    rating: moderate
    rationale: Trial evidence that extra letter spacing helps children with dyslexia (clm-ACC-spacing-zorzi).
  risks:
  - Very wide spacing can reduce readability; tune to the reader.
  - Coloured backgrounds are a comfort preference, not a treatment for dyslexia.
  render_settings:
    letter_spacing_em_options:
    - 0.12
    - 0.35
    word_spacing_ratio_to_letter: 3.5
    line_spacing: 1.5
    background_options:
    - cream
    - pale_yellow
    - off_white
    - pastel_blue
    font_size_pt_options:
    - 14
    - 16
    - 18
    learner_override: true
  artefact_recipes:
    worksheet: Generate a personal copy with the pupil's stored spacing, size and tint; keep page breaks
      at task boundaries.
    slides: Give the pupil a digital copy they can view with their own settings.
  claims:
  - clm-ACC-spacing-zorzi
  - clm-ACC-spacing-preference
  - clm-ACC-spacing-not-font
  - clm-ACC-bg-preference
- id: adp-ACC-preferred-font
  type: adaptation
  title: Pupil-preferred font
  summary: Allow an individual pupil to use a font they find comfortable, without assuming a dyslexia
    font will help.
  body: 'Offer a choice of plain fonts in digital copies. If a pupil prefers a specialist font, they may
    use it, but do not change class materials for it and do not treat it as support for reading difficulties.

    '
  status: draft
  version: '0.1'
  curated_by:
  - ACC
  facets:
    jurisdiction:
    - scotland
    cfe_level:
    - second
    - third
