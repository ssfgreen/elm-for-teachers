      (d = 0.30) and WWC rates deep questioning strong; history-specific trial evidence was not located;
      see clm-EVD-gi-01.
  prerequisites:
  - Core knowledge of the topic has been taught
  - Pupils have practised the analysis procedure with a model
  risks:
