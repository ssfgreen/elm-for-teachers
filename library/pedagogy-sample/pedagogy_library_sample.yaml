    - form
    - lesson_plan
    - interaction
  evidence:
    rating: not_recommended
    rationale: EEF finds insufficient evidence and notes risks; Pashler et al. found no adequate evidence
      base; see clm-EVD-ls-01 and clm-EVD-ls-02.
  prerequisites: []
  risks:
  - Lower expectations from labelling, particularly for disadvantaged pupils.
  - Time spent producing style-matched materials displaces effective practice.
  relations:
    conflicts_with:
    - prn-EVD-dual-coding
    - prn-EVD-formative-assessment
  artefact_recipes:
    slides: 'Do not produce separate "visual", "auditory" and "kinaesthetic" versions. Use one well-designed
      slide that combines a relevant visual with spoken explanation for all pupils (see prn-EVD-dual-coding).

      '
    worksheet: 'Do not assign worksheets by learning style. Differentiate by prior knowledge and barrier
      instead (for example, a P7 English pupil with decoding difficulty gets a read-aloud option; an S1
      history pupil with gaps in chronology gets a timeline scaffold).

      '
    form: 'Do not use learning-style questionnaires. Use a short prior-knowledge check instead.

      '
    lesson_plan: 'Replace "VAK" planning columns with planned checks for understanding and planned scaffolds.

      '
    interaction: 'Avoid telling pupils "you are a visual learner"; talk instead about strategies that
      help with this task.

      '
