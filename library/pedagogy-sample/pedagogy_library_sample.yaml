- id: cau-HIS-generic-source-questions
  type: caution
  title: Avoid generic source questions and 'bias = bad' in S1
  summary: Do not drill exam-style generic source questions or teach that biased sources are useless;
    evaluate sources for a specific historical question and avoid generic 5Ws heuristics.
  body: 'In S1, source work should serve the enquiry question. Teaching a one-size routine ("Who wrote
