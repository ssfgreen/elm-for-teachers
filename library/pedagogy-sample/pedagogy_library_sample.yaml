- id: act-HIS-historical-perspective-in-role
  type: activity_type
  title: 'Historical perspective and writing in role: evidence-grounded, used selectively'
  summary: Help pupils understand how people in the past saw their world, using evidence and context;
    writing in role is acceptable only when grounded in evidence and never for atrocity topics.
  body: 'Treat historical empathy as a disciplinary task: pupils reconstruct attitudes and values from
    evidence and context, and recognise how they differ from our own. Writing in role (a letter or diary
    of a contemporary) can be appropriate for everyday life topics (for example an 18th-century Edinburgh
    resident) if pupils must cite evidence and a debrief separates historical reconstruction from imagination.

    Do not use it where pupils would identify with victims or perpetrators of atrocity or genocide; for
    such topics prefer an observer position and follow cau-HIS-holocaust-no-simulation.

