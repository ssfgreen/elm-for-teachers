- id: sig-LIT-reciprocal-reading
  type: signature_pedagogy
  title: Reciprocal reading (predict, question, clarify, summarise)
  summary: Pupils learn four comprehension moves through teacher modelling, then take turns leading small-group
    dialogue about a text while the teacher fades support.
  body: "**What it is.** A structured dialogue about a text, segment by segment, using four\nmoves: predict,\
    \ question, clarify, summarise. The teacher models all four, then\npupils take turns as discussion\
    \ leader.\n\n**How to run it at P7.**\n1. Model each move with think-aloud on a short text (one move\
    \ per lesson at first).\n2. Give role cards with sentence starters (\"I predict... because...\", \"\
    I wonder why...\",\n   \"A word I need to clarify is... I worked it out by...\", \"In a few words,\
    \ this part is about...\").\n3. Groups of four read a section, each leading one move; rotate roles.\n\
    4. Fade: whole-class modelling, then groups, then pairs, then individual use.\n\n**Evidence in brief.**\
    \ Strong underlying evidence for comprehension strategy\nteaching; the EEF trial suggests the targeted\
    \ small-group version is more reliable\nthan a whole-class roll-out.\n"
