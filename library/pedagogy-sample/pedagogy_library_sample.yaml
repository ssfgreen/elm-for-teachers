- id: sig-LIT-modelled-shared-writing
  type: signature_pedagogy
  title: Modelled and shared writing with think-aloud
  summary: The teacher composes live in front of pupils, voicing decisions aloud, then composes with them
    before pupils write independently.
  body: '**Modelled writing (I do).** Teacher writes a short section (for example the opening

    of a persuasive letter) and thinks aloud about audience, word choice, sentence

    structure and rereading.

    **Shared writing (we do).** Pupils suggest, teacher questions and refines ("Is

    there a more precise word? Does this sentence do what we want?").

    **Guided and independent writing (you do).** Pupils write the next section, using

    the shared text as a model.


    Re-model as needed: the writing process is not linear.

    '
