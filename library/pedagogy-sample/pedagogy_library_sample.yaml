- id: prn-EVD-guided-inquiry
  type: principle
  title: Guided inquiry with deep questions
  summary: After key knowledge is taught, have pupils investigate questions with substantial guidance
    (scaffolds, worked examples, feedback, prompts to explain), rather than unassisted discovery.
  body: '**What it is.** Pupils pursue an enquiry question (for example, a historical question answered
    from sources) with structured support: modelled procedures, scaffolded tasks, prompts to explain their
    reasoning and timely feedback.


    **How to do it.**

    - Teach the background knowledge first; deep questions need it.

    - Pose and model deep questions (why, how, what if, what is the evidence?).

    - Scaffold the enquiry: provide selected sources, a process, worked example of an analysis.

    - Require pupils to explain their reasoning and give feedback.

    - Fade guidance as pupils gain expertise.


    The contested alternative, minimally guided discovery, is described in prn-EVD-minimally-guided-discovery-pbl.

    '
