      "Why did the Scots win at Bannockburn?" with a teacher-modelled reading of one source. P7 English:
      "How does the author build tension in chapter 5?" with a modelled analysis of the first paragraph.

      '
    worksheet: 'Enquiry booklet with selected sources, guiding questions per source and a final claim-evidence-reasoning
      frame. S1 history: three short sources on Mary Queen of Scots. P7 English: three extracts showing
      a character changing.

      '
    lesson_plan: 'Lesson 1 knowledge and model; lesson 2 guided enquiry in pairs with teacher feedback;
      lesson 3 pupils write a reasoned answer.

      '
    interaction: 'Teacher poses deep questions ("What is your evidence? What if this source is biased?")
      and asks pupils to explain aloud.

