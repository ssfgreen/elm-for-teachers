- id: act-LIT-close-reading
  type: activity_type
  title: Close reading of a short complex passage (bridge to S1)
  summary: Repeated, purposeful rereading of a short, challenging extract with annotation, text-dependent
    questions and discussion, preparing pupils for secondary analysis.
  body: "1. Choose a short extract (a few paragraphs) that is demanding but not overwhelming.\n2. First\
    \ read: what is it about? (minimal frontloading)\n3. Second read with annotation: underline key ideas,\
    \ circle unclear words, margin notes.\n4. Text-dependent questions in sequence: what it says, how\
    \ it works (word choice,\n   structure), what it means (inference, author's purpose).\n5. Pair and\
    \ group discussion requiring evidence (\"Which words show that?\").\n6. Short written response using\
    \ a quotation.\n\nUse alongside, not instead of, read-alouds, guided reading and independent reading.\n"
