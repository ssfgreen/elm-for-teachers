- id: sig-LIT-writing-strategy-instruction
  type: signature_pedagogy
  title: Writing process with explicit planning and revision strategies
  summary: Teach pupils named strategies for planning, drafting, revising and editing, with clear product
    goals and checklists they gradually own.
  body: "1. Set specific product goals (for example \"give three reasons with evidence\").\n2. Teach a\
    \ planning strategy (for example a boxed plan for a persuasive text) by\n   modelling, then guided\
    \ practice.\n3. Draft from the plan.\n4. Revise against the goals: reread, check each goal, improve\
    \ one paragraph.\n5. Edit for spelling and punctuation separately from revising for meaning.\n6. Fade\
    \ support: pupils write their own goals and checklists.\n\nCollaborative planning and peer revision\
    \ partners add further benefit.\n"
