- id: cau-ACC-needs-not-labels
  type: caution
  title: Plan from the individual's needs, not from labels
  summary: Choose adaptations by barrier and by what works for this pupil; diagnostic labels are hints
    only.
  body: 'The often_relevant_to field on adaptations is a hint, never a rule. Start from the observed barrier
    (for example decoding, processing speed, sensory load), trial an adaptation, ask the pupil, and keep
    what works. Do not wait for a diagnosis before adapting, and do not assume every pupil with a label
    needs the same adaptations.

    '
