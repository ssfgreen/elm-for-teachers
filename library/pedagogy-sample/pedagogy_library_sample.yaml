  artefact_recipes:
    lesson_plan: 'Do not launch a project with "find out about..." and no teaching. Instead: P7 English,
      a class newspaper project where the features of a report are taught and modelled first, with checkpoints
      and feedback on drafts. S1 history, a "Scottish Wars of Independence museum exhibit" project where
      chronology and key figures are taught first, sources are pre-selected and each exhibit label follows
      a modelled claim-evidence frame.

      '
