- id: act-LIT-structured-talk-oracy
  type: activity_type
  title: Structured talk routines with talk stems and roles (oracy framework)
  summary: 'Planned, explicitly taught talk: clear tasks, roles and sentence stems drawn from an oracy
    framework, so every pupil reasons aloud before reading or writing.'
  body: '**Set up.** Agree class discussion guidelines; teach one oracy skill at a time using

    the four strands (physical, linguistic, cognitive, social and emotional).


    **Talk stems at P7.** "I agree with... because...", "Building on what X said...",

    "I''d like to challenge that because...", "Can you give an example?", "So, to

    summarise...".


    **Roles.** Instigator, builder, challenger, summariser rotate in groups of four.


    **Use.** Talk before writing (oral rehearsal), jigsaw groups on non-fiction, and

    structured discussion of the class novel.

    '
