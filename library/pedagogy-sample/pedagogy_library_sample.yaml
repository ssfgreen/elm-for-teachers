- id: act-HIS-source-analysis-scaffold
  type: activity_type
  title: 'Scaffolded source analysis: provenance, content, context, for a question'
  summary: Teach pupils to read a source as evidence for a specific question, using a short routine (who
    made it, when and why; what it says; what we know about the time; how it compares with other sources).
  body: 'Give a source with its provenance visible. Pupils work through: provenance (author, date, purpose,
    audience); content (what it says or shows, key words); context (what we already know about the period
    that helps us read it); corroboration (does another source agree?). Always frame this around the enquiry
    question: "How useful is this for finding out why...?" rather than a generic "Is it biased?".

    Use varied source types and, as pupils grow in confidence, longer extracts. Avoid exam-style generic
    source question formats in S1.

    '
