- id: prn-EVD-worked-examples
  type: principle
  title: Worked examples and faded guidance
  summary: Show complete, step-by-step solutions or models, alternate them with problems for pupils to
    try, and fade the worked steps as pupils gain expertise.
  body: '**What it is.** A worked example is a fully completed model with the steps made visible. Studying
    them reduces unproductive search for novices.


    **How to do it.**

    - Present a worked model, then a similar task for pupils to complete.

    - Alternate model and task rather than giving a block of tasks.

    - Fade: give partially completed examples (completion tasks) before full independence.

    - Label steps by their purpose so pupils see the structure.

    - In English and history, worked examples are model paragraphs, annotated source analyses and exemplar
    answers with the reasoning shown.

    '
