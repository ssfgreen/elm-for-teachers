    - cur-CUR-soc-3-06a
  artefact_recipes:
    slides: Enquiry question on every slide header; a 'where are we in the enquiry?' tracker slide at
      the start of each lesson showing which part of the answer today's knowledge builds.
    worksheet: Enquiry question in a box at the top; knowledge-gathering grid with one row per lesson;
      final box 'My answer so far' updated at the end of each lesson.
    form: 'Exit ticket: ''What did today add to our answer to the enquiry question?'' plus one retrieval
      question from a previous lesson.'
    lesson_plan: Lesson 1 hook and question; lessons 2 to 5 knowledge and sources each tied to the question;
      lesson 6 planning; lesson 7 outcome task. Note the single second-order concept in focus.
    interaction: Start each lesson with pairs restating the enquiry question and their current provisional
      answer; teacher cold-calls two pairs.
