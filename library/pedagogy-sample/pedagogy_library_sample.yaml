- id: psg-EVD-tlt-meta-headline
  source_id: src-EVD-eef-tlt-metacognition
  locator: Strand page, headline panel (impact, cost, evidence strength)
  text: High impact for very low cost based on extensive evidence.
  excerpt_type: quote
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/metacognition-and-self-regulation
  verified_by_fetch: true
- id: psg-EVD-tlt-meta-figures
  source_id: src-EVD-eef-tlt-metacognition
  locator: Strand page, headline panel and evidence strength note
  text: Average impact of about +8 months' additional progress; evidence strength rated high, drawn from
    355 studies, with one padlock removed because many studies were not independently evaluated.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/metacognition-and-self-regulation
  verified_by_fetch: true
- id: psg-EVD-tlt-meta-curriculum
  source_id: src-EVD-eef-tlt-metacognition
  locator: 'Strand page, key findings list (UNCONFIRMED: exact heading wording)'
  text: Strategies are most effective when taught and applied within normal curriculum content rather
    than as separate thinking skills lessons; teachers can model their thinking aloud and co-create planning
    checklists and self-questioning prompts.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/metacognition-and-self-regulation
  verified_by_fetch: true
- id: psg-EVD-tlt-meta-age
  source_id: src-EVD-eef-tlt-metacognition
  locator: 'Strand page, section on effectiveness by phase and subject (UNCONFIRMED: exact heading)'
  text: Effects are similar and high across early years, primary and secondary studies, with gains reported
    in literacy, mathematics and science.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/metacognition-and-self-regulation
  verified_by_fetch: true
- id: psg-EVD-tlt-meta-hard
  source_id: src-EVD-eef-tlt-metacognition
  locator: 'Strand page, key findings list (UNCONFIRMED: exact heading wording)'
  text: The high average impact can be hard to realise in practice; teachers need professional support
    to teach strategies explicitly, and teachers' own understanding of metacognition affects outcomes.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/metacognition-and-self-regulation
  verified_by_fetch: true
- id: psg-EVD-tlt-meta-collab
  source_id: src-EVD-eef-tlt-metacognition
  locator: 'Strand page, key findings list (UNCONFIRMED: exact heading wording)'
  text: Structured collaborative groups can support metacognition, but the collaboration has to be carefully
    designed; reasoning, argument and debate help pupils reflect on their own and others' learning.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/metacognition-and-self-regulation
  verified_by_fetch: true
- id: psg-EVD-tlt-rc-headline
  source_id: src-EVD-eef-tlt-reading-comp
  locator: Strand page, headline panel
  text: High impact for very low cost based on moderate evidence.
  excerpt_type: quote
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/reading-comprehension-strategies
  verified_by_fetch: true
- id: psg-EVD-tlt-rc-figures
  source_id: src-EVD-eef-tlt-reading-comp
  locator: Strand page, headline panel and 'Evidence security' section
  text: Average impact of about +7 months from 184 studies; evidence security moderate, with padlocks
    removed because many studies were not independent and results varied widely in unexplained ways.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/reading-comprehension-strategies
  verified_by_fetch: true
- id: psg-EVD-tlt-rc-teaching
  source_id: src-EVD-eef-tlt-reading-comp
  locator: Strand page, 'Teaching approach' and 'Text type' sections
  text: Teachers should model strategies explicitly and then move pupils through guided towards independent
    practice; texts should be engaging, suitably challenging and connected to pupils' prior knowledge.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/reading-comprehension-strategies
  verified_by_fetch: true
- id: psg-EVD-tlt-rc-diagnosis
  source_id: src-EVD-eef-tlt-reading-comp
  locator: Strand page, 'Struggling readers' section
  text: For pupils who struggle, accurate diagnosis matters because the difficulty may lie in decoding,
    sentence structure or vocabulary rather than comprehension strategies; this is especially important
    for older readers.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/reading-comprehension-strategies
  verified_by_fetch: true
- id: psg-EVD-tlt-fb-figures
  source_id: src-EVD-eef-tlt-feedback
  locator: Strand page, headline panel and evidence strength note
  text: Average impact of about +6 months from 155 studies; evidence strength high, with one padlock removed
    because many studies were not randomised controlled trials.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/feedback
  verified_by_fetch: true
- id: psg-EVD-tlt-fb-focus
  source_id: src-EVD-eef-tlt-feedback
  locator: 'Strand page, key findings (UNCONFIRMED: exact heading wording)'
  text: The most effective feedback focuses on the task, the subject or self-regulation and gives specific
    guidance on how to improve; feedback should also be given when work is correct.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/feedback
  verified_by_fetch: true
- id: psg-EVD-tlt-fb-phase
  source_id: src-EVD-eef-tlt-feedback
  locator: 'Strand page, impact by phase and method (UNCONFIRMED: exact heading wording)'
  text: Primary pupils show slightly larger gains (+7 months) than secondary pupils (+5 months); verbal
    feedback shows slightly higher impact (+7 months), and written marking is optional rather than required.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/feedback
  verified_by_fetch: true
- id: psg-EVD-tlt-oral-figures
  source_id: src-EVD-eef-tlt-oral-language
  locator: Strand page, headline panel and evidence strength note
  text: Average impact of about +6 months from 188 studies; evidence strength high, with one padlock removed
    because many studies were not independently evaluated.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/oral-language-interventions
  verified_by_fetch: true
- id: psg-EVD-tlt-oral-dialogic
  source_id: src-EVD-eef-tlt-oral-language
  locator: Strand page, 'Interactions' section
  text: Dialogic teaching treats talk as a tool for building understanding, thinking and metacognition,
    including questioning, modelling strategies by thinking aloud and structuring classroom talk.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/oral-language-interventions
  verified_by_fetch: true
- id: psg-EVD-tlt-oral-curriculum
  source_id: src-EVD-eef-tlt-oral-language
  locator: Strand page, 'Integration with curriculum' section
  text: The strongest evidence comes from approaches built into the existing curriculum; vocabulary work
    works best when linked to current classroom content and involves active use of new words.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/oral-language-interventions
  verified_by_fetch: true
- id: psg-EVD-tlt-oral-age
  source_id: src-EVD-eef-tlt-oral-language
  locator: 'Strand page, effectiveness by age (UNCONFIRMED: exact heading wording)'
  text: Approaches appear similarly effective across age groups, though more studies come from early years
    and primary than from secondary; most measured outcomes are reading comprehension.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/oral-language-interventions
  verified_by_fetch: true
- id: psg-EVD-tlt-collab-figures
  source_id: src-EVD-eef-tlt-collaborative
  locator: Strand page, headline panel and evidence security note
  text: Average impact of about +5 months from 212 studies, but evidence security is low, with three padlocks
    removed for few recent studies, lack of independent evaluation and large unexplained variation.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/collaborative-learning-approaches
  verified_by_fetch: true
- id: psg-EVD-tlt-collab-structure
  source_id: src-EVD-eef-tlt-collaborative
  locator: Strand page, discussion of group size and task structure (no explicit heading in fetched text)
  text: Groups of three to five working towards a shared outcome are most promising; structured, well-designed
    tasks give larger gains than simply seating pupils together, and tasks must ensure every pupil participates.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/collaborative-learning-approaches
  verified_by_fetch: true
- id: psg-EVD-tlt-collab-phase
  source_id: src-EVD-eef-tlt-collaborative
  locator: Strand page, discussion of age and subject differences (no explicit heading in fetched text)
  text: Gains are slightly larger in secondary (+6 months) than primary (+5 months), and smaller in literacy
    (+3 months) than in science; too much inter-group competition can shift focus from learning to winning.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/collaborative-learning-approaches
  verified_by_fetch: true
- id: psg-EVD-tlt-collab-gap
  source_id: src-EVD-eef-tlt-collaborative
  locator: Strand page, discussion of disadvantaged and low-attaining pupils (no explicit heading in fetched
    text)
  text: If high attainers do the problem solving while others contribute little, collaborative work may
    widen attainment gaps.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/collaborative-learning-approaches
  verified_by_fetch: true
- id: psg-EVD-tlt-ls-headline
  source_id: src-EVD-eef-tlt-learning-styles
  locator: Strand page, headline panel
  text: Unclear impact for very low cost based on insufficient evidence
  excerpt_type: quote
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/learning-styles
  verified_by_fetch: true
- id: psg-EVD-tlt-ls-evidence
  source_id: src-EVD-eef-tlt-learning-styles
  locator: 'Strand page, evidence summary (UNCONFIRMED: exact heading wording)'
  text: No studies met the review's inclusion criteria; there is little reliable evidence for a consistent
    set of learning styles, and people's preferences shift across situations and over time.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/learning-styles
  verified_by_fetch: true
- id: psg-EVD-tlt-ls-risks
  source_id: src-EVD-eef-tlt-learning-styles
  locator: 'Strand page, risks and implementation notes (UNCONFIRMED: exact heading wording)'
  text: Restricting pupils to activities matched to a supposed style may slow progress, especially in
    primary; labelling pupils can lower expectations and their belief that effort pays off.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/learning-styles
  verified_by_fetch: true
- id: psg-EVD-tlt-ls-alternatives
  source_id: src-EVD-eef-tlt-learning-styles
  locator: 'Strand page, alternatives section (UNCONFIRMED: exact heading wording)'
  text: Schools are pointed instead towards understanding differences in prior knowledge and barriers,
    responsive teaching and feedback, and helping pupils plan, monitor and evaluate their learning.
  excerpt_type: paraphrase
  fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/learning-styles
  verified_by_fetch: true
