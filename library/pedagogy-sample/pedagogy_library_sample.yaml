      trial-tested as a package (clm-HIS-enquiry-organises).
  prerequisites:
  - Teacher has mapped the substantive content needed to answer the question
  risks:
  - Treating enquiry as open discovery with pupils left to find knowledge unaided
  - Questions that mix several second-order concepts and blur the argument
  relations:
    uses_principle:
    - prn-EVD-guided-inquiry
