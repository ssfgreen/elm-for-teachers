  text: Learners spell most of the words they need correctly, using spelling rules, specialist vocabulary,
    self-correction and resources.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
