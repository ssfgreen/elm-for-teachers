- id: act-HIS-object-handling
  type: activity_type
  title: 'Object-based learning: handling and questioning objects as evidence'
  summary: Pupils examine real or replica objects (from a museum loan box or visit) using structured see,
    feel, think, wonder prompts and then use them as evidence for an enquiry question.
  body: 'Give small groups an object (or replica) with a prompt card. Stage 1: observe and describe (see,
    feel). Stage 2: infer (what was it for, who used it, what does it suggest about their lives?). Stage
    3: wonder (what questions would we need other sources to answer?). Then connect inferences to the
    enquiry question and note limits of the object as evidence. Scottish loan boxes and museum resources
    (Historic Environment Scotland, National Museums Scotland) support this.

