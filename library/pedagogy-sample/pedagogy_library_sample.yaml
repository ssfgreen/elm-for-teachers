passages:
- id: psg-ACC-bda-fonts
  source_id: src-ACC-bda-style-guide-2023
  locator: Section 'Readable fonts'
  text: Recommends a sans serif font such as Arial or Comic Sans, with Verdana, Tahoma, Century Gothic,
    Trebuchet, Calibri or Open Sans as alternatives, at 12 to 14 point (about 16 to 19 px); some readers
    need larger text.
  excerpt_type: paraphrase
  fetched_url: https://www.bdadyslexia.org.uk/advice/employers/creating-a-dyslexia-friendly-workplace/dyslexia-friendly-style-guide
  verified_by_fetch: true
- id: psg-ACC-bda-spacing
  source_id: src-ACC-bda-style-guide-2023
  locator: Section 'Readable fonts'
  text: Advises letter spacing of roughly 35% of the average letter width (more than this harms readability),
    word spacing at least 3.5 times the letter spacing, and line spacing of about 1.5, scaled with word
    spacing.
  excerpt_type: paraphrase
  fetched_url: https://www.bdadyslexia.org.uk/advice/employers/creating-a-dyslexia-friendly-workplace/dyslexia-friendly-style-guide
  verified_by_fetch: true
- id: psg-ACC-bda-emphasis
  source_id: src-ACC-bda-style-guide-2023
  locator: Section 'Readable fonts'
  text: Advises against underlining and italics because they make text look crowded; bold should be used
    for emphasis, and capitals should be avoided, especially in continuous text.
  excerpt_type: paraphrase
  fetched_url: https://www.bdadyslexia.org.uk/advice/employers/creating-a-dyslexia-friendly-workplace/dyslexia-friendly-style-guide
  verified_by_fetch: true
- id: psg-ACC-bda-headings
  source_id: src-ACC-bda-style-guide-2023
  locator: Section 'Headings and structure'
  text: Headings should be at least 20% larger than body text, optionally bold, built with the word processor's
    heading styles so assistive technology can read the structure, with extra space around headings and
    between paragraphs.
  excerpt_type: paraphrase
  fetched_url: https://www.bdadyslexia.org.uk/advice/employers/creating-a-dyslexia-friendly-workplace/dyslexia-friendly-style-guide
  verified_by_fetch: true
- id: psg-ACC-bda-colour
  source_id: src-ACC-bda-style-guide-2023
  locator: Section 'Colour'
  text: Use a single plain background colour with no patterns or pictures, sufficient contrast, and dark
    text on a light background that is not pure white (cream or a soft pastel); avoid green with red or
    pink; prefer matt paper thick enough to stop show-through.
  excerpt_type: paraphrase
  fetched_url: https://www.bdadyslexia.org.uk/advice/employers/creating-a-dyslexia-friendly-workplace/dyslexia-friendly-style-guide
  verified_by_fetch: true
- id: psg-ACC-bda-layout
  source_id: src-ACC-bda-style-guide-2023
  locator: Section 'Layout'
  text: Left-align text and do not justify it; avoid multi-column layouts; keep text runs short (around
    60 to 70 characters); use white space to reduce clutter and group related content; use regular headings
    in long documents.
  excerpt_type: paraphrase
  fetched_url: https://www.bdadyslexia.org.uk/advice/employers/creating-a-dyslexia-friendly-workplace/dyslexia-friendly-style-guide
  verified_by_fetch: true
- id: psg-ACC-bda-writing
  source_id: src-ACC-bda-style-guide-2023
  locator: Section 'Writing style'
  text: Write in the active voice with short paragraphs and plain everyday language; give clear instructions
    without double negatives; spell out abbreviations on first use and provide a glossary of abbreviations
    and jargon.
  excerpt_type: paraphrase
  fetched_url: https://www.bdadyslexia.org.uk/advice/employers/creating-a-dyslexia-friendly-workplace/dyslexia-friendly-style-guide
  verified_by_fetch: true
- id: psg-ACC-bda-lists-images
  source_id: src-ACC-bda-style-guide-2023
  locator: Section 'Writing style'
  text: Support text with images, flow charts for procedures and pictograms, and prefer bullet points
    and numbered lists to continuous prose.
  excerpt_type: paraphrase
  fetched_url: https://www.bdadyslexia.org.uk/advice/employers/creating-a-dyslexia-friendly-workplace/dyslexia-friendly-style-guide
  verified_by_fetch: true
- id: psg-ACC-dysscot-spacing
  source_id: src-ACC-dysscot-typed-content-2025
  locator: 'UNCONFIRMED: about p.2, spacing guidance (page numbers inferred from extracted text)'
  text: Increase letter and word spacing (a simple default is about 30 to 35% of font size, adjusted to
    the reader's preference, with word spacing in proportion), avoid excessive gaps, use 1.5 line spacing
    and clear paragraph breaks.
  excerpt_type: paraphrase
  fetched_url: https://dyslexiascotland.org.uk/wp-content/uploads/2025/10/formats.pdf
  verified_by_fetch: true
- id: psg-ACC-dysscot-line-length
  source_id: src-ACC-dysscot-typed-content-2025
  locator: 'UNCONFIRMED: about p.3, line length guidance'
  text: Aim for lines of roughly 50 to 75 characters; shorter lines often help dyslexic readers.
  excerpt_type: paraphrase
  fetched_url: https://dyslexiascotland.org.uk/wp-content/uploads/2025/10/formats.pdf
  verified_by_fetch: true
- id: psg-ACC-dysscot-typeface
  source_id: src-ACC-dysscot-typed-content-2025
  locator: 'UNCONFIRMED: about pp.3 to 4, typeface and font size guidance'
  text: No single dyslexia-friendly font has been shown to be better; use a plain, evenly spaced font
    without decorative or oblique styles; sans serif is often preferred though evidence of advantage is
    inconsistent; specialist dyslexia fonts only if the individual finds them helpful; at least 12 point
    body text, and let readers choose larger text or their preferred font.
  excerpt_type: paraphrase
  fetched_url: https://dyslexiascotland.org.uk/wp-content/uploads/2025/10/formats.pdf
  verified_by_fetch: true
- id: psg-ACC-dysscot-layout
  source_id: src-ACC-dysscot-typed-content-2025
  locator: 'UNCONFIRMED: about p.5, alignment, layout and headings'
  text: Align text left and avoid full justification; keep layouts clean and uncluttered; chunk content
    under clear headings and subheadings; headings bolder and larger than body text, never smaller.
  excerpt_type: paraphrase
  fetched_url: https://dyslexiascotland.org.uk/wp-content/uploads/2025/10/formats.pdf
  verified_by_fetch: true
- id: psg-ACC-dysscot-writing
  source_id: src-ACC-dysscot-typed-content-2025
  locator: 'UNCONFIRMED: about pp.5 to 6, writing style and emphasis'
  text: Keep sentences to about 25 words or fewer and paragraphs to about five lines; put key information
    first; make key information or actions visually distinct from the surrounding text.
  excerpt_type: paraphrase
  fetched_url: https://dyslexiascotland.org.uk/wp-content/uploads/2025/10/formats.pdf
  verified_by_fetch: true
- id: psg-ACC-dysscot-plain
  source_id: src-ACC-dysscot-typed-content-2025
  locator: 'UNCONFIRMED: about p.6, writing style (language)'
  text: Write conversationally, avoid jargon the audience does not know, and for general audiences aim
    at a low reading age (about eight years).
  excerpt_type: paraphrase
  fetched_url: https://dyslexiascotland.org.uk/wp-content/uploads/2025/10/formats.pdf
  verified_by_fetch: true
- id: psg-ACC-dysscot-background
  source_id: src-ACC-dysscot-typed-content-2025
  locator: 'UNCONFIRMED: about p.7, background colour, paper and contrast'
  text: Prefer off-white or tinted backgrounds (for example cream or peach) with dark text; some readers
    prefer lower-contrast pairs such as navy on pale yellow and preferences vary; use matte paper; meet
    at least a 4.5:1 contrast ratio.
  excerpt_type: paraphrase
  fetched_url: https://dyslexiascotland.org.uk/wp-content/uploads/2025/10/formats.pdf
  verified_by_fetch: true
- id: psg-ACC-dysscot-slides-formats
  source_id: src-ACC-dysscot-typed-content-2025
  locator: 'UNCONFIRMED: about p.8, slides, digital accessibility and format options'
  text: On slides use text sparingly (32 point suggested as a minimum); offer multiple or customisable
    formats, text-to-speech and accessibility toolbars; add diagrams, photos or video where helpful.
  excerpt_type: paraphrase
  fetched_url: https://dyslexiascotland.org.uk/wp-content/uploads/2025/10/formats.pdf
  verified_by_fetch: true
- id: psg-ACC-wcag-1-4-3
  source_id: src-ACC-wcag-22
  locator: Success Criterion 1.4.3 Contrast (Minimum), Level AA
  text: Text needs a contrast ratio of at least 4.5:1 against its background; large text (18 point, or
    14 point bold) needs at least 3:1.
  excerpt_type: paraphrase
  fetched_url: https://www.w3.org/TR/WCAG22/
  verified_by_fetch: true
- id: psg-ACC-wcag-1-4-12
  source_id: src-ACC-wcag-22
  locator: Success Criterion 1.4.12 Text Spacing, Level AA
  text: Content must still work when users set line height to at least 1.5 times font size, paragraph
    spacing to 2 times, letter spacing to 0.12 times and word spacing to 0.16 times font size.
  excerpt_type: paraphrase
  fetched_url: https://www.w3.org/TR/WCAG22/
  verified_by_fetch: true
- id: psg-ACC-wcag-1-4-8
  source_id: src-ACC-wcag-22
  locator: Success Criterion 1.4.8 Visual Presentation, Level AAA
  text: Blocks of text should be no wider than 80 characters, not justified, with line spacing of at least
    one and a half and paragraph spacing at least 1.5 times line spacing, and should resize to 200% without
    loss.
  excerpt_type: paraphrase
  fetched_url: https://www.w3.org/TR/WCAG22/
  verified_by_fetch: true
- id: psg-ACC-wcag-1-4-1
  source_id: src-ACC-wcag-22
  locator: Success Criterion 1.4.1 Use of Color, Level A
  text: Colour must not be the only way of conveying information, indicating an action or prompting a
    response.
  excerpt_type: paraphrase
  fetched_url: https://www.w3.org/TR/WCAG22/
  verified_by_fetch: true
- id: psg-ACC-wcag-1-3-1
  source_id: src-ACC-wcag-22
  locator: Success Criterion 1.3.1 Info and Relationships, Level A
  text: Structure and relationships shown visually (such as headings and lists) must be programmatically
    determinable or available in text.
  excerpt_type: paraphrase
  fetched_url: https://www.w3.org/TR/WCAG22/
  verified_by_fetch: true
- id: psg-ACC-wcag-2-4-6
  source_id: src-ACC-wcag-22
  locator: Success Criterion 2.4.6 Headings and Labels, Level AA
  text: Headings and labels must describe the topic or purpose of the content.
  excerpt_type: paraphrase
  fetched_url: https://www.w3.org/TR/WCAG22/
  verified_by_fetch: true
- id: psg-ACC-wcag-3-2-4
  source_id: src-ACC-wcag-22
  locator: Success Criterion 3.2.4 Consistent Identification, Level AA
  text: Components that have the same functionality within a set of web pages are identified consistently.
  excerpt_type: quote
  fetched_url: https://www.w3.org/TR/WCAG22/
  verified_by_fetch: true
- id: psg-ACC-wcag-1-1-1
  source_id: src-ACC-wcag-22
  locator: Success Criterion 1.1.1 Non-text Content, Level A
  text: Non-text content such as images needs a text alternative serving the same purpose, except pure
    decoration.
  excerpt_type: paraphrase
  fetched_url: https://www.w3.org/TR/WCAG22/
  verified_by_fetch: true
- id: psg-ACC-wcag-3-3-2
  source_id: src-ACC-wcag-22
  locator: Success Criterion 3.3.2 Labels or Instructions, Level A
  text: Labels or instructions must be provided wherever content asks the user for input.
  excerpt_type: paraphrase
  fetched_url: https://www.w3.org/TR/WCAG22/
  verified_by_fetch: true
- id: psg-ACC-wcag-3-1-5
  source_id: src-ACC-wcag-22
  locator: Success Criterion 3.1.5 Reading Level, Level AAA
  text: Where text needs reading ability beyond lower secondary level (ignoring proper names and titles),
    supplementary content or a version at that lower level should be available.
  excerpt_type: paraphrase
  fetched_url: https://www.w3.org/TR/WCAG22/
  verified_by_fetch: true
- id: psg-ACC-eef-needs-not-diagnosis
  source_id: src-ACC-eef-send-2020
  locator: p.15 (Recommendation 2)
  text: 'For most day-to-day teaching decisions a diagnosis is less useful than knowing the pupil''s specific
    needs: diagnostic categories overlap, and two pupils with the same diagnosis can have quite different
    needs.'
  excerpt_type: paraphrase
  fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
  verified_by_fetch: true
- id: psg-ACC-eef-key-question
  source_id: src-ACC-eef-send-2020
  locator: p.7
  text: The key question is what this individual pupil needs, not what works for a diagnostic group such
    as dyslexia.
  excerpt_type: paraphrase
  fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
  verified_by_fetch: true
- id: psg-ACC-eef-good-teaching-all
  source_id: src-ACC-eef-send-2020
  locator: p.8
  text: good teaching for pupils with SEND is good teaching for all
  excerpt_type: quote
  fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
  verified_by_fetch: true
- id: psg-ACC-eef-five-strategies
  source_id: src-ACC-eef-send-2020
  locator: pp.20 to 26 (Recommendation 3)
  text: Recommendation 3 names five strategies (flexible grouping, cognitive and metacognitive strategies,
    explicit instruction, using technology, and scaffolding) and advises using them as the starting point
    for classroom teaching for all pupils.
  excerpt_type: paraphrase
  fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
  verified_by_fetch: true
- id: psg-ACC-eef-scaffolding
  source_id: src-ACC-eef-send-2020
  locator: p.26 (Scaffolding)
  text: Scaffolds are temporary supports (visual, verbal or written, such as a writing frame or a task
    checklist) that the teacher removes gradually as the pupil becomes independent; for pupils with SEND
    a scaffold may stay longer.
  excerpt_type: paraphrase
  fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
  verified_by_fetch: true
- id: psg-ACC-eef-explicit
  source_id: src-ACC-eef-send-2020
  locator: p.24 (Explicit instruction, Box 8)
  text: Explicit instruction means teacher demonstration followed by guided then independent practice,
    teaching in small steps with clear and unambiguous language, examples and non-examples, and highlighting
    essential content.
  excerpt_type: paraphrase
  fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
  verified_by_fetch: true
- id: psg-ACC-eef-small-steps
  source_id: src-ACC-eef-send-2020
  locator: p.13
  text: Breaking tasks into smaller steps is given as one way of making tasks manageable.
  excerpt_type: paraphrase
  fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
  verified_by_fetch: true
- id: psg-ACC-eef-graphic-organisers
  source_id: src-ACC-eef-send-2020
  locator: p.23 (Box 7 and Figure 3)
  text: Graphic organisers such as Venn diagrams, T-charts, mind maps and the Frayer model are given as
    examples of cognitive strategies.
  excerpt_type: paraphrase
  fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
  verified_by_fetch: true
- id: psg-ACC-eef-vocab
  source_id: src-ACC-eef-send-2020
  locator: p.14 and p.16 (case example)
  text: Pre-teaching of vocabulary, and direct vocabulary instruction for an individual pupil, are given
    as examples of responding to identified needs.
  excerpt_type: paraphrase
  fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
  verified_by_fetch: true
- id: psg-ACC-eef-technology
  source_id: src-ACC-eef-send-2020
  locator: p.25 (Using technology)
  text: Technology can support pupils with SEND through instructional apps, non-instructional tools such
    as note-taking apps, and speech-generating apps for pupils with communication difficulties.
  excerpt_type: paraphrase
  fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
  verified_by_fetch: true
- id: psg-ACC-eef-flexible-grouping
  source_id: src-ACC-eef-send-2020
  locator: p.22 (Flexible grouping)
  text: Flexible grouping places pupils together temporarily around a shared need and disbands the group
    once its purpose is met, as an alternative to fixed streaming.
  excerpt_type: paraphrase
  fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
  verified_by_fetch: true
- id: psg-ACC-eef-high-expectations
  source_id: src-ACC-eef-send-2020
  locator: p.5, p.22 and p.34
  text: Calls for high expectations for the learning of all pupils and an appropriate level of challenge,
    and warns that some support can leave pupils with undemanding tasks.
  excerpt_type: paraphrase
  fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
  verified_by_fetch: true
- id: psg-ACC-zorzi-abstract
  source_id: src-ACC-zorzi-2012
  locator: Abstract
  text: In a large unselected sample of Italian and French children with dyslexia, simply increasing letter
    spacing substantially improved text reading without any training; the authors link this to greater
    sensitivity to crowding between neighbouring letters.
  excerpt_type: paraphrase
  fetched_url: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1073/pnas.1205566109&resultType=core&format=json
  verified_by_fetch: true
- id: psg-ACC-wery-abstract
  source_id: src-ACC-wery-diliberto-2017
  locator: Abstract
  text: In a single-subject alternating treatment study of 12 primary-aged pupils with dyslexia, OpenDyslexic
    produced no gains in reading rate or accuracy compared with Arial or Times New Roman, and no pupil
    preferred it.
  excerpt_type: paraphrase
  fetched_url: https://link.springer.com/article/10.1007/s11881-016-0127-1
  verified_by_fetch: true
- id: psg-ACC-kuster-findings
  source_id: src-ACC-kuster-2018
  locator: Abstract and Results (Experiments 1 and 2)
  text: Across two experiments with Dutch children aged about 7 to 12 (170 with dyslexia in the first;
    102 with and 45 without in the second), Dyslexie did not improve reading speed or accuracy; most children
    preferred Arial or Times New Roman, and preference was unrelated to performance. Children who like
    it need not be discouraged.
  excerpt_type: paraphrase
  fetched_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5934461/
  verified_by_fetch: true
- id: psg-ACC-kuster-spacing
  source_id: src-ACC-kuster-2018
  locator: 'UNCONFIRMED: Discussion (horizontal spacing and Marinus et al. 2016)'
  text: The authors note that horizontal letter spacing was not controlled and cite earlier work in which
    Dyslexie's apparent advantage disappeared once spacing was matched, suggesting spacing rather than
    letter shape drives such effects.
  excerpt_type: paraphrase
  fetched_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5934461/
  verified_by_fetch: true
- id: psg-ACC-adt-inclusion-meaning
  source_id: src-ACC-adt-inclusive-education
  locator: Section 'What does Inclusive education mean?'
  text: Inclusion means that the needs of all children, including those needing additional support, are
    built into curriculum planning, resources and approaches across the whole life of the school, and
    is judged by features such as being present, participating and achieving.
  excerpt_type: paraphrase
  fetched_url: https://addressingdyslexia.org/scottish-context/inclusive-education
  verified_by_fetch: true
- id: psg-ACC-adt-def-quote
  source_id: src-ACC-adt-definition-2025
  locator: Scottish working definition of dyslexia (2025), opening sentence
  text: a continuum of difficulties in learning to read, write and/or spell
  excerpt_type: quote
  fetched_url: https://addressingdyslexia.org/what-is-dyslexia
  verified_by_fetch: true
- id: psg-ACC-adt-def-context
  source_id: src-ACC-adt-definition-2025
  locator: Scottish working definition of dyslexia (2025)
  text: The impact of dyslexia varies with the task, the learning environment and the support or coping
    strategies in place, and it often co-occurs with difficulties in areas such as working memory, fluency,
    sequencing and organisation.
  excerpt_type: paraphrase
  fetched_url: https://addressingdyslexia.org/what-is-dyslexia
  verified_by_fetch: true
- id: psg-ACC-adt-def-no-label
  source_id: src-ACC-adt-definition-2025
  locator: What is Dyslexia page, text following the definition
  text: Additional support does not depend on a formal diagnosis such as dyslexia, though formal identification
    is valued because the information gathered supports monitoring and planning.
  excerpt_type: paraphrase
  fetched_url: https://addressingdyslexia.org/what-is-dyslexia
  verified_by_fetch: true
- id: psg-ACC-code-ch1-purpose
  source_id: src-ACC-sg-asl-code-2017
  locator: Introduction, paras 1, 3 and 5
  text: The 2004 Act (as amended) is the legal framework for identifying and addressing the additional
    support needs of children facing barriers to learning; education authorities must have regard to the
    code; it should be read alongside GIRFEC and Curriculum for Excellence.
  excerpt_type: paraphrase
  fetched_url: https://www.gov.scot/publications/supporting-childrens-learning-statutory-guidance-education-additional-support-learning-scotland/
  verified_by_fetch: true
- id: psg-ACC-code-ch2-definition
  source_id: src-ACC-sg-asl-code-2017
  locator: Chapter 2, para 1 (section 1(1) of the Act) and para 7
  text: A child has additional support needs where, for whatever reason, they are or are likely to be
    unable to benefit from school education without additional support; additional support means provision
    additional to, or different from, that generally made for peers of the same age.
  excerpt_type: paraphrase
  fetched_url: https://www.gov.scot/publications/supporting-childrens-learning-statutory-guidance-education-additional-support-learning-scotland/pages/3/
  verified_by_fetch: true
- id: psg-ACC-code-ch2-support-types
  source_id: src-ACC-sg-asl-code-2017
  locator: Chapter 2, para 12
  text: 'Additional support falls into three overlapping areas: approaches to learning and teaching, support
    from personnel, and provision of resources.'
  excerpt_type: paraphrase
  fetched_url: https://www.gov.scot/publications/supporting-childrens-learning-statutory-guidance-education-additional-support-learning-scotland/pages/3/
  verified_by_fetch: true
- id: psg-ACC-code-ch2-factors
  source_id: src-ACC-sg-asl-code-2017
  locator: Chapter 2, paras 16 to 22
  text: Needs can arise from the learning environment (including teaching that does not take account of
    needs), family circumstances, disability or health, or social and emotional factors; a child may be
    affected by more than one, and needs may be short or long term.
  excerpt_type: paraphrase
  fetched_url: https://www.gov.scot/publications/supporting-childrens-learning-statutory-guidance-education-additional-support-learning-scotland/pages/3/
  verified_by_fetch: true
- id: psg-ACC-code-ch2-labels
  source_id: src-ACC-sg-asl-code-2017
  locator: Chapter 2, paras 23 to 25
  text: The same factor affects children differently; some families find labels such as dyslexia or autism
    helpful while others find them limiting or stigmatising, so children should be seen as individuals
    with support tailored to their needs, provided early and without singling them out.
  excerpt_type: paraphrase
  fetched_url: https://dera.ioe.ac.uk/id/eprint/30765/1/00529411.pdf
  verified_by_fetch: true
- id: psg-ACC-code-ch2-examples
  source_id: src-ACC-sg-asl-code-2017
  locator: Chapter 2, paras 13 and 24
  text: Examples of additional support include in-class support from an EAL teacher and communication
    symbols for an autistic child; a lack of English should be addressed within a learning programme that
    reflects the child's existing skills.
  excerpt_type: paraphrase
  fetched_url: https://www.gov.scot/publications/supporting-childrens-learning-statutory-guidance-education-additional-support-learning-scotland/pages/3/
  verified_by_fetch: true
- id: psg-ACC-code-ch3-staged
  source_id: src-ACC-sg-asl-code-2017
  locator: Chapter 3, paras 30 to 31
  text: Authorities commonly use staged approaches (usually three to six stages) to resolve difficulties
    early with the least intrusive action; the Act does not prescribe a particular model.
  excerpt_type: paraphrase
  fetched_url: https://dera.ioe.ac.uk/id/eprint/30765/1/00529411.pdf
  verified_by_fetch: true
- id: psg-ACC-code-ch3-iep
  source_id: src-ACC-sg-asl-code-2017
  locator: Chapter 3, para 9
  text: An individualised educational programme may provide more detailed planning for a child, usually
    within school, and should incorporate any educational objectives from a co-ordinated support plan.
  excerpt_type: paraphrase
  fetched_url: https://dera.ioe.ac.uk/id/eprint/30765/1/00529411.pdf
  verified_by_fetch: true
- id: psg-ACC-code-ch3-girfec
  source_id: src-ACC-sg-asl-code-2017
  locator: Chapter 3, paras 5 to 9
  text: GIRFEC puts children's rights and wellbeing at the centre; a Child's Plan, coordinated by a Lead
    Professional where agencies are involved, can record support; the views of children and parents should
    be sought, taken into account and noted.
  excerpt_type: paraphrase
  fetched_url: https://dera.ioe.ac.uk/id/eprint/30765/1/00529411.pdf
  verified_by_fetch: true
- id: psg-ACC-morgan-legislation
  source_id: src-ACC-morgan-review-2020-summary
  locator: Executive summary, 'Overview of findings'
  text: The review found no fundamental flaw in the principles of the legislation; the problem lies in
    putting them into practice, which is fragmented, inconsistent and overly dependent on individuals.
  excerpt_type: paraphrase
  fetched_url: https://www.gov.scot/publications/review-additional-support-learning-implementation-executive-summary/pages/3/
  verified_by_fetch: true
- id: psg-ACC-morgan-diagnosis
  source_id: src-ACC-morgan-review-2020-summary
  locator: Executive summary, 'Overview of findings'
  text: Access to support is often made conditional on a diagnosis, which operates as a way of rationing
    scarce resources, and individual planning can produce plans that do not lead to the support they describe.
  excerpt_type: paraphrase
  fetched_url: https://www.gov.scot/publications/review-additional-support-learning-implementation-executive-summary/pages/3/
  verified_by_fetch: true
- id: psg-ACC-morgan-visibility
  source_id: src-ACC-morgan-review-2020-summary
  locator: Executive summary, 'Overview of findings'
  text: Additional support for learning is not visible or equally valued in the system, although around
    30.9% of pupils were identified with an additional support need; the review calls for relationships
    to come before processes.
  excerpt_type: paraphrase
  fetched_url: https://www.gov.scot/publications/review-additional-support-learning-implementation-executive-summary/pages/3/
  verified_by_fetch: true
- id: psg-ACC-morgan-mainstreaming
  source_id: src-ACC-morgan-review-2020-summary
  locator: Executive summary, 'Overview of findings'
  text: There was no assurance that all professionals accept inclusion and the presumption of mainstreaming;
    some saw additional support as someone else's responsibility.
  excerpt_type: paraphrase
  fetched_url: https://www.gov.scot/publications/review-additional-support-learning-implementation-executive-summary/pages/3/
  verified_by_fetch: true
- id: psg-ACC-morgan-themes
  source_id: src-ACC-morgan-review-2020-report
  locator: Report contents, 'Themes'
  text: The full report is organised under nine themes including vision and visibility, mainstreaming
    and inclusion, workforce development, relationships and behaviour, and understanding rights, and it
    reports what children and young people told the review.
  excerpt_type: paraphrase
  fetched_url: https://www.gov.scot/publications/review-additional-support-learning-implementation/
  verified_by_fetch: true
- id: psg-ACC-girfec-what
  source_id: src-ACC-sg-girfec
  locator: GIRFEC policy page, opening sections
  text: GIRFEC is Scotland's national, rights-based approach to giving children and families the right
    support at the right time; it uses eight wellbeing indicators (SHANARRI), a clear point of contact
    (named person) and a child's plan coordinated by a lead professional.
  excerpt_type: paraphrase
  fetched_url: https://www.gov.scot/policies/girfec/
  verified_by_fetch: true
- id: psg-ACC-iep-who
  source_id: src-ACC-edscot-iep-guidance
  locator: Section 'Processes needed for an IEP'
  text: An IEP is a non-statutory working document for learners whose outcomes cannot be met through universal
    class or group planning alone; it is coordinated by a key person with the team around the child.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/resources/additional-support-for-learning/guidance-for-individual-educational-programmes/preparing-an-individualised-educational-programme/
  verified_by_fetch: true
- id: psg-ACC-iep-contents
  source_id: src-ACC-edscot-iep-guidance
  locator: Sections 'Processes needed for an IEP' and 'Effective use of ASL plans and IEPs'
  text: An IEP holds a current profile of needs, prioritised measurable outcomes, a named coordinator
    and review dates; the child and parents are involved in drafting and review; short-term outcomes are
    reviewed at least termly and long-term targets at least annually.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/resources/additional-support-for-learning/guidance-for-individual-educational-programmes/preparing-an-individualised-educational-programme/
  verified_by_fetch: true
- id: psg-ACC-iep-staged
  source_id: src-ACC-edscot-iep-guidance
  locator: Section 'Effective use of ASL plans and IEPs'
  text: Local authorities should set out where each level of planning sits in their staged intervention
    approach, which is used to decide the appropriate level of planning.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/resources/additional-support-for-learning/guidance-for-individual-educational-programmes/preparing-an-individualised-educational-programme/
  verified_by_fetch: true
- id: psg-ACC-at-visual-quote
  source_id: src-ACC-at-visual-supports
  locator: Visual Supports page, introductory section
  text: All autistic learners are likely to benefit from developmentally appropriate visual supports
  excerpt_type: quote
  fetched_url: https://www.autismtoolbox.co.uk/supporting-learners-and-families/effective-partnerships-and-communication/visual-supports/
  verified_by_fetch: true
- id: psg-ACC-at-visual-purposes
  source_id: src-ACC-at-visual-supports
  locator: Visual Supports page, body
  text: Visual supports (timetables, schedules, choice boards, symbols, photos, objects) give predictability,
    reduce anxiety and build independence and understanding; they should match the learner's stage of
    communication, be used consistently and can help learners with a range of additional support needs.
  excerpt_type: paraphrase
  fetched_url: https://www.autismtoolbox.co.uk/supporting-learners-and-families/effective-partnerships-and-communication/visual-supports/
  verified_by_fetch: true
- id: psg-ACC-at-comm-literal
  source_id: src-ACC-at-communication
  locator: Communication page
  text: Autistic learners can be overliteral and may miss it when someone says one thing but means another;
    tone of voice can change meaning and lead to misunderstanding.
  excerpt_type: paraphrase
  fetched_url: https://www.autismtoolbox.co.uk/understanding-autism/communication/
  verified_by_fetch: true
- id: psg-ACC-at-comm-time
  source_id: src-ACC-at-communication
  locator: Communication page
  text: Learners may struggle to respond in the expected time or to organise several spoken instructions
    given together; allow time and wait, and reduce language, especially when a learner is anxious.
  excerpt_type: paraphrase
  fetched_url: https://www.autismtoolbox.co.uk/understanding-autism/communication/
  verified_by_fetch: true
- id: psg-ACC-at-comm-groups
  source_id: src-ACC-at-communication
  locator: Communication page, reasonable adjustments
  text: Reasonable adjustments in group work include clear roles and scripts, and visual supports can
    help peer interaction and group work.
  excerpt_type: paraphrase
  fetched_url: https://www.autismtoolbox.co.uk/understanding-autism/communication/
  verified_by_fetch: true
- id: psg-ACC-at-sensory-env
  source_id: src-ACC-at-sensory
  locator: Sensory Differences page
  text: Reduce visual clutter, soften lighting, manage noise (switch off noisy equipment, muffle bells)
    and allow headphones where noise cannot be reduced; consider which seats or areas are easier for the
    child.
  excerpt_type: paraphrase
  fetched_url: https://www.autismtoolbox.co.uk/understanding-autism/sensory-differences/
  verified_by_fetch: true
- id: psg-ACC-at-sensory-breaks
  source_id: src-ACC-at-sensory
  locator: Sensory Differences page, practical adjustments
  text: Agree a safe space to step away and regulate, schedule regular movement breaks even when the child
    seems calm, and provide a visible timetable kept to as far as possible.
  excerpt_type: paraphrase
  fetched_url: https://www.autismtoolbox.co.uk/understanding-autism/sensory-differences/
  verified_by_fetch: true
- id: psg-ACC-at-incl-universal
  source_id: src-ACC-at-inclusive-classrooms
  locator: Inclusive Classrooms page
  text: Inclusive classrooms benefit all learners; clear labels and visual supports help learners with
    language and communication difficulties and those learning English as an additional language; adjustments
    should be anticipatory and the learning day predictable.
  excerpt_type: paraphrase
  fetched_url: https://www.autismtoolbox.co.uk/scottish-context/inclusive-education/inclusive-classrooms/
  verified_by_fetch: true
- id: psg-ACC-at-universal-quote
  source_id: src-ACC-at-universal
  locator: Universal page, staged intervention introduction
  text: at the earliest opportunity and with the least intrusive level of intervention
  excerpt_type: quote
  fetched_url: https://www.autismtoolbox.co.uk/supporting-learners-and-families/educational-support/universal/
  verified_by_fetch: true
- id: psg-ACC-at-universal-supports
  source_id: src-ACC-at-universal
  locator: Universal page
  text: Most needs are met at the universal level, where the class teacher has first responsibility; universal
    supports include visual timetables and supports, quiet spaces and digital resources; councils vary
    in their number of stages.
  excerpt_type: paraphrase
  fetched_url: https://www.autismtoolbox.co.uk/supporting-learners-and-families/educational-support/universal/
  verified_by_fetch: true
- id: psg-ACC-nas-figurative
  source_id: src-ACC-nas-communication-2022
  locator: Section 'Avoid confusing language'
  text: Figurative phrases and vague time or size words can be misread; give realistic timings and keep
    to them.
  excerpt_type: paraphrase
  fetched_url: https://www.autism.org.uk/advice-and-guidance/professional-practice/communication-pupils
  verified_by_fetch: true
- id: psg-ACC-nas-name-first
  source_id: src-ACC-nas-communication-2022
  locator: Section 'Make it personal'
  text: Say the pupil's name first so they know they are being addressed; in groups an individual prompt
    may be needed.
  excerpt_type: paraphrase
  fetched_url: https://www.autism.org.uk/advice-and-guidance/professional-practice/communication-pupils
  verified_by_fetch: true
- id: psg-ACC-nas-processing
  source_id: src-ACC-nas-communication-2022
  locator: Section 'Allow processing time'
  text: Pause for at least ten seconds without adding words; if repeating, use the same words, ideally
    with visual support.
  excerpt_type: paraphrase
  fetched_url: https://www.autism.org.uk/advice-and-guidance/professional-practice/communication-pupils
  verified_by_fetch: true
- id: psg-ACC-nas-visual
  source_id: src-ACC-nas-communication-2022
  locator: Section 'Make it visual'
  text: Many autistic pupils process visual information more easily than speech, so use objects, pictures,
    symbols, written words or apps.
  excerpt_type: paraphrase
  fetched_url: https://www.autism.org.uk/advice-and-guidance/professional-practice/communication-pupils
  verified_by_fetch: true
- id: psg-ACC-nas-chunk
  source_id: src-ACC-nas-communication-2022
  locator: Sections 'Slow down' and 'Short and manageable questions and instructions'
  text: Slow down, keep to the key message, give one piece of information at a time in small chunks, and
    check understanding before moving on.
  excerpt_type: paraphrase
  fetched_url: https://www.autism.org.uk/advice-and-guidance/professional-practice/communication-pupils
  verified_by_fetch: true
- id: psg-ACC-nas-questions
  source_id: src-ACC-nas-communication-2022
  locator: Section 'Short and manageable questions and instructions'
  text: Keep questions clear and direct, limit how many are asked, avoid very open questions and offer
    limited choices where possible.
  excerpt_type: paraphrase
  fetched_url: https://www.autism.org.uk/advice-and-guidance/professional-practice/communication-pupils
  verified_by_fetch: true
- id: psg-ACC-nas-positive-alt
  source_id: src-ACC-nas-communication-2022
  locator: Sections on positive instructions and validating different ways of communicating
  text: Say what to do rather than what not to do, and accept writing or pictures as alternatives to speech.
  excerpt_type: paraphrase
  fetched_url: https://www.autism.org.uk/advice-and-guidance/professional-practice/communication-pupils
  verified_by_fetch: true
- id: psg-ACC-call-resources
  source_id: src-ACC-callscotland-home
  locator: Home page, resource links
  text: CALL Scotland (University of Edinburgh) offers Books for All (accessible curriculum books), Symbols
    for All (symbolised curriculum resources), WordTalk (free text-to- speech for Word), MyStudyBar (literacy
    support tools), Adapted Digital Exams and an assistive technology loan bank.
  excerpt_type: paraphrase
  fetched_url: https://www.callscotland.org.uk/
  verified_by_fetch: true
- id: psg-ACC-scotvoice
  source_id: src-ACC-scottish-voice
  locator: Home page
  text: The Scottish Voice provides Scottish-accented computer voices (adult, teenage and child English
    voices and a Gaelic voice), funded by the Scottish Government and free to the Scottish public sector,
    for listening to resources such as e-books.
  excerpt_type: paraphrase
  fetched_url: https://www.thescottishvoice.org.uk/home/
  verified_by_fetch: true
- id: psg-ACC-abd-visuals-vocab
  source_id: src-ACC-aberdeenshire-eal-primary
  locator: Strategies (Primary) page, vocabulary and visuals
  text: Pre-teach key words with visuals and extra small-group practice, teach words in context, and keep
    visual dictionaries and word banks at hand during writing.
  excerpt_type: paraphrase
  fetched_url: https://blogs.glowscotland.org.uk/as/ealaberdeenshire/strategies-primary/
  verified_by_fetch: true
- id: psg-ACC-abd-l1
  source_id: src-ACC-aberdeenshire-eal-primary
  locator: Strategies (Primary) page, home language
  text: Use dual-language books and audio books, learn a few words of the pupil's language, and let pupils
    build their own illustrated topic glossaries.
  excerpt_type: paraphrase
  fetched_url: https://blogs.glowscotland.org.uk/as/ealaberdeenshire/strategies-primary/
  verified_by_fetch: true
- id: psg-ACC-abd-frames
  source_id: src-ACC-aberdeenshire-eal-primary
  locator: Strategies (Primary) page, writing and talk
  text: Model tasks before pupils try them, provide sentence starters and sentence-building scaffolds,
    and use paired talk such as think-pair-share and supportive buddies.
  excerpt_type: paraphrase
  fetched_url: https://blogs.glowscotland.org.uk/as/ealaberdeenshire/strategies-primary/
  verified_by_fetch: true
- id: psg-ACC-bell-glossary
  source_id: src-ACC-bell-multilingual-support
  locator: Sections on bilingual glossaries, bilingual dictionaries and pre-teaching
  text: Learners can make bilingual glossaries of key topic words and use bilingual dictionaries; concepts
    can be pre-taught in the first language; skills transfer across languages, so first-language use supports
    access to the curriculum and the learning of English rather than replacing it.
  excerpt_type: paraphrase
  fetched_url: https://www.bell-foundation.org.uk/eal-programme/guidance/multilingual-support/
  verified_by_fetch: true
- id: psg-ACC-bell-quote
  source_id: src-ACC-bell-multilingual-support
  locator: Section on codeswitching and translanguaging
  text: extremely useful in the classroom
  excerpt_type: quote
  fetched_url: https://www.bell-foundation.org.uk/eal-programme/guidance/multilingual-support/
  verified_by_fetch: true
- id: psg-ACC-dld-vocab
  source_id: src-ACC-htu-dld
  locator: Section on vocabulary
  text: Pupils with DLD know fewer words and do not pick up new vocabulary incidentally, so key subject
    words should be taught explicitly, for example in a short vocabulary slot at the start of lessons.
  excerpt_type: paraphrase
  fetched_url: https://www.headteacher-update.com/content/best-practice/developmental-language-disorder-in-the-mainstream-classroom
  verified_by_fetch: true
- id: psg-ACC-dld-instructions
  source_id: src-ACC-htu-dld
  locator: Section on giving instructions
  text: Give one instruction at a time in short sentences, pause between chunks, put steps in the order
    they happen, and use literal language because idioms and metaphors are often hard for pupils with
    DLD.
  excerpt_type: paraphrase
  fetched_url: https://www.headteacher-update.com/content/best-practice/developmental-language-disorder-in-the-mainstream-classroom
  verified_by_fetch: true
- id: psg-ACC-dld-time-check
  source_id: src-ACC-htu-dld
  locator: Sections on processing time and checking understanding
  text: Allow extra time to understand and to formulate answers, recap prior learning, ask pupils to repeat
    instructions back, and model useful phrases and sentence structures.
  excerpt_type: paraphrase
  fetched_url: https://www.headteacher-update.com/content/best-practice/developmental-language-disorder-in-the-mainstream-classroom
  verified_by_fetch: true
- id: psg-ACC-dld-visual
  source_id: src-ACC-htu-dld
  locator: Section on visual support
  text: Use visual prompts such as pictures on worksheets, visual timetables and real objects to signpost
    activities and support memory.
  excerpt_type: paraphrase
  fetched_url: https://www.headteacher-update.com/content/best-practice/developmental-language-disorder-in-the-mainstream-classroom
  verified_by_fetch: true
- id: psg-CUR-lit-2-02a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.3, 'Listening and talking, Tools for listening and talking', LIT 2-02a
  text: Learners respond to others in ways that suit their role in the discussion, show that they value
    other people's contributions and use them to take their own thinking further.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-02a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Listening and talking' (printed heading uses a dash), benchmarks column
    beside LIT 2-02a; no printed page numbers in the PDF
  text: At second level the benchmarks look for several relevant ideas offered in discussion, respect
    for other views, building on what others say, use of verbal and non-verbal techniques, and some recognition
    of techniques used to influence a listener.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-04a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.4, 'Listening and talking, Finding and using information', LIT 2-04a
  text: Learners identify and talk about the purpose, main ideas and supporting detail in spoken or visual
    texts, and put that information to use for different purposes.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-04a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Listening and talking' (printed heading uses a dash), benchmarks column
    beside LIT 2-04a; no printed page numbers in the PDF
  text: The benchmarks expect learners to identify the purpose of a spoken text and its main ideas with
    supporting detail, and to make relevant notes that are mostly in their own words.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-07a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.5, 'Listening and talking, Understanding, analysing and evaluating', LIT 2-07a
  text: Learners show understanding of what they hear by answering literal, inferential and evaluative
    questions and by asking questions of their own.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-07a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Listening and talking' (printed heading uses a dash), benchmarks column
    beside LIT 2-07a; no printed page numbers in the PDF
  text: The benchmarks expect responses to literal, inferential and evaluative questions about spoken
    texts, learner-generated questions, and distinguishing fact from opinion.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-09a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.6, 'Listening and talking, Creating texts', LIT 2-09a
  text: When talking, learners share information and opinions, explain processes, identify issues, summarise
    what they have found, and ask questions to clarify meaning.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-09a-bm-note
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Listening and talking', benchmarks column; no printed page numbers in
    the PDF
  text: No benchmark bullets are tagged specifically to LIT 2-09a; the talking and presentation bullets
    (communicating clearly, organising a talk, choosing suitable vocabulary and resources) are tagged
    to LIT 2-10a and LIT 3-10a.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-eng-2-12a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.8, 'Reading, Tools for reading', ENG 2-12a
  text: Learners read unfamiliar texts aloud with increasing fluency, understanding and expression, drawing
    on context clues, punctuation, grammar and layout.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-eng-2-12a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Reading' (printed heading uses a dash), benchmarks column beside ENG
    2-12a; no printed page numbers in the PDF
  text: The benchmarks look for fluent, expressive reading using context clues, punctuation, grammar and
    layout, together with strategies such as skimming, scanning, predicting and summarising (bullets shared
    with LIT 2-13a and with third and fourth level ENG 12a).
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-16a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.10, 'Reading, Understanding, analysing and evaluating', LIT 2-16a
  text: Across different areas of learning, learners show understanding of a text by identifying its purpose
    and main ideas and by using supporting detail.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-16a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Reading' (printed heading uses a dash), benchmarks column beside LIT
    2-16a; no printed page numbers in the PDF
  text: Benchmark bullets grouped with ENG 2-17a expect learners to identify purpose and main ideas with
    detail, comment on language features, answer literal, inferential and evaluative questions, create
    their own questions, distinguish fact from opinion and recognise persuasive techniques.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-eng-2-17a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.10, 'Reading, Understanding, analysing and evaluating', ENG 2-17a
  text: Learners show understanding of texts by answering literal, inferential and evaluative questions
    and close reading tasks, and begin to create their own questions.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-eng-2-17a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Reading' (printed heading uses a dash), benchmarks column beside ENG
    2-17a; no printed page numbers in the PDF
  text: Benchmark bullets grouped with LIT 2-16a expect answers to literal, inferential and evaluative
    questions, learner-created questions, and comment on the writer's use of language features.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-18a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.11, 'Reading, Understanding, analysing and evaluating', LIT 2-18a
  text: Learners tell fact from opinion, recognise when a writer is trying to influence them, and judge
    how useful and believable different sources are.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-18a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Reading' (printed heading uses a dash), benchmarks column beside LIT
    2-18a; no printed page numbers in the PDF
  text: The benchmarks expect learners to explain how they decide which sources are most useful and reliable,
    and to recognise when a source is trying to influence the reader.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-eng-2-19a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.11, 'Reading, Understanding, analysing and evaluating', ENG 2-19a
  text: Learners discuss a text's structure, characters and setting, relate its themes to their own experience,
    and comment on the writer's style and use of language.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-eng-2-19a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Reading' (printed heading uses a dash), benchmarks column beside ENG
    2-19a; no printed page numbers in the PDF
  text: The benchmarks look for comment on structure, characterisation and setting, links between the
    writer's theme and the learner's experience, and comment on style and genre features.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
