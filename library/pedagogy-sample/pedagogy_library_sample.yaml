- id: prn-EVD-oral-language-dialogic
  type: principle
  title: Oral language and dialogic talk
  summary: Use structured, purposeful classroom talk (questioning, thinking aloud, building on answers)
    and explicit vocabulary teaching to develop understanding and language.
  body: '**What it is.** Speaking and listening used as tools for learning, not only as outcomes. Dialogic
    teaching uses talk to build understanding and metacognition.


    **How to do it.**

    - Ask open questions, probe with follow-ups and build on pupils'' answers.

    - Give every pupil a chance to talk (pairs, talk partners, structured roles).

    - Model reasoning aloud.

    - Teach Tier 2 vocabulary explicitly with repeated use in speaking and writing.

    - Embed talk in curriculum content.


    **Scottish context.** Education Scotland''s listening and talking guidance treats talk as central
    to learning in all subjects and describes group discussion for exploring ideas, analysing texts and
    debating viewpoints.

    '
