- id: prn-EVD-learning-styles
  type: principle
  title: Matching teaching to 'learning styles' (not recommended)
  summary: Labelling pupils as visual, auditory or kinaesthetic learners and matching teaching to the
    label is not supported by evidence and may do harm.
  body: '**What it is.** The idea that pupils learn better when teaching matches a preferred style (often
    visual, auditory, kinaesthetic).


    **Why it is not recommended.** No studies met the EEF''s inclusion criteria and a major review found
    almost no evidence for the matching hypothesis. Labelling can lower expectations and restricting activities
    to a label may slow progress.


    **Do instead.** Find out what pupils already know and what barriers they face; use responsive teaching
    and feedback; use dual coding for everyone; teach metacognition.

    '
  status: draft
  version: '0.1'
  curated_by:
  - agent-EVD
