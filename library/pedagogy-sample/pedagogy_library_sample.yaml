    rating: contested
    rationale: Researchers disagree on whether PBL and inquiry are minimally guided; meta-analysis favours
      guided over unassisted discovery and the EEF REAL Projects trial found no literacy benefit, but
      with low security; see clm-EVD-mg-01 to clm-EVD-mg-05.
