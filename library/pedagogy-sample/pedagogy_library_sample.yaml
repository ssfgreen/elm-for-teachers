- id: sig-HIS-enquiry-question-sequence
  type: signature_pedagogy
  title: Historical enquiry questions and enquiry sequences
  summary: Organise a block of S1 history lessons around one carefully worded, answerable historical question
    that pupils build knowledge towards and answer in an outcome task.
  body: 'An enquiry question (for example "Why did Scottish nobles write to the Pope in 1320?") frames
    4 to 8 lessons. Each lesson adds substantive knowledge that pupils need to answer it, and the sequence
    ends in an outcome task (often extended writing). This is structured, teacher-led enquiry, not discovery
    learning: the teacher selects content and sources and teaches the knowledge explicitly.

    Good questions are tied to one second-order concept at a time (cause, consequence, change, significance,
    evidence, interpretation), use precise historical content and invite an argued answer. Plan questions
    across S1 to S3 so that concepts and periods are revisited.

    '
