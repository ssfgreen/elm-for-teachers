- id: sig-HIS-knowledge-rich-narrative
  type: signature_pedagogy
  title: 'Substantive knowledge first: knowledge-rich narrative and storytelling'
  summary: Secure pupils' knowledge of the period through vivid teacher narrative and rich background
    before asking them to interpret sources or write arguments.
  body: 'Pupils can only interpret evidence and argue if they know enough about the period. Tell the story
    of the period with people, motives, causes and conflict; include memorable ''hinterland'' detail that
    helps pupils hold the core content. Check and retrieve the key knowledge before source work and before
    extended writing.

