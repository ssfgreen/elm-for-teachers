- id: prn-EVD-feedback
  type: principle
  title: Feedback that moves learning forward
  summary: Give specific, actionable feedback on the task, the subject or the pupil's self-regulation,
    at a time that helps, and plan for pupils to act on it.
  body: '**What it is.** Information about performance that helps pupils close the gap between current
    and desired work.


    **How to do it.**

    - Build on strong initial teaching and formative assessment so feedback has less to fix.

    - Focus on the task, subject or strategy, not the person; be specific about how to improve.

    - Choose timing (immediate or delayed) to suit the task and pupil.

    - Plan time for pupils to act on feedback.

    - Verbal and whole-class feedback can be efficient; written marking is one option, not a requirement,
    and has workload costs.

    - Give feedback on correct work too.


    **Scottish context.** The GTCS Standard for Full Registration expects meaningful feedback that agrees
    next steps with learners.

    '
