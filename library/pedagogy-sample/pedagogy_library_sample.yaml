- id: act-LIT-writing-in-role
  type: activity_type
  title: Writing in role (for example a letter or diary entry as a character)
  summary: Pupils write from a character's perspective straight after drama work such as hot seating or
    freeze frame, to deepen engagement and detail.
  body: '**When it helps.** After drama has built tension and a strong sense of the

    character''s situation; for narrative, recount and persuasive purposes where voice

    and viewpoint matter; with pupils who struggle to generate ideas.


    **When it helps less.** As a stand-alone writing prompt with no preparatory talk or

    drama; when the learning goal is a non-fiction feature the role does not require.


    **Routine.** Drama convention (hot seat the character at a decision point), then

    "seize the moment": pupils write a letter, diary entry or message in role while

    engagement is high; follow with revision using writing goals.

    '
