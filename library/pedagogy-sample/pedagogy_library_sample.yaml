- id: sig-HIS-second-order-concepts
  type: signature_pedagogy
  title: Teaching second-order (disciplinary) concepts explicitly
  summary: Make the disciplinary concepts historians use (cause and consequence, change and continuity,
    similarity and difference, significance, evidence, interpretations, perspective) explicit objects
    of teaching, always through specific content.
  body: 'Second-order concepts shape the kind of argument pupils make about substantive content. In S1,
    introduce them by name, model what an answer in that concept sounds like, and give repeated practice
    across different topics. Seixas''s six historical thinking concepts (significance, evidence, continuity
    and change, cause and consequence, historical perspectives, ethical dimension) and the Ofsted list
    overlap closely; choose one vocabulary for the department and use it consistently.

    These concepts are never taught as free-floating skills: substantive and disciplinary knowledge depend
    on each other.

    '
