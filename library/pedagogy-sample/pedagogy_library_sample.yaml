- id: prn-EVD-metacognition
  type: principle
  title: Metacognition and self-regulated learning
  summary: Explicitly teach pupils to plan, monitor and evaluate their learning, within subject content,
    through modelling, guided practice and structured reflection.
  body: '**What it is.** Pupils learn strategies for planning, monitoring and evaluating their own work,
    and the knowledge of when to use them.


    **How to do it (EEF seven-step model).**

    1. Activate prior knowledge.

    2. Explicitly teach the strategy.

    3. Model it, thinking aloud.

    4. Check understanding of the strategy.

    5. Guided practice.

    6. Independent practice.

    7. Structured reflection.


    Teach within normal lessons, not as separate thinking-skills lessons. Pitch challenge so pupils need
    the strategy but are not overloaded. Use metacognitive talk ("How will I start? How do I know this
    is working?").


    **Scottish context.** A Scottish educational psychology service (Inverclyde) promotes the same approach
    and the EEF guidance; Education Scotland signposts the EEF Toolkit for equity planning.

    '
