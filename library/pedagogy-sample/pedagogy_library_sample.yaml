- id: prn-EVD-minimally-guided-discovery-pbl
  type: principle
  title: Minimally guided discovery and unstructured project-based learning (contested)
  summary: Approaches where pupils discover key content for themselves with little guidance, including
    loosely structured project-based learning, are contested; evidence favours guided versions for novices.
  body: '**The debate.** Kirschner, Sweller and Clark (2006) argue that minimal guidance is less effective
    and efficient for novices because of working memory limits. Hmelo-Silver, Duncan and Chinn (2007)
    reply that well-designed problem-based and inquiry learning is heavily scaffolded and should not be
    grouped with unguided discovery.


    **Meta-analytic evidence.** Alfieri et al. (2011) found unassisted discovery underperformed explicit
    instruction, while enhanced discovery with guidance outperformed other methods.


    **Trial evidence.** The EEF trial of Learning through REAL Projects in Year 7 found no clear literacy
    benefit (effect size -0.13, about -2 months) and a possible negative effect for disadvantaged pupils,
    though the security rating was low because of high attrition. Schools valued the approach for oracy
    and teamwork.


    **Practical position.** If using projects at P7 or S1, teach core knowledge explicitly first and build
    in scaffolds, worked examples, checkpoints and feedback (see prn-EVD-guided-inquiry).

    '
