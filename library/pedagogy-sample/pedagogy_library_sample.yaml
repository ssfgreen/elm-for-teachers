- id: sig-HIS-disciplinary-reading-writing
  type: signature_pedagogy
  title: Disciplinary reading and extended analytical writing in history
  summary: Teach pupils to read challenging historical texts and to write structured, argued answers to
    enquiry questions, with knowledge, oral rehearsal and paragraph models in place first.
  body: 'Reading: give S1 pupils appropriately challenging history texts (including short extracts of
    historians'' writing), pre-teaching the context they need to comprehend them.

    Writing: secure knowledge, keep pupils on the actual question, plan through card sorts and oral rehearsal,
    and teach a thematic (not chronological) structure: each paragraph opens with a ''big point'' answering
    the question, supported by ''little points'' of evidence. Analyse what makes the writing hard and
