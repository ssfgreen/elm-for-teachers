- id: prn-EVD-explicit-instruction
  type: principle
  title: Explicit instruction
  summary: Teach new content in small, sequenced steps with clear explanation, modelling, frequent checks
    and guided practice before independent work. Most effective for novices, which at P7 and S1 means
    most pupils most of the time.
  body: '**What it is.** The teacher states the goal, explains in small steps, models (including thinking
    aloud), asks many questions of all pupils, guides practice and only then releases pupils to independent
    practice. Guidance is faded as pupils gain expertise.


    **Why it works.** Working memory is limited for new material; strong guidance reduces unproductive
    search so attention goes to the key ideas. The advantage shrinks for pupils who already know a lot
    (expertise reversal).


    **How to do it.**

    - Open with a short review of prior learning.

    - Break content into small steps and have pupils practise after each step.

    - Use examples and non-examples, precise language, and plan for likely misconceptions.

    - Check every pupil (mini-whiteboards, cold calling, hinge questions) and aim for roughly 80 percent
    success in guided practice.

    - Move to independent practice only when pupils are secure.


    **Scottish context.** GTCS registration standards expect teachers to apply pedagogical theory and
    research findings; Education Scotland signposts the EEF Toolkit for equity planning.

    '
  status: draft
  version: '0.1'
  curated_by:
  - agent-EVD
  facets:
    jurisdiction:
    - scotland
    cfe_level:
    - second
    - third
    stage:
    - p7
    - s1
    curriculum_area:
    - all
    subject:
    - english
    - history
    lesson_purpose:
    - introduce
    - guided_practice
    knowledge_type:
    - declarative
    - procedural
    - conceptual
    expertise:
    - novice
    - developing
    artefact_type:
    - slides
    - worksheet
    - form
    - lesson_plan
    - interaction
  evidence:
    rating: strong
    rationale: Convergent support from classroom process-product research (Rosenshine), cognitive load
      reviews and a meta-analysis showing unassisted discovery underperforms explicit instruction; see
      clm-EVD-ei-04.
  prerequisites:
  - Teacher has sequenced the content into small steps and identified likely misconceptions
  risks:
  - Over-long teacher talk without checks for understanding becomes lecturing, not explicit instruction.
  - Keeping guidance too long for pupils who are already secure can hold them back (expertise reversal).
  relations:
    conflicts_with:
    - prn-EVD-minimally-guided-discovery-pbl
  artefact_recipes:
    slides: 'One idea per slide; a goal slide, then steps. P7 English: slide sequence teaching how to
      write a topic sentence for a persuasive paragraph (definition, one example, one non-example, a "you
      try" slide). S1 history: slide sequence on causes of the Wars of Independence, one cause per slide
      with a key term in bold and a check question before the next slide.

      '
    worksheet: '"I do, we do, you do" layout. P7 English: worked model of a persuasive paragraph, a half-completed
      one, then two to write alone. S1 history: a model answer explaining one cause of the 1296 invasion,
      a partly completed paragraph on a second cause, then one to write independently.

      '
    form: 'Three-question exit check after each step. P7 English: "Which sentence is the topic sentence?"
      (multiple choice). S1 history: "Put these three events in order" plus "Explain why in one sentence."

      '
    lesson_plan: 'Review (5 min); state goal; explain and model in two or three small steps with a check
      after each; guided practice to about 80 percent success; independent practice; brief summary. Example
      P7: topic sentences. Example S1: causes of a historical event.

      '
    interaction: 'Mini-whiteboards after each step; teacher scans all answers and reteaches if fewer than
      most are correct. Cold call with no hands up, then follow-up "How do you know?"

      '
