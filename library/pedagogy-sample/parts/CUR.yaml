  entry_id: cur-CUR-lit-2-02a
  text: 'Evidence of achievement at Second Level: at second level the benchmarks look for several relevant ideas
    offered in discussion, respect for other views, building on what others say, use of verbal and non-verbal techniques,
    and some recognition of techniques used to influence a listener.'
  supported_by:
  - psg-CUR-lit-2-02a-bm
  support_type: paraphrase
