- id: cur-CUR-levels-p7-s1-transition
  type: curriculum_ref
  title: Levels and the P7 to S1 transition (second to third level)
  summary: P7 sits in the second level band and S1 in the third/fourth level band of the Broad General Education;
    official guidance stresses progression at the learner's own pace and continuity across sectors, but no fetched
    source sets a specific P7 to S1 transition expectation.
  body: '- Second level is the P5 to P7 band; third/fourth level spans S1 to S3; both are inside the BGE.

    - Stages are a guide: a P7 pupil may still be working within second level, or beyond it, and S1 planning should
    start from evidence of where the learner actually is.

    - Literacy remains the responsibility of all staff in secondary, so S1 history is a literacy context as well
    (social studies principles and practice).

    - Gap: no official Education Scotland source fetched gives a specific P7 to S1 transition standard; the CIC
    lists transitions as an area for revision.'
