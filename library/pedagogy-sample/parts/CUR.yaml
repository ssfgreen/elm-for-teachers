passages:
- id: psg-CUR-lit-2-02a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.3, 'Listening and talking, Tools for listening and talking', LIT 2-02a
  text: Learners respond to others in ways that suit their role in the discussion, show that they value other people's
    contributions and use them to take their own thinking further.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-02a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Listening and talking' (printed heading uses a dash), benchmarks column beside
    LIT 2-02a; no printed page numbers in the PDF
  text: At second level the benchmarks look for several relevant ideas offered in discussion, respect for other
    views, building on what others say, use of verbal and non-verbal techniques, and some recognition of techniques
    used to influence a listener.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-04a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.4, 'Listening and talking, Finding and using information', LIT 2-04a
  text: Learners identify and talk about the purpose, main ideas and supporting detail in spoken or visual texts,
    and put that information to use for different purposes.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-04a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Listening and talking' (printed heading uses a dash), benchmarks column beside
    LIT 2-04a; no printed page numbers in the PDF
  text: The benchmarks expect learners to identify the purpose of a spoken text and its main ideas with supporting
    detail, and to make relevant notes that are mostly in their own words.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-07a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.5, 'Listening and talking, Understanding, analysing and evaluating', LIT 2-07a
  text: Learners show understanding of what they hear by answering literal, inferential and evaluative questions
    and by asking questions of their own.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-07a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Listening and talking' (printed heading uses a dash), benchmarks column beside
    LIT 2-07a; no printed page numbers in the PDF
  text: The benchmarks expect responses to literal, inferential and evaluative questions about spoken texts, learner-generated
    questions, and distinguishing fact from opinion.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-09a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.6, 'Listening and talking, Creating texts', LIT 2-09a
  text: When talking, learners share information and opinions, explain processes, identify issues, summarise what
    they have found, and ask questions to clarify meaning.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-09a-bm-note
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Listening and talking', benchmarks column; no printed page numbers in the PDF
  text: No benchmark bullets are tagged specifically to LIT 2-09a; the talking and presentation bullets (communicating
    clearly, organising a talk, choosing suitable vocabulary and resources) are tagged to LIT 2-10a and LIT 3-10a.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-eng-2-12a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.8, 'Reading, Tools for reading', ENG 2-12a
  text: Learners read unfamiliar texts aloud with increasing fluency, understanding and expression, drawing on context
    clues, punctuation, grammar and layout.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-eng-2-12a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Reading' (printed heading uses a dash), benchmarks column beside ENG 2-12a; no
    printed page numbers in the PDF
  text: The benchmarks look for fluent, expressive reading using context clues, punctuation, grammar and layout,
    together with strategies such as skimming, scanning, predicting and summarising (bullets shared with LIT 2-13a
    and with third and fourth level ENG 12a).
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-16a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.10, 'Reading, Understanding, analysing and evaluating', LIT 2-16a
  text: Across different areas of learning, learners show understanding of a text by identifying its purpose and
    main ideas and by using supporting detail.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-16a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Reading' (printed heading uses a dash), benchmarks column beside LIT 2-16a; no
    printed page numbers in the PDF
  text: Benchmark bullets grouped with ENG 2-17a expect learners to identify purpose and main ideas with detail,
    comment on language features, answer literal, inferential and evaluative questions, create their own questions,
    distinguish fact from opinion and recognise persuasive techniques.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-eng-2-17a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.10, 'Reading, Understanding, analysing and evaluating', ENG 2-17a
  text: Learners show understanding of texts by answering literal, inferential and evaluative questions and close
    reading tasks, and begin to create their own questions.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-eng-2-17a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Reading' (printed heading uses a dash), benchmarks column beside ENG 2-17a; no
    printed page numbers in the PDF
  text: Benchmark bullets grouped with LIT 2-16a expect answers to literal, inferential and evaluative questions,
    learner-created questions, and comment on the writer's use of language features.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-18a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.11, 'Reading, Understanding, analysing and evaluating', LIT 2-18a
  text: Learners tell fact from opinion, recognise when a writer is trying to influence them, and judge how useful
    and believable different sources are.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-18a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Reading' (printed heading uses a dash), benchmarks column beside LIT 2-18a; no
    printed page numbers in the PDF
  text: The benchmarks expect learners to explain how they decide which sources are most useful and reliable, and
    to recognise when a source is trying to influence the reader.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-eng-2-19a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.11, 'Reading, Understanding, analysing and evaluating', ENG 2-19a
  text: Learners discuss a text's structure, characters and setting, relate its themes to their own experience,
    and comment on the writer's style and use of language.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-eng-2-19a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Reading' (printed heading uses a dash), benchmarks column beside ENG 2-19a; no
    printed page numbers in the PDF
  text: The benchmarks look for comment on structure, characterisation and setting, links between the writer's theme
    and the learner's experience, and comment on style and genre features.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-21a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.13, 'Writing, Tools for writing', LIT 2-21a
  text: Learners spell most of the words they need correctly, using spelling rules, specialist vocabulary, self-correction
    and resources.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-21a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Writing' (printed heading uses a dash), benchmarks column beside LIT 2-21a; no
    printed page numbers in the PDF
  text: The writing tools benchmarks (shared across LIT 2-21a, 2-22a and 2-23a) look for most words spelled correctly,
    mainly accurate punctuation, grammatically accurate sentences of varied length and opening, linked sentences
    in paragraphs, and fluent, legible handwriting.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-22a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.13, 'Writing, Tools for writing', LIT 2-22a
  text: Learners use appropriate punctuation, vary sentence structures, and organise their writing into paragraphs
    so that it makes sense to the reader.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-22a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Writing' (printed heading uses a dash), benchmarks column beside LIT 2-22a; no
    printed page numbers in the PDF
  text: The shared writing tools benchmarks expect punctuation and paragraphing to be used in both short and extended
    texts.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-23a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.13, 'Writing, Tools for writing', LIT 2-23a
  text: Throughout the writing process, learners check that their writing makes sense and meets its purpose.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-23a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Writing' (printed heading uses a dash), benchmarks column beside LIT 2-23a; no
    printed page numbers in the PDF
  text: The shared writing tools benchmarks expect learners to review and correct their work so that it makes sense,
    is accurate and meets its purpose, and to make suitable layout choices for print and digital texts.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-26a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.15, 'Writing, Organising and using information', LIT 2-26a
  text: Learners select ideas and information and organise them in a way that suits the type of text and its purpose,
    using suitable vocabulary.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-26a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Writing' (printed heading uses a dash), benchmarks column beside LIT 2-26a; no
    printed page numbers in the PDF
  text: The benchmarks look for notes and sources used to develop ideas, sources acknowledged, information organised
    logically and selected for relevance, and vocabulary suited to purpose and audience.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-29a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.16, 'Writing, Creating texts', LIT 2-29a
  text: Learners write to persuade, argue, explore issues or express an opinion, backing up their points with relevant
    detail or evidence.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/qhxmxnfq/literacy-english-eo.pdf
  verified_by_fetch: true
- id: psg-CUR-lit-2-29a-bm
  source_id: src-CUR-lit-eng-benchmarks
  locator: Section 'Second level, Writing' (printed heading uses a dash), benchmarks column beside LIT 2-29a; no
    printed page numbers in the PDF
  text: When writing to persuade or argue, the benchmarks look for relevant ideas with supporting detail, logical
    organisation, an introduction and conclusion, and an attempt to influence the reader.
  excerpt_type: paraphrase
  fetched_url: https://education.gov.scot/media/giljynmw/literacyenglishbenchmarks.pdf
  verified_by_fetch: true
- id: psg-CUR-eng-2-31a-eo
  source_id: src-CUR-lit-eng-eo
  locator: p.17, 'Writing, Creating texts', ENG 2-31a
  text: Learners create stories, poems and plays with interesting structures, characters and settings.
  excerpt_type: paraphrase
