- id: clm-CUR-lit-2-02a-eo
  entry_id: cur-CUR-lit-2-02a
  text: 'LIT 2-02a is a Second Level outcome under Listening and talking, Tools for listening and talking: learners
    respond to others in ways that suit their role in the discussion, show that they value other people''s contributions
    and use them to take their own thinking further.'
