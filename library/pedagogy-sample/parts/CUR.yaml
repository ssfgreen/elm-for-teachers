    normally the P5 to P7 band, used here for the P7 cell.
  body: "**Organiser:** Listening and talking, Tools for listening and talking  \n**Outcome (paraphrase):** Learners\
    \ respond to others in ways that suit their role in the discussion, show that they value other people's contributions\
    \ and use them to take their own thinking further.  \n**Benchmark evidence (paraphrase):** At second level the\
    \ benchmarks look for several relevant ideas offered in discussion, respect for other views, building on what\
    \ others say, use of verbal and non-verbal techniques, and some recognition of techniques used to influence\
    \ a listener.  \nAlways read the full official statement in the source document; the wording here is a curator\
    \ paraphrase."
