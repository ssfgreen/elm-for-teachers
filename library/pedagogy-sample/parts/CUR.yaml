  support_type: paraphrase
- id: clm-CUR-cic-areas
  entry_id: cau-CUR-cic-under-review
  text: Literacy and English, Languages and Social Studies each have Phase 1 CIC background and evidence papers,
    so both sample cells are in scope of the review.
