- id: clm-CUR-cic-what
  entry_id: cau-CUR-cic-under-review
  text: The Curriculum Improvement Cycle is a planned, systematic review of Scotland's curriculum, led by Education
    Scotland since April 2024 following the 2021 OECD review.
  supported_by:
  - psg-CUR-cic-origin
  - psg-CUR-cic-news-definition
  support_type: paraphrase
- id: clm-CUR-cic-eos
  entry_id: cau-CUR-cic-under-review
  text: Education Scotland states that the BGE technical framework, including the Experiences and Outcomes, needs
    to be revisited.
  supported_by:
  - psg-CUR-cic-technical-framework
  support_type: direct_quote
- id: clm-CUR-cic-2028
  entry_id: cau-CUR-cic-under-review
  text: Scottish Government plans to phase out the current technical framework documents and guidance from August
    2028 and replace them with a new framework.
