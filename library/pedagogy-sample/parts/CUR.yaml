  entry_id: cur-CUR-eng-2-12a
  text: 'ENG 2-12a is a Second Level outcome under Reading, Tools for reading: learners read unfamiliar texts aloud
    with increasing fluency, understanding and expression, drawing on context clues, punctuation, grammar and layout.'
