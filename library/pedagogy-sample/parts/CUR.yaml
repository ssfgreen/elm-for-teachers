  entry_id: cur-CUR-lit-2-16a
  text: 'Evidence of achievement at Second Level: benchmark bullets grouped with ENG 2-17a expect learners to identify
    purpose and main ideas with detail, comment on language features, answer literal, inferential and evaluative
    questions, create their own questions, distinguish fact from opinion and recognise persuasive techniques.'
