    framework that Education Scotland is reviewing; existing documents are due to be phased out from August 2028.
  body: 'The Curriculum Improvement Cycle (CIC) is Education Scotland''s planned review of the curriculum. The current
    phase focuses on the technical framework, including the Experiences and Outcomes. Phase 1 background and evidence
    papers exist for Literacy and English, Languages and Social Studies (updated November 2026). Scottish Government
    says current technical framework documents will be phased out from August 2028.


