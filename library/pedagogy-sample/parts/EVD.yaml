passages:
  # ---------------- EEF Toolkit: metacognition ----------------
  - id: psg-EVD-tlt-meta-headline
    source_id: src-EVD-eef-tlt-metacognition
    locator: "Strand page, headline panel (impact, cost, evidence strength)"
    text: "High impact for very low cost based on extensive evidence."
    excerpt_type: quote
    fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/metacognition-and-self-regulation
    verified_by_fetch: true
  - id: psg-EVD-tlt-meta-figures
    source_id: src-EVD-eef-tlt-metacognition
    locator: "Strand page, headline panel and evidence strength note"
    text: "Average impact of about +8 months' additional progress; evidence strength rated high, drawn from 355 studies, with one padlock removed because many studies were not independently evaluated."
    excerpt_type: paraphrase
    fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/metacognition-and-self-regulation
    verified_by_fetch: true
  - id: psg-EVD-tlt-meta-curriculum
    source_id: src-EVD-eef-tlt-metacognition
    locator: "Strand page, key findings list (UNCONFIRMED: exact heading wording)"
    text: "Strategies are most effective when taught and applied within normal curriculum content rather than as separate thinking skills lessons; teachers can model their thinking aloud and co-create planning checklists and self-questioning prompts."
    excerpt_type: paraphrase
    fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/metacognition-and-self-regulation
    verified_by_fetch: true
  - id: psg-EVD-tlt-meta-age
    source_id: src-EVD-eef-tlt-metacognition
    locator: "Strand page, section on effectiveness by phase and subject (UNCONFIRMED: exact heading)"
    text: "Effects are similar and high across early years, primary and secondary studies, with gains reported in literacy, mathematics and science."
    excerpt_type: paraphrase
    fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/metacognition-and-self-regulation
    verified_by_fetch: true
  - id: psg-EVD-tlt-meta-hard
    source_id: src-EVD-eef-tlt-metacognition
    locator: "Strand page, key findings list (UNCONFIRMED: exact heading wording)"
    text: "The high average impact can be hard to realise in practice; teachers need professional support to teach strategies explicitly, and teachers' own understanding of metacognition affects outcomes."
    excerpt_type: paraphrase
    fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/metacognition-and-self-regulation
    verified_by_fetch: true
  - id: psg-EVD-tlt-meta-collab
    source_id: src-EVD-eef-tlt-metacognition
    locator: "Strand page, key findings list (UNCONFIRMED: exact heading wording)"
    text: "Structured collaborative groups can support metacognition, but the collaboration has to be carefully designed; reasoning, argument and debate help pupils reflect on their own and others' learning."
    excerpt_type: paraphrase
    fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/metacognition-and-self-regulation
    verified_by_fetch: true

  # ---------------- EEF Toolkit: reading comprehension ----------------
  - id: psg-EVD-tlt-rc-headline
    source_id: src-EVD-eef-tlt-reading-comp
    locator: "Strand page, headline panel"
    text: "High impact for very low cost based on moderate evidence."
    excerpt_type: quote
    fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/reading-comprehension-strategies
    verified_by_fetch: true
  - id: psg-EVD-tlt-rc-figures
    source_id: src-EVD-eef-tlt-reading-comp
    locator: "Strand page, headline panel and 'Evidence security' section"
    text: "Average impact of about +7 months from 184 studies; evidence security moderate, with padlocks removed because many studies were not independent and results varied widely in unexplained ways."
    excerpt_type: paraphrase
    fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/reading-comprehension-strategies
    verified_by_fetch: true
  - id: psg-EVD-tlt-rc-teaching
    source_id: src-EVD-eef-tlt-reading-comp
    locator: "Strand page, 'Teaching approach' and 'Text type' sections"
    text: "Teachers should model strategies explicitly and then move pupils through guided towards independent practice; texts should be engaging, suitably challenging and connected to pupils' prior knowledge."
    excerpt_type: paraphrase
    fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/reading-comprehension-strategies
    verified_by_fetch: true
  - id: psg-EVD-tlt-rc-diagnosis
    source_id: src-EVD-eef-tlt-reading-comp
    locator: "Strand page, 'Struggling readers' section"
    text: "For pupils who struggle, accurate diagnosis matters because the difficulty may lie in decoding, sentence structure or vocabulary rather than comprehension strategies; this is especially important for older readers."
    excerpt_type: paraphrase
    fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/reading-comprehension-strategies
    verified_by_fetch: true

  # ---------------- EEF Toolkit: feedback ----------------
  - id: psg-EVD-tlt-fb-figures
    source_id: src-EVD-eef-tlt-feedback
    locator: "Strand page, headline panel and evidence strength note"
    text: "Average impact of about +6 months from 155 studies; evidence strength high, with one padlock removed because many studies were not randomised controlled trials."
    excerpt_type: paraphrase
    fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/feedback
    verified_by_fetch: true
  - id: psg-EVD-tlt-fb-focus
    source_id: src-EVD-eef-tlt-feedback
    locator: "Strand page, key findings (UNCONFIRMED: exact heading wording)"
    text: "The most effective feedback focuses on the task, the subject or self-regulation and gives specific guidance on how to improve; feedback should also be given when work is correct."
    excerpt_type: paraphrase
    fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/feedback
    verified_by_fetch: true
  - id: psg-EVD-tlt-fb-phase
    source_id: src-EVD-eef-tlt-feedback
    locator: "Strand page, impact by phase and method (UNCONFIRMED: exact heading wording)"
    text: "Primary pupils show slightly larger gains (+7 months) than secondary pupils (+5 months); verbal feedback shows slightly higher impact (+7 months), and written marking is optional rather than required."
    excerpt_type: paraphrase
    fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/feedback
    verified_by_fetch: true

  # ---------------- EEF Toolkit: oral language ----------------
  - id: psg-EVD-tlt-oral-figures
    source_id: src-EVD-eef-tlt-oral-language
    locator: "Strand page, headline panel and evidence strength note"
    text: "Average impact of about +6 months from 188 studies; evidence strength high, with one padlock removed because many studies were not independently evaluated."
    excerpt_type: paraphrase
    fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/oral-language-interventions
    verified_by_fetch: true
  - id: psg-EVD-tlt-oral-dialogic
    source_id: src-EVD-eef-tlt-oral-language
    locator: "Strand page, 'Interactions' section"
