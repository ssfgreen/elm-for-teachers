entries:
  # =====================================================================
  - id: prn-EVD-explicit-instruction
    type: principle
    title: "Explicit instruction"
    summary: "Teach new content in small, sequenced steps with clear explanation, modelling, frequent checks and guided practice before independent work. Most effective for novices, which at P7 and S1 means most pupils most of the time."
    body: |
      **What it is.** The teacher states the goal, explains in small steps, models (including thinking aloud), asks many questions of all pupils, guides practice and only then releases pupils to independent practice. Guidance is faded as pupils gain expertise.

      **Why it works.** Working memory is limited for new material; strong guidance reduces unproductive search so attention goes to the key ideas. The advantage shrinks for pupils who already know a lot (expertise reversal).

      **How to do it.**
      - Open with a short review of prior learning.
      - Break content into small steps and have pupils practise after each step.
      - Use examples and non-examples, precise language, and plan for likely misconceptions.
      - Check every pupil (mini-whiteboards, cold calling, hinge questions) and aim for roughly 80 percent success in guided practice.
      - Move to independent practice only when pupils are secure.

      **Scottish context.** GTCS registration standards expect teachers to apply pedagogical theory and research findings; Education Scotland signposts the EEF Toolkit for equity planning.
    status: draft
    version: "0.1"
    curated_by: [agent-EVD]
    facets:
      jurisdiction: [scotland]
      cfe_level: [second, third]
      stage: [p7, s1]
      curriculum_area: [all]
      subject: [english, history]
      lesson_purpose: [introduce, guided_practice]
      knowledge_type: [declarative, procedural, conceptual]
      expertise: [novice, developing]
      artefact_type: [slides, worksheet, form, lesson_plan, interaction]
    evidence:
      rating: strong
      rationale: "Convergent support from classroom process-product research (Rosenshine), cognitive load reviews and a meta-analysis showing unassisted discovery underperforms explicit instruction; see clm-EVD-ei-04."
    prerequisites: ["Teacher has sequenced the content into small steps and identified likely misconceptions"]
    risks:
      - "Over-long teacher talk without checks for understanding becomes lecturing, not explicit instruction."
      - "Keeping guidance too long for pupils who are already secure can hold them back (expertise reversal)."
    relations:
      conflicts_with: [prn-EVD-minimally-guided-discovery-pbl]
    artefact_recipes:
      slides: |
        One idea per slide; a goal slide, then steps. P7 English: slide sequence teaching how to write a topic sentence for a persuasive paragraph (definition, one example, one non-example, a "you try" slide). S1 history: slide sequence on causes of the Wars of Independence, one cause per slide with a key term in bold and a check question before the next slide.
      worksheet: |
        "I do, we do, you do" layout. P7 English: worked model of a persuasive paragraph, a half-completed one, then two to write alone. S1 history: a model answer explaining one cause of the 1296 invasion, a partly completed paragraph on a second cause, then one to write independently.
      form: |
        Three-question exit check after each step. P7 English: "Which sentence is the topic sentence?" (multiple choice). S1 history: "Put these three events in order" plus "Explain why in one sentence."
      lesson_plan: |
        Review (5 min); state goal; explain and model in two or three small steps with a check after each; guided practice to about 80 percent success; independent practice; brief summary. Example P7: topic sentences. Example S1: causes of a historical event.
      interaction: |
        Mini-whiteboards after each step; teacher scans all answers and reteaches if fewer than most are correct. Cold call with no hands up, then follow-up "How do you know?"
    claims: [clm-EVD-ei-01, clm-EVD-ei-02, clm-EVD-ei-03, clm-EVD-ei-04, clm-EVD-ei-05, clm-EVD-ei-06, clm-EVD-ei-07]

  # =====================================================================
  - id: prn-EVD-retrieval-practice
    type: principle
    title: "Retrieval practice"
    summary: "Have pupils recall previously learned material from memory (low-stakes quizzes, free recall, flashcards) rather than re-reading it, and give feedback on the answers."
    body: |
      **What it is.** Pulling information out of memory strengthens it. Low-stakes, closed-book quizzing is a learning activity, not just assessment.

      **How to do it.**
      - Start lessons with three to five recall questions on earlier content (not only last lesson).
      - Prefer recall formats (short answer, fill the gap, brain dump) to recognition where possible.
      - Always follow with correct answers so errors are not consolidated.
      - Keep it low stakes: no marks recorded, self-marked.
      - Combine with spacing (see prn-EVD-spaced-practice).
    status: draft
    version: "0.1"
    curated_by: [agent-EVD]
    facets:
      jurisdiction: [scotland]
      cfe_level: [second, third]
      stage: [p7, s1]
      curriculum_area: [all]
      subject: [english, history]
      lesson_purpose: [guided_practice, independent_practice, assess_feedback]
      knowledge_type: [declarative, conceptual]
      expertise: [novice, developing, secure]
      artefact_type: [slides, worksheet, form, lesson_plan, interaction]
    evidence:
      rating: strong
      rationale: "Rated strong by the WWC practice guide and supported by the Adesope et al. 2017 meta-analysis; see clm-EVD-rp-01 and clm-EVD-rp-02."
    prerequisites: ["Content has been taught before it is retrieved"]
    risks:
      - "Without feedback, wrong answers may be remembered."
      - "High-stakes framing can raise anxiety; keep scores private or unrecorded."
    relations:
      conflicts_with: []
    artefact_recipes:
      slides: |
        "Do now" slide with four questions mixing last lesson, last week and last month, answers revealed on the next slide. P7 English: "What is a simile? Give one from our class novel. What does 'protagonist' mean?" S1 history: "Who won at Stirling Bridge? What year? Name one reason Edward I invaded."
      worksheet: |
        Brain-dump box ("Write everything you remember about...") followed by a checklist to self-mark against. P7 English: features of a newspaper report. S1 history: life in a medieval burgh.
      form: |
        Self-marking quiz form, five short-answer items, answers and explanations shown after submission; results not recorded. Mix old and new topics.
      lesson_plan: |
        Five-minute retrieval starter every lesson; one weekly cumulative quiz; teacher notes items most pupils missed and reteaches.
      interaction: |
        Think, write, then pair-check before the reveal; mini-whiteboards so every pupil retrieves, not just volunteers.
    claims: [clm-EVD-rp-01, clm-EVD-rp-02, clm-EVD-rp-03, clm-EVD-rp-04, clm-EVD-rp-05]

  # =====================================================================
  - id: prn-EVD-spaced-practice
    type: principle
    title: "Spaced practice"
    summary: "Return to key content repeatedly over weeks and months rather than concentrating practice in one block."
    body: |
      **What it is.** Distributing practice and review over time improves long-term retention compared with massing the same amount of practice.

      **How to do it.**
      - Plan brief reviews of material taught several weeks earlier.
      - Include a few items on older topics in each homework or practice set.
      - Use cumulative end-of-unit and end-of-term checks.
      - The gap does not have to keep increasing; regular spaced returns are what matter.
    status: draft
    version: "0.1"
    curated_by: [agent-EVD]
    facets:
      jurisdiction: [scotland]
      cfe_level: [second, third]
      stage: [p7, s1]
      curriculum_area: [all]
      subject: [english, history]
      lesson_purpose: [independent_practice, assess_feedback]
      knowledge_type: [declarative, procedural]
      expertise: [novice, developing, secure]
      artefact_type: [slides, worksheet, form, lesson_plan]
    evidence:
      rating: moderate
      rationale: "Large effects in a meta-analysis (Latimier et al. 2021, g = 0.74 for spaced retrieval) but WWC rates classroom evidence moderate; see clm-EVD-sp-01 and clm-EVD-sp-02."
    prerequisites: ["A long-term plan that records when topics were taught"]
    risks: ["Early reviews may show a lot of forgetting; this is expected and relearning is faster."]
    relations:
      conflicts_with: []
    artefact_recipes:
      slides: |
        Recurring "Flashback" slide with one question from four weeks ago and one from last term. P7 English: apostrophes for possession (taught in term 1). S1 history: chronology of the Wars of Independence revisited during a later topic.
      worksheet: |
        Every practice sheet ends with a "From before" section of two to three items on earlier topics. P7 English: spelling rules from earlier units. S1 history: key vocabulary from the previous unit.
      form: |
        Monthly cumulative quiz form drawing from all units so far, randomised order.
      lesson_plan: |
        Long-term plan grid marking review points at roughly one week, one month and end of term after first teaching.
      interaction: |
        "Pick a card" review game using a deck of question cards from all earlier units.
    claims: [clm-EVD-sp-01, clm-EVD-sp-02, clm-EVD-sp-03, clm-EVD-sp-04, clm-EVD-sp-05]

  # =====================================================================
  - id: prn-EVD-worked-examples
    type: principle
    title: "Worked examples and faded guidance"
    summary: "Show complete, step-by-step solutions or models, alternate them with problems for pupils to try, and fade the worked steps as pupils gain expertise."
    body: |
      **What it is.** A worked example is a fully completed model with the steps made visible. Studying them reduces unproductive search for novices.

      **How to do it.**
      - Present a worked model, then a similar task for pupils to complete.
      - Alternate model and task rather than giving a block of tasks.
      - Fade: give partially completed examples (completion tasks) before full independence.
      - Label steps by their purpose so pupils see the structure.
      - In English and history, worked examples are model paragraphs, annotated source analyses and exemplar answers with the reasoning shown.
    status: draft
    version: "0.1"
    curated_by: [agent-EVD]
    facets:
      jurisdiction: [scotland]
      cfe_level: [second, third]
      stage: [p7, s1]
      curriculum_area: [all]
      subject: [english, history]
      lesson_purpose: [introduce, guided_practice]
      knowledge_type: [procedural, disciplinary]
      expertise: [novice, developing]
      artefact_type: [slides, worksheet, lesson_plan, interaction]
    evidence:
      rating: moderate
      rationale: "WWC rates interleaving worked examples with problems as moderate evidence, mostly from mathematics and science; transfer to writing and history is by inference; see clm-EVD-we-01."
    prerequisites: ["A clear model answer exists for the task"]
    risks:
      - "Worked examples lose value and can hinder more expert pupils."
      - "Evidence base is mostly STEM; extended writing models are an inference by the curator."
    relations:
      conflicts_with: []
    artefact_recipes:
      slides: |
        Annotated model revealed step by step. P7 English: a model descriptive paragraph with annotations for sensory detail, simile and varied openers. S1 history: a model source analysis of a primary source (for example a chronicle extract) showing origin, purpose and content steps.
      worksheet: |
        Model, then completion task, then independent task. P7 English: full model paragraph; second paragraph with the last two sentences missing; third written alone. S1 history: full "explain why" answer; second with only the point given; third independent.
      lesson_plan: |
        Discuss a worked model together, pupils attempt one item alone, return to the model to compare, repeat with a faded model.
      interaction: |
        "Spot the step" pairs task: pupils label each step of the model with its purpose before trying their own.
    claims: [clm-EVD-we-01, clm-EVD-we-02, clm-EVD-we-03, clm-EVD-we-04, clm-EVD-we-05]

  # =====================================================================
  - id: prn-EVD-metacognition
    type: principle
    title: "Metacognition and self-regulated learning"
    summary: "Explicitly teach pupils to plan, monitor and evaluate their learning, within subject content, through modelling, guided practice and structured reflection."
    body: |
      **What it is.** Pupils learn strategies for planning, monitoring and evaluating their own work, and the knowledge of when to use them.

      **How to do it (EEF seven-step model).**
      1. Activate prior knowledge.
      2. Explicitly teach the strategy.
      3. Model it, thinking aloud.
      4. Check understanding of the strategy.
      5. Guided practice.
      6. Independent practice.
      7. Structured reflection.

      Teach within normal lessons, not as separate thinking-skills lessons. Pitch challenge so pupils need the strategy but are not overloaded. Use metacognitive talk ("How will I start? How do I know this is working?").

      **Scottish context.** A Scottish educational psychology service (Inverclyde) promotes the same approach and the EEF guidance; Education Scotland signposts the EEF Toolkit for equity planning.
    status: draft
    version: "0.1"
    curated_by: [agent-EVD]
    facets:
      jurisdiction: [scotland]
      cfe_level: [second, third]
      stage: [p7, s1]
      curriculum_area: [all]
      subject: [english, history]
      lesson_purpose: [introduce, guided_practice, independent_practice, assess_feedback]
      knowledge_type: [metacognitive]
      expertise: [novice, developing, secure]
      artefact_type: [slides, worksheet, form, lesson_plan, interaction]
    evidence:
      rating: strong
      rationale: "EEF Toolkit reports about +8 months from 355 studies with high evidence strength; see clm-EVD-mc-01."
    prerequisites: ["Pupils have enough subject knowledge to apply a strategy"]
    risks:
      - "Generic thinking-skills lessons detached from content are less effective."
      - "High average impact is hard to achieve without teacher professional learning."
    relations:
      conflicts_with: []
    artefact_recipes:
      slides: |
        Think-aloud slide showing the teacher's plan, then "How did I check?" slide. P7 English: teacher plans a persuasive letter aloud (audience, purpose, three points) and rereads to check. S1 history: teacher plans an answer to "How far was Bruce responsible for Scottish independence?", sorting factors and checking against the question.
      worksheet: |
        Plan, monitor, evaluate strip on the side of the task. P7 English: "Before: What is my purpose? During: Have I used a new paragraph for each point? After: What would I change?" S1 history: "Before: What is the question asking? During: Have I used evidence? After: Did I answer 'how far'?"
      form: |
        Short reflection form after an extended task: confidence rating, strategy used, one thing to change next time.
      lesson_plan: |
        Follow the seven steps across two lessons; reflection in the final five minutes. Example P7: summarising a chapter. Example S1: planning an extended answer.
      interaction: |
        Metacognitive questioning during circulation ("What's your plan? Is it working? What else could you try?"); pairs explain their strategy to each other.
    claims: [clm-EVD-mc-01, clm-EVD-mc-02, clm-EVD-mc-03, clm-EVD-mc-04, clm-EVD-mc-05, clm-EVD-mc-06, clm-EVD-mc-07, clm-EVD-mc-08]

  # =====================================================================
  - id: prn-EVD-feedback
    type: principle
    title: "Feedback that moves learning forward"
    summary: "Give specific, actionable feedback on the task, the subject or the pupil's self-regulation, at a time that helps, and plan for pupils to act on it."
    body: |
      **What it is.** Information about performance that helps pupils close the gap between current and desired work.

      **How to do it.**
      - Build on strong initial teaching and formative assessment so feedback has less to fix.
      - Focus on the task, subject or strategy, not the person; be specific about how to improve.
      - Choose timing (immediate or delayed) to suit the task and pupil.
      - Plan time for pupils to act on feedback.
      - Verbal and whole-class feedback can be efficient; written marking is one option, not a requirement, and has workload costs.
      - Give feedback on correct work too.

      **Scottish context.** The GTCS Standard for Full Registration expects meaningful feedback that agrees next steps with learners.
    status: draft
    version: "0.1"
    curated_by: [agent-EVD]
    facets:
      jurisdiction: [scotland]
      cfe_level: [second, third]
      stage: [p7, s1]
      curriculum_area: [all]
      subject: [english, history]
      lesson_purpose: [assess_feedback, guided_practice]
      knowledge_type: [procedural, conceptual, metacognitive]
      expertise: [novice, developing, secure]
      artefact_type: [slides, worksheet, form, lesson_plan, interaction]
    evidence:
      rating: strong
      rationale: "EEF Toolkit: about +6 months from 155 studies with high evidence strength; see clm-EVD-fb-01."
    prerequisites: ["Clear success criteria for the task"]
    risks:
      - "Vague praise or grades alone give pupils nothing to act on."
      - "Heavy written marking policies cost time without guaranteed benefit."
    relations:
      conflicts_with: []
    artefact_recipes:
      slides: |
        Whole-class feedback slide: common strengths, two common errors with a corrected example, one improvement task. P7 English: errors in direct speech punctuation. S1 history: answers that describe instead of explaining causes.
      worksheet: |
        Redrafting box under the original work with a single specific target. P7 English: "Add one sentence that shows the character's feelings through action." S1 history: "Add a 'because' sentence linking this evidence to the cause."
      form: |
        Feedback response form: pupil copies the target, makes the change, ticks when done; teacher spot-checks.
      lesson_plan: |
        Ten minutes of dedicated improvement time in the lesson after work is reviewed; teacher circulates to give verbal feedback.
      interaction: |
        Live verbal feedback while circulating; brief conferences with three or four pupils per lesson.
    claims: [clm-EVD-fb-01, clm-EVD-fb-02, clm-EVD-fb-03, clm-EVD-fb-04, clm-EVD-fb-05]

  # =====================================================================
  - id: prn-EVD-formative-assessment
    type: principle
    title: "Formative assessment (assessment for learning)"
    summary: "Gather evidence of what all pupils understand during learning and use it to adapt teaching straight away."
    body: |
      **What it is.** Assessment is formative when the evidence is used to change teaching or learning. In Scotland this is often called Assessment is for Learning.

      **How to do it.**
      - Share clear learning intentions and success criteria.
      - Ask questions that reveal thinking; give wait time; get responses from all pupils (whiteboards, hinge questions).
      - Act on the evidence: reteach, regroup, move on.
      - Use comment feedback and train pupils in self- and peer-assessment.

      **Scottish context.** GTCS standards describe assessment as integral to learning and teaching and value learner dialogue about progress.
    status: draft
    version: "0.1"
    curated_by: [agent-EVD]
    facets:
      jurisdiction: [scotland]
      cfe_level: [second, third]
      stage: [p7, s1]
      curriculum_area: [all]
      subject: [english, history]
      lesson_purpose: [assess_feedback, guided_practice]
      knowledge_type: [declarative, procedural, conceptual]
      expertise: [novice, developing, secure]
      artefact_type: [slides, worksheet, form, lesson_plan, interaction]
    evidence:
      rating: moderate
      rationale: "Black and Wiliam's review reports typical effects of 0.4 to 0.7, and the EEF feedback evidence supports the practice, but the review is older and its effect sizes are not from a single modern meta-analysis; see clm-EVD-fa-02."
    prerequisites: ["Clear learning intentions and success criteria"]
    risks: ["Collecting evidence without acting on it is not formative."]
    relations:
      conflicts_with: []
    artefact_recipes:
      slides: |
        Hinge-question slide mid-lesson with four options, each wrong option tied to a known misconception. P7 English: "Which word in this sentence is an adverb?" S1 history: "Which of these is a primary source for the Battle of Bannockburn?"
      worksheet: |
        Success criteria checklist at the top for self-assessment, with a peer comment box. P7 English: features of a recount. S1 history: features of a good source evaluation.
      form: |
        Exit ticket form with one diagnostic question and a confidence scale; teacher uses results to group pupils next lesson.
      lesson_plan: |
        Plan a hinge point at about the midpoint with planned responses: if most are correct move on, otherwise reteach with a different example.
      interaction: |
        No hands up with wait time; all pupils write on whiteboards before a few share; traffic-light cups for self-signalling.
    claims: [clm-EVD-fa-01, clm-EVD-fa-02, clm-EVD-fa-03, clm-EVD-fa-04]

  # =====================================================================
  - id: prn-EVD-reading-comprehension-strategies
    type: principle
    title: "Explicit teaching of reading comprehension strategies"
    summary: "Teach strategies such as predicting, questioning, clarifying, summarising and activating prior knowledge through modelling and supported practice, then gradual release, using well-chosen texts."
    body: |
      **What it is.** Strategies that help readers build meaning from a text. They assume pupils can decode; check decoding and vocabulary first for struggling readers.

      **How to do it.**
      - Teach what the strategy is, how, why and when to use it.
      - Model with a think-aloud, then guided practice, then independent use (gradual release).
      - Choose texts that require the strategy but are not too hard; link to prior knowledge.
      - Apply strategies across subjects, including history sources.
      - Reciprocal-reading style roles can work well in targeted small groups.
    status: draft
    version: "0.1"
    curated_by: [agent-EVD]
    facets:
      jurisdiction: [scotland]
      cfe_level: [second, third]
      stage: [p7, s1]
      curriculum_area: [all]
      subject: [english, history]
      lesson_purpose: [introduce, guided_practice, independent_practice]
      knowledge_type: [procedural, metacognitive]
      expertise: [novice, developing]
      artefact_type: [slides, worksheet, form, lesson_plan, interaction]
    evidence:
      rating: moderate
      rationale: "High average impact (about +7 months, 184 studies) but EEF rates evidence security moderate because of non-independent studies and unexplained variation; see clm-EVD-rc-01."
    prerequisites: ["Pupils can decode the text with reasonable accuracy"]
    risks:
      - "Strategy practice on texts that are too easy or too hard does not build comprehension."
      - "Whole-class reciprocal reading showed no advantage in one EEF trial."
    relations:
      aligns_to: [cur-CUR-lit-2-16a]
      conflicts_with: []
    artefact_recipes:
      slides: |
        Strategy icon slides (predict, question, clarify, summarise) with a teacher think-aloud on a short extract. P7 English: a chapter opening from the class novel. S1 history: a short secondary-source paragraph on the Declaration of Arbroath.
      worksheet: |
        Four-box reciprocal reading organiser. P7 English: predict from title and first paragraph, two questions, one word to clarify, a 20-word summary. S1 history: same four boxes for a textbook extract on medieval Scotland.
      form: |
        After-reading check: one literal, one inferential and one summary question, plus "Which strategy did you use?"
      lesson_plan: |
        Week 1 teacher models each strategy; week 2 guided group practice with role cards; week 3 pupils lead roles with less prompting.
      interaction: |
        Small groups of three to five rotate roles (predictor, questioner, clarifier, summariser); teacher prompts then withdraws.
    claims: [clm-EVD-rc-01, clm-EVD-rc-02, clm-EVD-rc-03, clm-EVD-rc-04, clm-EVD-rc-05]

  # =====================================================================
  - id: prn-EVD-oral-language-dialogic
    type: principle
    title: "Oral language and dialogic talk"
    summary: "Use structured, purposeful classroom talk (questioning, thinking aloud, building on answers) and explicit vocabulary teaching to develop understanding and language."
    body: |
      **What it is.** Speaking and listening used as tools for learning, not only as outcomes. Dialogic teaching uses talk to build understanding and metacognition.

      **How to do it.**
      - Ask open questions, probe with follow-ups and build on pupils' answers.
      - Give every pupil a chance to talk (pairs, talk partners, structured roles).
      - Model reasoning aloud.
      - Teach Tier 2 vocabulary explicitly with repeated use in speaking and writing.
      - Embed talk in curriculum content.

      **Scottish context.** Education Scotland's listening and talking guidance treats talk as central to learning in all subjects and describes group discussion for exploring ideas, analysing texts and debating viewpoints.
    status: draft
    version: "0.1"
    curated_by: [agent-EVD]
    facets:
      jurisdiction: [scotland]
      cfe_level: [second, third]
      stage: [p7, s1]
      curriculum_area: [all]
      subject: [english, history]
      lesson_purpose: [introduce, guided_practice, apply_transfer]
      knowledge_type: [conceptual, disciplinary]
      expertise: [novice, developing, secure]
      artefact_type: [slides, worksheet, lesson_plan, interaction]
    evidence:
      rating: strong
      rationale: "EEF Toolkit oral language interventions: about +6 months from 188 studies, high evidence strength; most outcomes are reading comprehension; see clm-EVD-ol-01."
    prerequisites: ["Classroom norms for respectful talk"]
    risks: ["Unstructured discussion can be dominated by confident pupils."]
    relations:
      conflicts_with: []
    artefact_recipes:
      slides: |
        Discussion prompt slide with sentence stems ("I agree with... because...", "Building on what X said..."). P7 English: "Was the character right to lie? Use evidence from the chapter." S1 history: "Was William Wallace a hero or a rebel?"
      worksheet: |
        Vocabulary page with three Tier 2 words: definition, example, pupil sentence. P7 English: "reluctant", "consequence", "persuade". S1 history: "authority", "rebellion", "legitimate".
      lesson_plan: |
        Think, pair, share on a key question; whole-class dialogue with probing follow-ups; pupils write after talking.
      interaction: |
        Talk roles (summariser, challenger, evidence-finder); teacher uses "Say more", "Why do you think that?", "Who can add to that?"
    claims: [clm-EVD-ol-01, clm-EVD-ol-02, clm-EVD-ol-03, clm-EVD-ol-04, clm-EVD-ol-05, clm-EVD-ol-06]

  # =====================================================================
  - id: prn-EVD-collaborative-learning
    type: principle
    title: "Structured collaborative learning"
    summary: "Use carefully designed small-group tasks (three to five pupils) with a shared goal and individual accountability, rather than simply seating pupils together."
    body: |
      **What it is.** Pupils work in small groups on a shared task designed so everyone must contribute and talk through their thinking.

      **How to do it.**
      - Groups of three to five with a joint outcome.
      - Assign roles or separate parts of a shared product so each pupil contributes.
      - Teach and practise collaboration skills.
      - Use competition sparingly.
      - Monitor that lower attainers are participating, not watching.
    status: draft
    version: "0.1"
    curated_by: [agent-EVD]
    facets:
      jurisdiction: [scotland]
      cfe_level: [second, third]
      stage: [p7, s1]
      curriculum_area: [all]
      subject: [english, history]
      lesson_purpose: [guided_practice, apply_transfer]
      knowledge_type: [conceptual, disciplinary]
      expertise: [developing, secure]
      artefact_type: [worksheet, lesson_plan, interaction]
    evidence:
      rating: moderate
      rationale: "Average about +5 months from 212 studies, but EEF rates evidence security low, and literacy gains are smaller (+3 months); see clm-EVD-cl-01."
    prerequisites: ["Pupils have enough knowledge to contribute", "Group talk routines taught"]
    risks:
      - "Unstructured group work can widen gaps if a few pupils do the thinking."
      - "Emphasis on competition can displace learning."
    relations:
      conflicts_with: []
    artefact_recipes:
      slides: |
        Roles slide with responsibilities and a timer. P7 English: group of four prepares a radio advert, each pupil owns one persuasive technique. S1 history: group investigates life in a medieval castle, each pupil responsible for one source.
      worksheet: |
        Jigsaw sheet: each pupil records their section then teaches it to the group. P7 English: four poems, each pupil finds one technique. S1 history: four accounts of Bannockburn, each pupil summarises one.
      lesson_plan: |
        Teach content first; jigsaw expert groups; home groups combine; individual exit question to check each pupil learned the whole.
      interaction: |
        Teacher asks a randomly chosen group member to report, so all must be ready.
    claims: [clm-EVD-cl-01, clm-EVD-cl-02, clm-EVD-cl-03, clm-EVD-cl-04, clm-EVD-cl-05]

