  - id: prn-EVD-dual-coding
    type: principle
    title: "Combining graphics with words (dual coding)"
    summary: "Pair relevant diagrams, timelines and graphic organisers with verbal explanation, keeping labels next to the parts they describe and avoiding decorative images."
    body: |
      **What it is.** Presenting key ideas both verbally and visually, with the two closely integrated. The WWC guide calls this combining graphics with verbal descriptions.

      **How to do it.**
      - Use visuals that carry meaning (timelines, flow diagrams, story maps, labelled images).
      - Place labels on or next to the relevant part, not in a separate key.
      - Explain a visual aloud rather than adding blocks of text beside it where possible.
      - Remove decorative images and over-detailed pictures.
      - Graphic organisers are a well-used cognitive strategy for pupils with SEND.
    status: draft
    version: "0.1"
    curated_by: [agent-EVD]
    facets:
      jurisdiction: [scotland]
      cfe_level: [second, third]
      stage: [p7, s1]
      curriculum_area: [all]
      subject: [english, history]
      lesson_purpose: [introduce, guided_practice]
      knowledge_type: [declarative, conceptual]
      expertise: [novice, developing]
      artefact_type: [slides, worksheet, lesson_plan]
    evidence:
      rating: moderate
      rationale: "WWC rates combining graphics with verbal description as moderate evidence, mainly from mathematics, science and technology; see clm-EVD-dc-01."
    prerequisites: []
    risks:
      - "Decorative clip art and busy slides can distract and add load."
      - "The term 'dual coding' is sometimes misused to mean learning styles; this principle applies to all pupils."
    relations:
      conflicts_with: [prn-EVD-learning-styles]
    artefact_recipes:
      slides: |
        One clean diagram per slide with labels on the image; teacher narrates. P7 English: story mountain for the class novel with events placed on it. S1 history: annotated timeline 1286 to 1328 with labels at each event.
      worksheet: |
        Graphic organiser with spaces adjacent to the visual. P7 English: character web with evidence boxes on each spoke. S1 history: cause-and-consequence flow chart for the Wars of Independence.
      lesson_plan: |
        Teacher draws the diagram live while explaining; pupils redraw it from memory later as retrieval.
      interaction: |
        Pupils sketch and label a diagram on whiteboards to explain an idea to a partner.
    claims: [clm-EVD-dc-01, clm-EVD-dc-02, clm-EVD-dc-03]

  # =====================================================================
  - id: prn-EVD-scaffolding
    type: principle
    title: "Scaffolding with planned fading"
    summary: "Provide temporary supports (prompts, sentence starters, templates, models, checklists) for difficult tasks and remove them as pupils become competent."
    body: |
      **What it is.** Planned support that lets pupils succeed at a task just beyond what they can do alone, withdrawn over time.

      **How to do it.**
      - Anticipate barriers and plan scaffolds in advance (visual supports, writing frames, verbal prompts, checklists, models).
      - Include guided stages between explanation and independent work.
      - Plan how and when each scaffold will be faded.
      - Use the same scaffolds for all pupils who need them; this is good teaching for all.
    status: draft
    version: "0.1"
    curated_by: [agent-EVD]
    facets:
      jurisdiction: [scotland]
      cfe_level: [second, third]
      stage: [p7, s1]
      curriculum_area: [all]
      subject: [english, history]
      lesson_purpose: [guided_practice, independent_practice]
      knowledge_type: [procedural, disciplinary]
      expertise: [novice, developing]
      artefact_type: [slides, worksheet, form, lesson_plan, interaction]
    evidence:
      rating: moderate
      rationale: "Scaffolding is a component of effective-teacher practice (Rosenshine) and of the enhanced discovery conditions that outperformed other instruction in Alfieri et al.; isolated effect sizes for scaffolding alone were not located; see clm-EVD-sc-03."
    prerequisites: []
    risks: ["Scaffolds left in place too long create dependence."]
    relations:
      conflicts_with: []
    artefact_recipes:
      slides: |
        Sentence-starter slide that is shortened in later lessons. P7 English: "The author makes me feel... because the word... suggests..." S1 history: "One reason Bruce won was... This is shown by... This mattered because..."
      worksheet: |
        Three tiers of the same task: full writing frame, starters only, blank. P7 English: book review. S1 history: explanation of a cause. Pupils move down the tiers across lessons.
      form: |
        Self-check checklist attached to the task; removed once pupils show they can self-check.
      lesson_plan: |
        Mark scaffold fading points on the unit plan (for example, frame in lesson 1, starters in lesson 3, independent in lesson 5).
      interaction: |
        Teacher verbal prompts move from specific ("Use your 'because' starter") to general ("What do you need to add?") to none.
    claims: [clm-EVD-sc-01, clm-EVD-sc-02, clm-EVD-sc-03, clm-EVD-sc-04]

  # =====================================================================
  - id: prn-EVD-guided-inquiry
    type: principle
    title: "Guided inquiry with deep questions"
    summary: "After key knowledge is taught, have pupils investigate questions with substantial guidance (scaffolds, worked examples, feedback, prompts to explain), rather than unassisted discovery."
    body: |
      **What it is.** Pupils pursue an enquiry question (for example, a historical question answered from sources) with structured support: modelled procedures, scaffolded tasks, prompts to explain their reasoning and timely feedback.

      **How to do it.**
      - Teach the background knowledge first; deep questions need it.
      - Pose and model deep questions (why, how, what if, what is the evidence?).
      - Scaffold the enquiry: provide selected sources, a process, worked example of an analysis.
      - Require pupils to explain their reasoning and give feedback.
      - Fade guidance as pupils gain expertise.

      The contested alternative, minimally guided discovery, is described in prn-EVD-minimally-guided-discovery-pbl.
    status: draft
    version: "0.1"
    curated_by: [agent-EVD]
    facets:
      jurisdiction: [scotland]
      cfe_level: [second, third]
      stage: [p7, s1]
      curriculum_area: [all]
      subject: [english, history]
      lesson_purpose: [apply_transfer, guided_practice]
      knowledge_type: [disciplinary, conceptual]
      expertise: [developing, secure]
      artefact_type: [slides, worksheet, lesson_plan, interaction]
    evidence:
      rating: moderate
      rationale: "Enhanced (guided) discovery outperformed other instruction in a 164-study meta-analysis (d = 0.30) and WWC rates deep questioning strong; history-specific trial evidence was not located; see clm-EVD-gi-01."
    prerequisites: ["Core knowledge of the topic has been taught", "Pupils have practised the analysis procedure with a model"]
    risks: ["Without scaffolds, inquiry drifts into unassisted discovery, which underperforms."]
    relations:
      aligns_to: [cur-CUR-soc-3-01a]
      conflicts_with: [prn-EVD-minimally-guided-discovery-pbl]
    artefact_recipes:
      slides: |
        Enquiry question slide, then a modelled analysis of one source before pupils work. S1 history: "Why did the Scots win at Bannockburn?" with a teacher-modelled reading of one source. P7 English: "How does the author build tension in chapter 5?" with a modelled analysis of the first paragraph.
      worksheet: |
        Enquiry booklet with selected sources, guiding questions per source and a final claim-evidence-reasoning frame. S1 history: three short sources on Mary Queen of Scots. P7 English: three extracts showing a character changing.
      lesson_plan: |
        Lesson 1 knowledge and model; lesson 2 guided enquiry in pairs with teacher feedback; lesson 3 pupils write a reasoned answer.
      interaction: |
        Teacher poses deep questions ("What is your evidence? What if this source is biased?") and asks pupils to explain aloud.
    claims: [clm-EVD-gi-01, clm-EVD-gi-02, clm-EVD-gi-03, clm-EVD-gi-04]

  # =====================================================================
  - id: prn-EVD-learning-styles
    type: principle
    title: "Matching teaching to 'learning styles' (not recommended)"
    summary: "Labelling pupils as visual, auditory or kinaesthetic learners and matching teaching to the label is not supported by evidence and may do harm."
    body: |
      **What it is.** The idea that pupils learn better when teaching matches a preferred style (often visual, auditory, kinaesthetic).

      **Why it is not recommended.** No studies met the EEF's inclusion criteria and a major review found almost no evidence for the matching hypothesis. Labelling can lower expectations and restricting activities to a label may slow progress.

      **Do instead.** Find out what pupils already know and what barriers they face; use responsive teaching and feedback; use dual coding for everyone; teach metacognition.
    status: draft
    version: "0.1"
    curated_by: [agent-EVD]
    facets:
      jurisdiction: [scotland]
      cfe_level: [second, third]
      stage: [p7, s1]
      curriculum_area: [all]
      subject: [english, history]
      artefact_type: [slides, worksheet, form, lesson_plan, interaction]
    evidence:
      rating: not_recommended
      rationale: "EEF finds insufficient evidence and notes risks; Pashler et al. found no adequate evidence base; see clm-EVD-ls-01 and clm-EVD-ls-02."
    prerequisites: []
    risks:
      - "Lower expectations from labelling, particularly for disadvantaged pupils."
      - "Time spent producing style-matched materials displaces effective practice."
    relations:
      conflicts_with: [prn-EVD-dual-coding, prn-EVD-formative-assessment]
    artefact_recipes:
      slides: |
        Do not produce separate "visual", "auditory" and "kinaesthetic" versions. Use one well-designed slide that combines a relevant visual with spoken explanation for all pupils (see prn-EVD-dual-coding).
      worksheet: |
        Do not assign worksheets by learning style. Differentiate by prior knowledge and barrier instead (for example, a P7 English pupil with decoding difficulty gets a read-aloud option; an S1 history pupil with gaps in chronology gets a timeline scaffold).
      form: |
        Do not use learning-style questionnaires. Use a short prior-knowledge check instead.
      lesson_plan: |
        Replace "VAK" planning columns with planned checks for understanding and planned scaffolds.
      interaction: |
        Avoid telling pupils "you are a visual learner"; talk instead about strategies that help with this task.
    claims: [clm-EVD-ls-01, clm-EVD-ls-02, clm-EVD-ls-03, clm-EVD-ls-04]

  # =====================================================================
  - id: prn-EVD-minimally-guided-discovery-pbl
    type: principle
    title: "Minimally guided discovery and unstructured project-based learning (contested)"
    summary: "Approaches where pupils discover key content for themselves with little guidance, including loosely structured project-based learning, are contested; evidence favours guided versions for novices."
    body: |
      **The debate.** Kirschner, Sweller and Clark (2006) argue that minimal guidance is less effective and efficient for novices because of working memory limits. Hmelo-Silver, Duncan and Chinn (2007) reply that well-designed problem-based and inquiry learning is heavily scaffolded and should not be grouped with unguided discovery.

      **Meta-analytic evidence.** Alfieri et al. (2011) found unassisted discovery underperformed explicit instruction, while enhanced discovery with guidance outperformed other methods.

      **Trial evidence.** The EEF trial of Learning through REAL Projects in Year 7 found no clear literacy benefit (effect size -0.13, about -2 months) and a possible negative effect for disadvantaged pupils, though the security rating was low because of high attrition. Schools valued the approach for oracy and teamwork.

      **Practical position.** If using projects at P7 or S1, teach core knowledge explicitly first and build in scaffolds, worked examples, checkpoints and feedback (see prn-EVD-guided-inquiry).
    status: draft
    version: "0.1"
    curated_by: [agent-EVD]
    facets:
      jurisdiction: [scotland]
      cfe_level: [second, third]
      stage: [p7, s1]
      curriculum_area: [all]
      subject: [english, history]
      lesson_purpose: [apply_transfer]
      expertise: [novice, developing]
      artefact_type: [lesson_plan, interaction]
    evidence:
      rating: contested
      rationale: "Researchers disagree on whether PBL and inquiry are minimally guided; meta-analysis favours guided over unassisted discovery and the EEF REAL Projects trial found no literacy benefit, but with low security; see clm-EVD-mg-01 to clm-EVD-mg-05."
    prerequisites: []
    risks:
      - "Novices may spend effort on search rather than learning key content."
      - "Possible widening of gaps for disadvantaged pupils (low-security finding)."
      - "Substantial organisational change and coaching were needed in the REAL Projects trial."
    relations:
      conflicts_with: [prn-EVD-explicit-instruction, prn-EVD-guided-inquiry]
    artefact_recipes:
      lesson_plan: |
        Do not launch a project with "find out about..." and no teaching. Instead: P7 English, a class newspaper project where the features of a report are taught and modelled first, with checkpoints and feedback on drafts. S1 history, a "Scottish Wars of Independence museum exhibit" project where chronology and key figures are taught first, sources are pre-selected and each exhibit label follows a modelled claim-evidence frame.
      interaction: |
        Build scheduled teacher checkpoints into project time, with retrieval questions to confirm core knowledge before pupils move on.
    claims: [clm-EVD-mg-01, clm-EVD-mg-02, clm-EVD-mg-03, clm-EVD-mg-04, clm-EVD-mg-05, clm-EVD-mg-06]

claims:
  # ---- explicit instruction ----
  - id: clm-EVD-ei-01
    entry_id: prn-EVD-explicit-instruction
    text: "Rosenshine's principles draw on cognitive science, studies of the most effective teachers and research on cognitive supports."
    supported_by: [psg-EVD-ros-sources]
    support_type: paraphrase
  - id: clm-EVD-ei-02
    entry_id: prn-EVD-explicit-instruction
    text: "Because working memory is limited, new material should be presented in small steps with practice after each step."
    supported_by: [psg-EVD-ros-smallsteps, psg-EVD-ksc-wm]
    support_type: paraphrase
  - id: clm-EVD-ei-03
    entry_id: prn-EVD-explicit-instruction
    text: "Effective teachers ask many questions, check the responses of all pupils and aim for a high success rate of around 80 percent during instruction."
    supported_by: [psg-EVD-ros-questions, psg-EVD-ros-success]
    support_type: paraphrase
  - id: clm-EVD-ei-04
    entry_id: prn-EVD-explicit-instruction
    text: "For novices, explicit instruction is more effective than partial guidance, and a meta-analysis found unassisted discovery underperformed explicit instruction."
    supported_by: [psg-EVD-cks-quote, psg-EVD-alfieri-effects, psg-EVD-ksc-abstract]
    support_type: direct_quote
  - id: clm-EVD-ei-05
    entry_id: prn-EVD-explicit-instruction
    text: "Explicit instruction includes small sequenced steps, examples with non-examples, precise language and planning for misconceptions, with guided stages before independent work."
    supported_by: [psg-EVD-eef-ei-components, psg-EVD-eef-ei-stages, psg-EVD-ros-guided-indep]
    support_type: paraphrase
  - id: clm-EVD-ei-06
    entry_id: prn-EVD-explicit-instruction
    text: "Scottish teachers are expected by the GTCS standards to draw on pedagogical theory and apply findings from educational research."
    supported_by: [psg-EVD-gtcs-research, psg-EVD-gtcs-pedagogy]
    support_type: direct_quote

  # ---- retrieval ----
  - id: clm-EVD-rp-01
    entry_id: prn-EVD-retrieval-practice
    text: "The WWC practice guide rates closed-book quizzing to re-expose pupils to content as strong evidence, based on K-12, college and laboratory experiments."
    supported_by: [psg-EVD-wwc-rec5b]
    support_type: paraphrase
  - id: clm-EVD-rp-02
    entry_id: prn-EVD-retrieval-practice
    text: "A meta-analysis found practice tests benefit learning more than restudying and other comparison conditions."
    supported_by: [psg-EVD-adesope-quote]
    support_type: direct_quote
  - id: clm-EVD-rp-03
    entry_id: prn-EVD-retrieval-practice
    text: "Quizzes should be followed by correct-answer feedback, otherwise errors can persist."
    supported_by: [psg-EVD-wwc-rec5b]
    support_type: paraphrase
  - id: clm-EVD-rp-04
    entry_id: prn-EVD-retrieval-practice
    text: "Beginning lessons with a short review of previous learning is one of Rosenshine's principles of instruction."
    supported_by: [psg-EVD-ros-review-quote]
    support_type: direct_quote

  # ---- spacing ----
  - id: clm-EVD-sp-01
    entry_id: prn-EVD-spaced-practice
    text: "Spacing out retrieval practice produced a large benefit over massed retrieval in a meta-analysis of 29 studies (g = 0.74)."
    supported_by: [psg-EVD-latimier-abstract]
    support_type: paraphrase
  - id: clm-EVD-sp-02
    entry_id: prn-EVD-spaced-practice
    text: "The WWC guide recommends re-exposing pupils to key content after gaps of weeks to months and rates this evidence moderate."
    supported_by: [psg-EVD-wwc-rec1]
    support_type: paraphrase
  - id: clm-EVD-sp-03
    entry_id: prn-EVD-spaced-practice
    text: "In one classroom study, history pupils who reviewed after 16 weeks remembered nearly twice as much nine months later as those who reviewed after one week."
    supported_by: [psg-EVD-wwc-rec1-history]
    support_type: paraphrase
  - id: clm-EVD-sp-04
    entry_id: prn-EVD-spaced-practice
    text: "Gaps between retrieval sessions do not need to keep lengthening; expanding and uniform schedules performed similarly."
    supported_by: [psg-EVD-latimier-abstract, psg-EVD-latimier-conclusion]
    support_type: paraphrase

  # ---- worked examples ----
  - id: clm-EVD-we-01
    entry_id: prn-EVD-worked-examples
    text: "Alternating worked examples with problems pupils solve, and fading worked steps as expertise grows, is a WWC recommendation rated moderate evidence."
    supported_by: [psg-EVD-wwc-rec2]
    support_type: paraphrase
  - id: clm-EVD-we-02
    entry_id: prn-EVD-worked-examples
    text: "Novices who study worked examples tend to outperform those who solve equivalent problems because studying examples reduces load on working memory."
    supported_by: [psg-EVD-cks-worked, psg-EVD-ksc-worked]
    support_type: paraphrase
  - id: clm-EVD-we-03
    entry_id: prn-EVD-worked-examples
    text: "The worked-example advantage disappears or reverses for more expert learners, so guidance should be faded."
    supported_by: [psg-EVD-cks-reversal, psg-EVD-ksc-worked]
    support_type: paraphrase
  - id: clm-EVD-we-04
    entry_id: prn-EVD-worked-examples
    text: "Model answers and annotated source analyses in English and history are treated here as worked examples by analogy, since most worked-example research comes from mathematics and science."
    supported_by: [psg-EVD-wwc-rec2, psg-EVD-gr-meta-challenge]
    support_type: inference_by_curator

  # ---- metacognition ----
  - id: clm-EVD-mc-01
    entry_id: prn-EVD-metacognition
    text: "The EEF Toolkit reports metacognition and self-regulation approaches add about eight months' progress on average, from 355 studies, with high evidence strength."
    supported_by: [psg-EVD-tlt-meta-figures, psg-EVD-tlt-meta-headline]
    support_type: paraphrase
  - id: clm-EVD-mc-02
    entry_id: prn-EVD-metacognition
    text: "Metacognitive strategies work best when taught within normal subject content rather than in separate thinking-skills lessons."
    supported_by: [psg-EVD-tlt-meta-curriculum, psg-EVD-inverclyde-meta]
    support_type: paraphrase
  - id: clm-EVD-mc-03
    entry_id: prn-EVD-metacognition
    text: "The EEF recommends a seven-step gradual release model ending in structured reflection for teaching metacognitive strategies."
    supported_by: [psg-EVD-gr-meta-sevenstep, psg-EVD-gr-meta-recs]
    support_type: paraphrase
  - id: clm-EVD-mc-04
    entry_id: prn-EVD-metacognition
    text: "Teacher modelling of their own thinking is central to developing pupils' metacognition."
    supported_by: [psg-EVD-gr-meta-modelling]
    support_type: direct_quote
  - id: clm-EVD-mc-05
    entry_id: prn-EVD-metacognition
    text: "Effects of metacognition approaches are similar and high in primary and secondary settings."
    supported_by: [psg-EVD-tlt-meta-age]
    support_type: paraphrase
  - id: clm-EVD-mc-06
    entry_id: prn-EVD-metacognition
    text: "The high average impact is hard to achieve without professional learning that builds teachers' understanding."
    supported_by: [psg-EVD-tlt-meta-hard]
    support_type: paraphrase

  # ---- feedback ----
  - id: clm-EVD-fb-01
    entry_id: prn-EVD-feedback
    text: "The EEF Toolkit reports feedback adds about six months' progress on average, from 155 studies, with high evidence strength."
    supported_by: [psg-EVD-tlt-fb-figures]
    support_type: paraphrase
  - id: clm-EVD-fb-02
    entry_id: prn-EVD-feedback
    text: "Effective feedback focuses on the task, subject or self-regulation and gives specific guidance on how to improve."
    supported_by: [psg-EVD-tlt-fb-focus, psg-EVD-gr-fb-recs]
    support_type: paraphrase
  - id: clm-EVD-fb-03
    entry_id: prn-EVD-feedback
    text: "Primary pupils show slightly larger gains from feedback than secondary pupils, and verbal feedback shows slightly higher impact than written."
    supported_by: [psg-EVD-tlt-fb-phase]
    support_type: paraphrase
  - id: clm-EVD-fb-04
    entry_id: prn-EVD-feedback
    text: "Schools should prioritise the principles of feedback over particular methods, and plan for pupils to receive and act on it."
    supported_by: [psg-EVD-gr-fb-principles, psg-EVD-gr-fb-recs, psg-EVD-gr-fb-written]
    support_type: paraphrase
  - id: clm-EVD-fb-05
    entry_id: prn-EVD-feedback
    text: "The GTCS Standard for Full Registration expects teachers to give meaningful feedback that agrees next steps with learners."
    supported_by: [psg-EVD-gtcs-assessment]
    support_type: paraphrase

  # ---- formative assessment ----
  - id: clm-EVD-fa-01
    entry_id: prn-EVD-formative-assessment
    text: "Assessment is formative when the evidence gathered is used to adapt teaching to pupils' needs."
    supported_by: [psg-EVD-bw-definition]
    support_type: direct_quote
  - id: clm-EVD-fa-02
    entry_id: prn-EVD-formative-assessment
    text: "Black and Wiliam reported typical effect sizes of 0.4 to 0.7 for formative assessment, with low achievers benefiting most."
    supported_by: [psg-EVD-bw-effects]
    support_type: paraphrase
  - id: clm-EVD-fa-03
    entry_id: prn-EVD-formative-assessment
    text: "Formative practices include wait time, responses from all pupils, self-assessment and comment-only feedback."
    supported_by: [psg-EVD-bw-practices, psg-EVD-ros-questions]
    support_type: paraphrase
  - id: clm-EVD-fa-04
    entry_id: prn-EVD-formative-assessment
    text: "Effective feedback depends on high-quality initial teaching and formative assessment, and GTCS standards treat assessment as integral to learning and teaching."
    supported_by: [psg-EVD-gr-fb-recs, psg-EVD-gtcs-assessment]
    support_type: paraphrase

  # ---- reading comprehension ----
  - id: clm-EVD-rc-01
    entry_id: prn-EVD-reading-comprehension-strategies
    text: "The EEF Toolkit reports reading comprehension strategies add about seven months' progress, from 184 studies, with moderate evidence security."
    supported_by: [psg-EVD-tlt-rc-figures, psg-EVD-tlt-rc-headline]
    support_type: paraphrase
  - id: clm-EVD-rc-02
    entry_id: prn-EVD-reading-comprehension-strategies
    text: "The EEF KS2 literacy guidance recommends teaching prediction, questioning, clarifying, summarising and activating prior knowledge through modelling and supported practice with gradual release."
    supported_by: [psg-EVD-gr-ks2-rec3, psg-EVD-gr-ks2-strategies, psg-EVD-tlt-rc-teaching]
    support_type: direct_quote
  - id: clm-EVD-rc-03
    entry_id: prn-EVD-reading-comprehension-strategies
    text: "Texts for strategy teaching should be challenging enough to need the strategy but not so hard that pupils cannot understand them."
    supported_by: [psg-EVD-gr-ks2-texts, psg-EVD-tlt-rc-teaching]
    support_type: paraphrase
  - id: clm-EVD-rc-04
    entry_id: prn-EVD-reading-comprehension-strategies
    text: "In an EEF trial, targeted small-group Reciprocal Reading had a positive impact while the whole-class version did not outperform usual teaching."
    supported_by: [psg-EVD-gr-ks2-reciprocal]
    support_type: paraphrase
  - id: clm-EVD-rc-05
    entry_id: prn-EVD-reading-comprehension-strategies
    text: "For struggling readers, check whether the barrier is decoding, sentence structure or vocabulary before focusing on comprehension strategies."
    supported_by: [psg-EVD-tlt-rc-diagnosis]
    support_type: paraphrase

  # ---- oral language ----
  - id: clm-EVD-ol-01
    entry_id: prn-EVD-oral-language-dialogic
    text: "The EEF Toolkit reports oral language approaches add about six months' progress, from 188 studies, with high evidence strength."
    supported_by: [psg-EVD-tlt-oral-figures]
    support_type: paraphrase
  - id: clm-EVD-ol-02
    entry_id: prn-EVD-oral-language-dialogic
    text: "Dialogic teaching uses talk, questioning and thinking aloud to build understanding and metacognition."
    supported_by: [psg-EVD-tlt-oral-dialogic, psg-EVD-gr-meta-talk]
    support_type: paraphrase
  - id: clm-EVD-ol-03
    entry_id: prn-EVD-oral-language-dialogic
    text: "Teachers can build dialogue with open questions, probing follow-ups, building on answers and giving every pupil a chance to talk."
    supported_by: [psg-EVD-gr-ks2-talk]
    support_type: paraphrase
  - id: clm-EVD-ol-04
    entry_id: prn-EVD-oral-language-dialogic
    text: "Vocabulary teaching works best when linked to current content and when pupils actively use new words across speaking, reading and writing."
    supported_by: [psg-EVD-tlt-oral-curriculum, psg-EVD-gr-ks2-vocab]
    support_type: paraphrase
  - id: clm-EVD-ol-05
    entry_id: prn-EVD-oral-language-dialogic
    text: "Education Scotland guidance treats listening and talking as central to learning in all subjects, including group discussion for analysing texts and debating viewpoints."
    supported_by: [psg-EVD-edscot-lal-talk]
    support_type: paraphrase

  # ---- collaborative ----
  - id: clm-EVD-cl-01
    entry_id: prn-EVD-collaborative-learning
    text: "The EEF Toolkit reports collaborative learning adds about five months' progress on average, but rates the evidence security low."
    supported_by: [psg-EVD-tlt-collab-figures]
    support_type: paraphrase
  - id: clm-EVD-cl-02
    entry_id: prn-EVD-collaborative-learning
    text: "Structured tasks in groups of three to five with a shared outcome are more promising than simply seating pupils together."
    supported_by: [psg-EVD-tlt-collab-structure, psg-EVD-gr-ks2-talk]
    support_type: paraphrase
  - id: clm-EVD-cl-03
    entry_id: prn-EVD-collaborative-learning
    text: "Reported gains are slightly larger in secondary than primary and smaller in literacy than in science."
    supported_by: [psg-EVD-tlt-collab-phase]
    support_type: paraphrase
  - id: clm-EVD-cl-04
    entry_id: prn-EVD-collaborative-learning
    text: "Group work in which a few high attainers do the thinking risks widening attainment gaps."
    supported_by: [psg-EVD-tlt-collab-gap]
    support_type: paraphrase

  # ---- dual coding ----
  - id: clm-EVD-dc-01
    entry_id: prn-EVD-dual-coding
    text: "Combining graphics with verbal descriptions is a WWC recommendation rated moderate evidence."
    supported_by: [psg-EVD-wwc-rec3, psg-EVD-wwc-overview]
    support_type: paraphrase
  - id: clm-EVD-dc-02
    entry_id: prn-EVD-dual-coding
    text: "Labels should sit next to the relevant part of a visual, and decorative or overly realistic images should be avoided."
    supported_by: [psg-EVD-wwc-rec3]
    support_type: paraphrase
  - id: clm-EVD-dc-03
    entry_id: prn-EVD-dual-coding
    text: "Graphic organisers are among the cognitive strategies EEF highlights for supporting pupils with SEND in mainstream classes."
    supported_by: [psg-EVD-fiveaday-cognitive]
    support_type: paraphrase

  # ---- scaffolding ----
  - id: clm-EVD-sc-01
    entry_id: prn-EVD-scaffolding
    text: "Scaffolds such as prompts, checklists, models and think-alouds are temporary supports that are withdrawn as pupils become competent."
    supported_by: [psg-EVD-ros-scaffolds, psg-EVD-gr-meta-challenge]
    support_type: paraphrase
  - id: clm-EVD-sc-02
    entry_id: prn-EVD-scaffolding
    text: "A scaffold is a planned support, such as a visual, template or prompt, for pupils likely to find the learning hard, and is part of good teaching for all."
    supported_by: [psg-EVD-fiveaday-scaffold, psg-EVD-fiveaday-quote]
    support_type: direct_quote
  - id: clm-EVD-sc-03
    entry_id: prn-EVD-scaffolding
    text: "Discovery tasks that included scaffolding, worked examples, feedback or elicited explanations outperformed other forms of instruction in a meta-analysis."
    supported_by: [psg-EVD-alfieri-effects, psg-EVD-alfieri-advice]
    support_type: paraphrase
  - id: clm-EVD-sc-04
    entry_id: prn-EVD-scaffolding
    text: "Pupils should move through guided stages before independent practice rather than being released too early."
    supported_by: [psg-EVD-eef-ei-stages, psg-EVD-ros-guided-indep]
    support_type: paraphrase

  # ---- guided inquiry ----
  - id: clm-EVD-gi-01
    entry_id: prn-EVD-guided-inquiry
    text: "Enhanced discovery, with guidance, feedback, worked examples or prompts to explain, outperformed other instruction (d = 0.30) in a meta-analysis of 164 studies."
    supported_by: [psg-EVD-alfieri-effects]
    support_type: paraphrase
  - id: clm-EVD-gi-02
    entry_id: prn-EVD-guided-inquiry
    text: "Posing and modelling deep why, how and what-is-the-evidence questions once pupils have basic knowledge is rated strong evidence by the WWC."
    supported_by: [psg-EVD-wwc-rec7]
    support_type: paraphrase
  - id: clm-EVD-gi-03
    entry_id: prn-EVD-guided-inquiry
    text: "Well-designed problem-based and inquiry learning is heavily scaffolded, according to Hmelo-Silver and colleagues."
    supported_by: [psg-EVD-hmelo-abstract]
    support_type: paraphrase
  - id: clm-EVD-gi-04
    entry_id: prn-EVD-guided-inquiry
    text: "Unassisted discovery does not benefit learners, so inquiry tasks need built-in guidance."
    supported_by: [psg-EVD-alfieri-quote, psg-EVD-alfieri-advice]
    support_type: direct_quote

  # ---- learning styles ----
  - id: clm-EVD-ls-01
    entry_id: prn-EVD-learning-styles
    text: "The EEF judges learning styles to have unclear impact based on insufficient evidence, with no studies meeting its inclusion criteria."
    supported_by: [psg-EVD-tlt-ls-headline, psg-EVD-tlt-ls-evidence]
    support_type: direct_quote
  - id: clm-EVD-ls-02
    entry_id: prn-EVD-learning-styles
    text: "A major review found almost no evidence that matching teaching to learning styles improves learning, and no adequate basis for learning-styles assessment in schools."
    supported_by: [psg-EVD-pashler-ls]
    support_type: paraphrase
  - id: clm-EVD-ls-03
    entry_id: prn-EVD-learning-styles
    text: "Labelling pupils by learning style can lower expectations, and restricting them to matched activities may slow progress."
    supported_by: [psg-EVD-tlt-ls-risks]
    support_type: paraphrase
  - id: clm-EVD-ls-04
    entry_id: prn-EVD-learning-styles
    text: "Better alternatives are addressing prior knowledge and barriers, responsive teaching and feedback, and teaching pupils to plan, monitor and evaluate."
    supported_by: [psg-EVD-tlt-ls-alternatives]
    support_type: paraphrase

  # ---- minimally guided / PBL ----
  - id: clm-EVD-mg-01
    entry_id: prn-EVD-minimally-guided-discovery-pbl
    text: "Kirschner, Sweller and Clark argue minimally guided instruction is less effective and efficient than strong guidance for novices, because of working memory limits."
    supported_by: [psg-EVD-ksc-abstract, psg-EVD-ksc-wm]
    support_type: paraphrase
  - id: clm-EVD-mg-02
    entry_id: prn-EVD-minimally-guided-discovery-pbl
    text: "Hmelo-Silver, Duncan and Chinn counter that problem-based and inquiry learning are heavily scaffolded and should not be equated with unguided discovery."
    supported_by: [psg-EVD-hmelo-abstract]
    support_type: paraphrase
  - id: clm-EVD-mg-03
    entry_id: prn-EVD-minimally-guided-discovery-pbl
    text: "A meta-analysis found unassisted discovery underperformed explicit instruction, while guided forms of discovery performed better than other methods."
    supported_by: [psg-EVD-alfieri-effects, psg-EVD-alfieri-quote]
    support_type: paraphrase
  - id: clm-EVD-mg-04
    entry_id: prn-EVD-minimally-guided-discovery-pbl
    text: "The EEF trial of Learning through REAL Projects in Year 7 found a literacy effect of -0.13 (about -2 months) overall and -0.24 for pupils eligible for free school meals."
    supported_by: [psg-EVD-real-results, psg-EVD-real-design]
    support_type: paraphrase
  - id: clm-EVD-mg-05
    entry_id: prn-EVD-minimally-guided-discovery-pbl
    text: "The REAL Projects findings have low security because of school dropout, missing outcome data and control schools adopting similar approaches."
    supported_by: [psg-EVD-real-security]
    support_type: paraphrase
  - id: clm-EVD-mg-06
    entry_id: prn-EVD-minimally-guided-discovery-pbl
    text: "Schools in the REAL Projects trial valued project-based learning for oracy, teamwork and self-directed study, but it required substantial organisational change."
    supported_by: [psg-EVD-real-conclusions]
    support_type: paraphrase

  # ---- additional claims ----
  - id: clm-EVD-ei-07
    entry_id: prn-EVD-explicit-instruction
    text: "Less-skilled learners tend to learn more from more-guided instruction and can lose ground when guidance is reduced."
    supported_by: [psg-EVD-cks-lessskilled]
    support_type: paraphrase
  - id: clm-EVD-we-05
    entry_id: prn-EVD-worked-examples
    text: "Providing models, thinking aloud and fully worked examples is one of Rosenshine's principles of instruction."
    supported_by: [psg-EVD-ros-models]
    support_type: paraphrase
  - id: clm-EVD-sp-05
    entry_id: prn-EVD-spaced-practice
    text: "Rosenshine recommends weekly and monthly review because repeated review builds well-connected knowledge in long-term memory."
    supported_by: [psg-EVD-ros-weekly]
    support_type: paraphrase
  - id: clm-EVD-rp-05
    entry_id: prn-EVD-retrieval-practice
    text: "The size of the practice-testing benefit varies with test features, learner characteristics and study design."
    supported_by: [psg-EVD-adesope-moderators]
    support_type: paraphrase
  - id: clm-EVD-mc-07
    entry_id: prn-EVD-metacognition
    text: "Education Scotland presents the EEF Teaching and Learning Toolkit as a companion resource for Pupil Equity Funding planning, alongside local self-evaluation."
    supported_by: [psg-EVD-edscot-ife-eef]
    support_type: paraphrase
  - id: clm-EVD-mc-08
    entry_id: prn-EVD-metacognition
    text: "Teaching pupils to judge their own learning after a delay and to target study accordingly is recommended by the WWC but with low evidence."
    supported_by: [psg-EVD-wwc-rec6]
    support_type: paraphrase
  - id: clm-EVD-ol-06
    entry_id: prn-EVD-oral-language-dialogic
    text: "Oral language approaches appear similarly effective across age groups, though fewer studies come from secondary schools."
    supported_by: [psg-EVD-tlt-oral-age]
    support_type: paraphrase
  - id: clm-EVD-cl-05
    entry_id: prn-EVD-collaborative-learning
    text: "Carefully designed collaborative groups, with reasoning and debate, can also support pupils' metacognition."
    supported_by: [psg-EVD-tlt-meta-collab]
    support_type: paraphrase
