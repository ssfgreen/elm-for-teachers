  - id: psg-ACC-at-comm-time
    source_id: src-ACC-at-communication
    locator: "Communication page"
    text: >-
      Learners may struggle to respond in the expected time or to organise several spoken
      instructions given together; allow time and wait, and reduce language, especially
      when a learner is anxious.
    excerpt_type: paraphrase
    fetched_url: https://www.autismtoolbox.co.uk/understanding-autism/communication/
    verified_by_fetch: true

  - id: psg-ACC-at-comm-groups
    source_id: src-ACC-at-communication
    locator: "Communication page, reasonable adjustments"
    text: >-
      Reasonable adjustments in group work include clear roles and scripts, and visual
      supports can help peer interaction and group work.
    excerpt_type: paraphrase
    fetched_url: https://www.autismtoolbox.co.uk/understanding-autism/communication/
    verified_by_fetch: true

  - id: psg-ACC-at-sensory-env
    source_id: src-ACC-at-sensory
    locator: "Sensory Differences page"
    text: >-
      Reduce visual clutter, soften lighting, manage noise (switch off noisy equipment,
      muffle bells) and allow headphones where noise cannot be reduced; consider which seats
      or areas are easier for the child.
    excerpt_type: paraphrase
    fetched_url: https://www.autismtoolbox.co.uk/understanding-autism/sensory-differences/
    verified_by_fetch: true

  - id: psg-ACC-at-sensory-breaks
    source_id: src-ACC-at-sensory
    locator: "Sensory Differences page, practical adjustments"
    text: >-
      Agree a safe space to step away and regulate, schedule regular movement breaks even
      when the child seems calm, and provide a visible timetable kept to as far as
      possible.
    excerpt_type: paraphrase
    fetched_url: https://www.autismtoolbox.co.uk/understanding-autism/sensory-differences/
    verified_by_fetch: true

  - id: psg-ACC-at-incl-universal
    source_id: src-ACC-at-inclusive-classrooms
    locator: "Inclusive Classrooms page"
    text: >-
      Inclusive classrooms benefit all learners; clear labels and visual supports help
      learners with language and communication difficulties and those learning English as
      an additional language; adjustments should be anticipatory and the learning day
      predictable.
    excerpt_type: paraphrase
    fetched_url: https://www.autismtoolbox.co.uk/scottish-context/inclusive-education/inclusive-classrooms/
    verified_by_fetch: true

  - id: psg-ACC-at-universal-quote
    source_id: src-ACC-at-universal
    locator: "Universal page, staged intervention introduction"
    text: "at the earliest opportunity and with the least intrusive level of intervention"
    excerpt_type: quote
    fetched_url: https://www.autismtoolbox.co.uk/supporting-learners-and-families/educational-support/universal/
    verified_by_fetch: true

  - id: psg-ACC-at-universal-supports
    source_id: src-ACC-at-universal
    locator: "Universal page"
    text: >-
      Most needs are met at the universal level, where the class teacher has first
      responsibility; universal supports include visual timetables and supports, quiet
      spaces and digital resources; councils vary in their number of stages.
    excerpt_type: paraphrase
    fetched_url: https://www.autismtoolbox.co.uk/supporting-learners-and-families/educational-support/universal/
    verified_by_fetch: true

  # --- NAS ---
  - id: psg-ACC-nas-figurative
    source_id: src-ACC-nas-communication-2022
    locator: "Section 'Avoid confusing language'"
    text: >-
      Figurative phrases and vague time or size words can be misread; give realistic
      timings and keep to them.
    excerpt_type: paraphrase
    fetched_url: https://www.autism.org.uk/advice-and-guidance/professional-practice/communication-pupils
    verified_by_fetch: true

  - id: psg-ACC-nas-name-first
    source_id: src-ACC-nas-communication-2022
    locator: "Section 'Make it personal'"
    text: >-
      Say the pupil's name first so they know they are being addressed; in groups an
      individual prompt may be needed.
    excerpt_type: paraphrase
    fetched_url: https://www.autism.org.uk/advice-and-guidance/professional-practice/communication-pupils
    verified_by_fetch: true

  - id: psg-ACC-nas-processing
    source_id: src-ACC-nas-communication-2022
    locator: "Section 'Allow processing time'"
    text: >-
      Pause for at least ten seconds without adding words; if repeating, use the same
      words, ideally with visual support.
    excerpt_type: paraphrase
    fetched_url: https://www.autism.org.uk/advice-and-guidance/professional-practice/communication-pupils
    verified_by_fetch: true

  - id: psg-ACC-nas-visual
    source_id: src-ACC-nas-communication-2022
    locator: "Section 'Make it visual'"
    text: >-
      Many autistic pupils process visual information more easily than speech, so use
      objects, pictures, symbols, written words or apps.
    excerpt_type: paraphrase
    fetched_url: https://www.autism.org.uk/advice-and-guidance/professional-practice/communication-pupils
    verified_by_fetch: true

  - id: psg-ACC-nas-chunk
    source_id: src-ACC-nas-communication-2022
    locator: "Sections 'Slow down' and 'Short and manageable questions and instructions'"
    text: >-
      Slow down, keep to the key message, give one piece of information at a time in small
      chunks, and check understanding before moving on.
    excerpt_type: paraphrase
    fetched_url: https://www.autism.org.uk/advice-and-guidance/professional-practice/communication-pupils
    verified_by_fetch: true

  - id: psg-ACC-nas-questions
    source_id: src-ACC-nas-communication-2022
    locator: "Section 'Short and manageable questions and instructions'"
    text: >-
      Keep questions clear and direct, limit how many are asked, avoid very open questions
      and offer limited choices where possible.
    excerpt_type: paraphrase
    fetched_url: https://www.autism.org.uk/advice-and-guidance/professional-practice/communication-pupils
    verified_by_fetch: true

  - id: psg-ACC-nas-positive-alt
    source_id: src-ACC-nas-communication-2022
    locator: "Sections on positive instructions and validating different ways of communicating"
    text: >-
      Say what to do rather than what not to do, and accept writing or pictures as
      alternatives to speech.
    excerpt_type: paraphrase
    fetched_url: https://www.autism.org.uk/advice-and-guidance/professional-practice/communication-pupils
    verified_by_fetch: true

  # --- CALL Scotland ---
  - id: psg-ACC-call-resources
    source_id: src-ACC-callscotland-home
    locator: "Home page, resource links"
    text: >-
      CALL Scotland (University of Edinburgh) offers Books for All (accessible curriculum
      books), Symbols for All (symbolised curriculum resources), WordTalk (free text-to-
      speech for Word), MyStudyBar (literacy support tools), Adapted Digital Exams and an
      assistive technology loan bank.
    excerpt_type: paraphrase
    fetched_url: https://www.callscotland.org.uk/
    verified_by_fetch: true

  - id: psg-ACC-scotvoice
    source_id: src-ACC-scottish-voice
    locator: "Home page"
    text: >-
      The Scottish Voice provides Scottish-accented computer voices (adult, teenage and
      child English voices and a Gaelic voice), funded by the Scottish Government and free
      to the Scottish public sector, for listening to resources such as e-books.
    excerpt_type: paraphrase
    fetched_url: https://www.thescottishvoice.org.uk/home/
    verified_by_fetch: true

  # --- EAL ---
  - id: psg-ACC-abd-visuals-vocab
    source_id: src-ACC-aberdeenshire-eal-primary
    locator: "Strategies (Primary) page, vocabulary and visuals"
    text: >-
      Pre-teach key words with visuals and extra small-group practice, teach words in
      context, and keep visual dictionaries and word banks at hand during writing.
    excerpt_type: paraphrase
    fetched_url: https://blogs.glowscotland.org.uk/as/ealaberdeenshire/strategies-primary/
    verified_by_fetch: true

  - id: psg-ACC-abd-l1
    source_id: src-ACC-aberdeenshire-eal-primary
    locator: "Strategies (Primary) page, home language"
    text: >-
      Use dual-language books and audio books, learn a few words of the pupil's language,
      and let pupils build their own illustrated topic glossaries.
    excerpt_type: paraphrase
    fetched_url: https://blogs.glowscotland.org.uk/as/ealaberdeenshire/strategies-primary/
    verified_by_fetch: true

  - id: psg-ACC-abd-frames
    source_id: src-ACC-aberdeenshire-eal-primary
    locator: "Strategies (Primary) page, writing and talk"
    text: >-
      Model tasks before pupils try them, provide sentence starters and sentence-building
      scaffolds, and use paired talk such as think-pair-share and supportive buddies.
    excerpt_type: paraphrase
    fetched_url: https://blogs.glowscotland.org.uk/as/ealaberdeenshire/strategies-primary/
    verified_by_fetch: true

  - id: psg-ACC-bell-glossary
    source_id: src-ACC-bell-multilingual-support
    locator: "Sections on bilingual glossaries, bilingual dictionaries and pre-teaching"
    text: >-
      Learners can make bilingual glossaries of key topic words and use bilingual
      dictionaries; concepts can be pre-taught in the first language; skills transfer
      across languages, so first-language use supports access to the curriculum and the
      learning of English rather than replacing it.
    excerpt_type: paraphrase
    fetched_url: https://www.bell-foundation.org.uk/eal-programme/guidance/multilingual-support/
    verified_by_fetch: true

  - id: psg-ACC-bell-quote
    source_id: src-ACC-bell-multilingual-support
    locator: "Section on codeswitching and translanguaging"
    text: "extremely useful in the classroom"
    excerpt_type: quote
    fetched_url: https://www.bell-foundation.org.uk/eal-programme/guidance/multilingual-support/
    verified_by_fetch: true

  # --- DLD ---
  - id: psg-ACC-dld-vocab
    source_id: src-ACC-htu-dld
    locator: "Section on vocabulary"
    text: >-
      Pupils with DLD know fewer words and do not pick up new vocabulary incidentally, so
      key subject words should be taught explicitly, for example in a short vocabulary slot
      at the start of lessons.
    excerpt_type: paraphrase
    fetched_url: https://www.headteacher-update.com/content/best-practice/developmental-language-disorder-in-the-mainstream-classroom
    verified_by_fetch: true

  - id: psg-ACC-dld-instructions
    source_id: src-ACC-htu-dld
    locator: "Section on giving instructions"
    text: >-
      Give one instruction at a time in short sentences, pause between chunks, put steps in
      the order they happen, and use literal language because idioms and metaphors are
      often hard for pupils with DLD.
    excerpt_type: paraphrase
    fetched_url: https://www.headteacher-update.com/content/best-practice/developmental-language-disorder-in-the-mainstream-classroom
    verified_by_fetch: true

  - id: psg-ACC-dld-time-check
    source_id: src-ACC-htu-dld
    locator: "Sections on processing time and checking understanding"
    text: >-
      Allow extra time to understand and to formulate answers, recap prior learning, ask
      pupils to repeat instructions back, and model useful phrases and sentence structures.
    excerpt_type: paraphrase
    fetched_url: https://www.headteacher-update.com/content/best-practice/developmental-language-disorder-in-the-mainstream-classroom
    verified_by_fetch: true

  - id: psg-ACC-dld-visual
    source_id: src-ACC-htu-dld
    locator: "Section on visual support"
    text: >-
      Use visual prompts such as pictures on worksheets, visual timetables and real objects
      to signpost activities and support memory.
    excerpt_type: paraphrase
    fetched_url: https://www.headteacher-update.com/content/best-practice/developmental-language-disorder-in-the-mainstream-classroom
    verified_by_fetch: true

entries:

  # =====================================================================
  # A. FORMAT RULES (baseline for every artefact)
  # =====================================================================

  - id: fmt-ACC-emphasis-bold
    type: format_rule
    title: "Emphasise with bold, not italics, underlining or capitals"
    summary: "Use bold for key words and actions; never italics, underlining or blocks of capitals."
    body: |
      - Use **bold** for key vocabulary, command words and the action a pupil must take.
      - Do not use italics or underlining for emphasis; underlining is reserved for links in digital artefacts.
      - Do not write words or sentences in capitals for emphasis.
      - Keep emphasis sparing so the key action still stands out.
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
      jurisdiction: [scotland]
      cfe_level: [early, first, second, third, fourth, senior]
      curriculum_area: [all]
      artefact_type: [slides, worksheet, form, lesson_plan]
      barrier: [decoding, reading_fluency, attention]
      access_dimension: layout
      changes_goal: false
    evidence:
      rating: practitioner_wisdom
      rationale: "BDA and Dyslexia Scotland style guidance (clm-ACC-emph-bold)."
    render_settings:
      emphasis: bold
      italics: false
      underline: false
      all_caps_for_emphasis: false
      max_bold_phrases_per_block: 3
    claims: [clm-ACC-emph-bold, clm-ACC-emph-no-caps, clm-ACC-emph-key-actions]

  - id: fmt-ACC-left-aligned-ragged-right
    type: format_rule
    title: "Left aligned, ragged right, single column, short lines"
    summary: "Align text left without justification, in one column, with lines of about 60 to 70 characters."
    body: |
      - Left align all body text; never justify (uneven word gaps create 'rivers').
      - Use one column; avoid newspaper-style columns on worksheets.
      - Keep lines short (about 60 to 70 characters, never more than 80).
      - Turn off automatic hyphenation.
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
      jurisdiction: [scotland]
      cfe_level: [early, first, second, third, fourth, senior]
      curriculum_area: [all]
      artefact_type: [slides, worksheet, form]
      barrier: [decoding, reading_fluency, visual_tracking]
      access_dimension: layout
      changes_goal: false
    evidence:
      rating: practitioner_wisdom
      rationale: "BDA, Dyslexia Scotland and WCAG 1.4.8 agree (clm-ACC-align-left, clm-ACC-align-wcag)."
    render_settings:
      text_align: left
      justify: false
      hyphenation: false
      columns: 1
      max_line_length_chars: 70
    claims: [clm-ACC-align-left, clm-ACC-align-wcag, clm-ACC-line-length]

  - id: fmt-ACC-readable-font-size
    type: format_rule
    title: "Plain sans serif font at a readable size"
    summary: "Use a plain, evenly spaced sans serif font, at least 12 point in print (14 preferred for pupils)."
    body: |
      - Default font: a plain sans serif such as Arial, Verdana, Calibri, Century Gothic or Tahoma.
      - Body text at least 12 point in print; 14 point is a sensible default for P7 and S1 worksheets.
      - No decorative, handwriting-style or oblique fonts; avoid ligatures.
      - Do not switch a whole class to a specialist "dyslexia font": research shows no reading benefit (see cau-ACC-dyslexia-fonts). An individual pupil may use a preferred font.
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
      jurisdiction: [scotland]
      cfe_level: [early, first, second, third, fourth, senior]
      curriculum_area: [all]
      artefact_type: [slides, worksheet, form]
      barrier: [decoding, reading_fluency, visual_access]
      access_dimension: layout
      changes_goal: false
    evidence:
      rating: practitioner_wisdom
      rationale: "Style guides recommend sans serif; trials find no advantage for specialist fonts (clm-ACC-font-no-special-advantage)."
    relations:
      caution_from: [cau-ACC-dyslexia-fonts]
    render_settings:
      font_family: [Arial, Verdana, Calibri, Century Gothic, Tahoma]
      font_class: sans-serif
      body_size_pt_min: 12
      body_size_pt_default: 14
      body_size_px_screen_min: 16
      decorative_fonts: false
      ligatures: false
      learner_override_allowed: true
    claims: [clm-ACC-font-sans, clm-ACC-font-no-special-advantage, clm-ACC-font-size]

  - id: fmt-ACC-text-spacing
    type: format_rule
    title: "Generous line and paragraph spacing; tolerate user spacing"
    summary: "1.5 line spacing, clear space between paragraphs, and layouts that survive increased letter and word spacing."
    body: |
      - Line spacing 1.5 for all body text.
      - Paragraph spacing about twice the font size; extra space before headings.
      - Build artefacts (text boxes, tables, answer lines) so they do not break if letter spacing is raised to 0.12 em or more and word spacing to 0.16 em or more. Individual pupils may need wider letter spacing (see adp-ACC-individual-spacing-background).
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
      jurisdiction: [scotland]
      cfe_level: [early, first, second, third, fourth, senior]
      curriculum_area: [all]
      artefact_type: [slides, worksheet, form]
      barrier: [decoding, reading_fluency, visual_tracking]
      access_dimension: layout
      changes_goal: false
    evidence:
      rating: moderate
      rationale: "WCAG 2.2 standard plus dyslexia style guides (clm-ACC-spacing-line, clm-ACC-spacing-tolerate)."
    render_settings:
      line_spacing: 1.5
      paragraph_spacing_em: 2.0
      space_before_heading_em: 1.0
      must_tolerate_letter_spacing_em: 0.12
      must_tolerate_word_spacing_em: 0.16
      fixed_height_text_boxes: false
    claims: [clm-ACC-spacing-line, clm-ACC-spacing-tolerate, clm-ACC-spacing-paragraph]

  - id: fmt-ACC-uncluttered-white-space
    type: format_rule
    title: "Uncluttered layout with white space"
    summary: "Plain background, no decorative images, white space grouping related content."
    body: |
      - Plain single-colour background; no watermarks, borders of clip art or background photos.
      - Only include images that carry meaning (a source, a labelled diagram, a vocabulary picture).
      - Use white space to group a question with its answer area and separate tasks.
      - Avoid multi-column layouts and text wrapped around images.
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
      jurisdiction: [scotland]
      cfe_level: [early, first, second, third, fourth, senior]
      curriculum_area: [all]
      artefact_type: [slides, worksheet, form]
      barrier: [sensory_load, attention, visual_tracking]
      access_dimension: layout
      changes_goal: false
    evidence:
      rating: practitioner_wisdom
      rationale: "Dyslexia style guides and Autism Toolbox sensory guidance (clm-ACC-clutter-white-space)."
    render_settings:
      background_images: false
      decorative_images: false
      watermark: false
      columns: 1
      text_wrap_around_images: false
      block_gap_em: 1.5
    claims: [clm-ACC-clutter-white-space, clm-ACC-clutter-plain-background, clm-ACC-clutter-sensory]

  - id: fmt-ACC-one-task-per-block
    type: format_rule
    title: "One task per block (chunking)"
    summary: "Each numbered block holds one task, short sentences, key information first."
    body: |
      - One task per numbered block, with its answer space directly beneath.
      - Sentences of about 25 words or fewer; paragraphs of about five lines or fewer.
      - Put the key information or action first in each block.
      - Break long tasks into smaller, sequenced steps under clear sub-headings.
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
      jurisdiction: [scotland]
      cfe_level: [early, first, second, third, fourth, senior]
      curriculum_area: [all]
      artefact_type: [worksheet, form, slides]
      barrier: [working_memory, attention, reading_fluency]
      access_dimension: structure
      changes_goal: false
    evidence:
      rating: practitioner_wisdom
      rationale: "Style guidance and EEF advice on small steps (clm-ACC-chunk-headings, clm-ACC-chunk-small-steps)."
    relations:
      uses_principle: [prn-EVD-explicit-instruction, prn-EVD-scaffolding]
    render_settings:
      tasks_per_block: 1
      number_tasks: true
      answer_space_below_task: true
      max_sentence_words: 25
      max_paragraph_lines: 5
      key_information_first: true
    claims: [clm-ACC-chunk-headings, clm-ACC-chunk-short-sentences, clm-ACC-chunk-small-steps, clm-ACC-chunk-one-at-a-time]

  - id: fmt-ACC-plain-language-instructions
    type: format_rule
    title: "Plain language instructions"
    summary: "Active, positive, numbered instructions in everyday words, with every input clearly labelled."
    body: |
      - Write instructions in the active voice, starting with the verb ("Underline", "Write", "Compare").
      - Say what to do, not what not to do; no double negatives.
      - Use a numbered list for multi-step instructions.
      - Spell out abbreviations on first use; put subject terms in a glossary or word bank.
      - Label every answer space or form field.
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
      jurisdiction: [scotland]
      cfe_level: [early, first, second, third, fourth, senior]
      curriculum_area: [all]
      artefact_type: [slides, worksheet, form, lesson_plan, interaction]
      barrier: [language_comprehension, working_memory, figurative_language]
      access_dimension: instructions
      changes_goal: false
    evidence:
      rating: practitioner_wisdom
      rationale: "BDA writing guidance, NAS, WCAG 3.3.2, EEF explicit instruction (clm-ACC-plain-active)."
    render_settings:
      voice: active
      double_negatives: false
      negative_instructions: avoid
      multi_step_format: numbered_list
      abbreviations_expanded_first_use: true
      field_labels_required: true
    claims: [clm-ACC-plain-active, clm-ACC-plain-lists, clm-ACC-plain-positive, clm-ACC-plain-labels, clm-ACC-plain-unambiguous]

  - id: fmt-ACC-colour-contrast-background
    type: format_rule
    title: "Colour, contrast and background"
    summary: "Dark text on an off-white background with at least 4.5:1 contrast; never rely on colour alone."
    body: |
      - Default: dark grey or black text on off-white or cream, not pure white.
      - Contrast at least 4.5:1 for body text (3:1 for large text).
      - Never use colour as the only signal (for example "the red answers are wrong"); add a label, symbol or bold word.
      - Avoid red and green pairings.
      - Print on matt paper where possible.
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
      jurisdiction: [scotland]
      cfe_level: [early, first, second, third, fourth, senior]
      curriculum_area: [all]
      artefact_type: [slides, worksheet, form]
      barrier: [visual_access, sensory_load, decoding]
      access_dimension: sensory
      changes_goal: false
    evidence:
      rating: moderate
      rationale: "WCAG 2.2 contrast and colour criteria plus dyslexia guidance (clm-ACC-colour-contrast)."
    render_settings:
      background_colour: "#FFFBEF"
      text_colour: "#1A1A1A"
      pure_white_background: false
      min_contrast_ratio: 4.5
      min_contrast_ratio_large_text: 3.0
      colour_only_meaning: false
      avoid_red_green_pairs: true
      paper_finish: matt
    claims: [clm-ACC-colour-contrast, clm-ACC-colour-not-white, clm-ACC-colour-not-sole, clm-ACC-colour-red-green]

  - id: fmt-ACC-heading-hierarchy
    type: format_rule
    title: "Consistent heading hierarchy"
    summary: "Real, descriptive headings, larger and bolder than body text, used the same way across a lesson's artefacts."
    body: |
      - Use built-in heading styles (Heading 1, 2, 3), not just bigger text, so screen readers and text-to-speech can navigate.
      - Headings at least 20% larger than body text and bold; never smaller than body text.
      - Headings describe content ("Task 2: Compare the two sources"), not "Part B".
      - Use the same labels and icons for the same things across slides, worksheet and form (for example "Talk partner" always means the same routine).
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
      jurisdiction: [scotland]
      cfe_level: [early, first, second, third, fourth, senior]
      curriculum_area: [all]
      artefact_type: [slides, worksheet, form, lesson_plan]
      barrier: [predictability, working_memory, visual_access]
      access_dimension: structure
      changes_goal: false
    evidence:
      rating: moderate
      rationale: "WCAG 1.3.1, 2.4.6, 3.2.4 and dyslexia style guidance (clm-ACC-head-styles)."
    render_settings:
      semantic_headings: true
      heading_min_scale: 1.2
      heading_weight: bold
      skip_heading_levels: false
      consistent_labels_across_artefacts: true
    claims: [clm-ACC-head-size, clm-ACC-head-styles, clm-ACC-head-descriptive, clm-ACC-head-consistent]

  - id: fmt-ACC-accessible-slides
    type: format_rule
    title: "Accessible slides"
    summary: "Sparse, large text, one idea per slide, alt text on meaningful images, and a shareable accessible copy."
    body: |
      - One idea per slide; text sparing and large (32 point suggested minimum for slide text).
      - Use the slide's title placeholder for a unique, descriptive title.
      - Give meaningful images alt text; mark decorative images as decorative.
      - Pair key words with an image or diagram, not decoration.
