  - id: adp-ACC-literal-language
    type: adaptation
    title: "Literal language and explaining figurative language"
    summary: "Say exactly what you mean in instructions, and explicitly explain idioms and figurative phrases when they appear."
    body: |
      In instructions and feedback avoid idioms, sarcasm and vague words ("in a bit", "a big paragraph"); use exact times and quantities. When figurative language is part of the text or the learning (P7 English imagery work), keep it but teach it: name the phrase, give the literal meaning and the intended meaning side by side.
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
      jurisdiction: [scotland]
      cfe_level: [second, third]
      stage: [p7, s1]
