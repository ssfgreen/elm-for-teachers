  # =====================================================================
  # C. SCOTTISH CONTEXT (cautions the model must respect)
  # =====================================================================

  - id: cau-ACC-asl-act-code-of-practice
    type: caution
    title: "Education (Additional Support for Learning) (Scotland) Act 2004 and Code of Practice"
    summary: "Scotland's legal framework defines additional support needs broadly: any barrier, any reason, short or long term, with support in teaching approaches, people and resources."
    body: |
      Any pupil who for whatever reason needs support beyond what is generally provided to peers has additional support needs. Barriers include the learning environment itself, so adapting teaching is part of meeting the duty. Adaptations in this library are "approaches to learning and teaching". The code cited here is the third edition (2017); gov.scot lists a fourth edition (2026) that should be checked before publishing.
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
      jurisdiction: [scotland]
      cfe_level: [early, first, second, third, fourth, senior]
      curriculum_area: [all]
      artefact_type: [lesson_plan]
    evidence:
      rating: strong
      rationale: "Statutory guidance (clm-ACC-asl-definition)."
    claims: [clm-ACC-asl-definition, clm-ACC-asl-factors, clm-ACC-asl-regard, clm-ACC-asl-support-types]

  - id: cau-ACC-girfec
    type: caution
    title: "Getting it right for every child (GIRFEC)"
    summary: "Support sits within GIRFEC: rights-based, wellbeing-focused, with the child's and family's views sought."
    body: |
      Classroom adaptations are part of the wider GIRFEC approach. Where several agencies are involved a Child's Plan may coordinate support. The pupil's own views on what helps should be sought and recorded (store them in the school system, not this library).
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
      jurisdiction: [scotland]
      cfe_level: [early, first, second, third, fourth, senior]
      curriculum_area: [all]
      artefact_type: [lesson_plan]
    evidence:
      rating: strong
      rationale: "Scottish Government policy and statutory guidance (clm-ACC-girfec-what)."
    claims: [clm-ACC-girfec-what, clm-ACC-girfec-childplan, clm-ACC-girfec-views]

  - id: cau-ACC-staged-intervention
    type: caution
    title: "Staged intervention: universal support first"
    summary: "Needs are met early and with the least intrusive support; most are met at the universal level by the class teacher."
    body: |
      Start with universal classroom adaptations (format rules and light-touch adaptations). Escalate only when these are not enough. Local authorities use different numbers of stages; the Act does not prescribe one model.
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
      jurisdiction: [scotland]
      cfe_level: [early, first, second, third, fourth, senior]
      curriculum_area: [all]
      artefact_type: [lesson_plan]
    evidence:
      rating: strong
      rationale: "Statutory guidance and Education Scotland managed resource (clm-ACC-staged-least)."
    claims: [clm-ACC-staged-least, clm-ACC-staged-models, clm-ACC-staged-universal]

  - id: cau-ACC-iep
    type: caution
    title: "Individualised educational programmes (IEPs)"
    summary: "IEPs are non-statutory working plans for pupils whose needs universal planning cannot meet; they set measurable outcomes reviewed at least termly."
    body: |
      When a pupil has an IEP, artefacts and adaptations should serve its outcomes. The library does not store IEP content; a pupil profile can reference adaptation entry ids.
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
      jurisdiction: [scotland]
      cfe_level: [early, first, second, third, fourth, senior]
      curriculum_area: [all]
      artefact_type: [lesson_plan]
    evidence:
      rating: strong
      rationale: "Education Scotland guidance and statutory code (clm-ACC-iep-who)."
    claims: [clm-ACC-iep-who, clm-ACC-iep-content, clm-ACC-iep-staged, clm-ACC-iep-code]

  - id: cau-ACC-morgan-review
    type: caution
    title: "Morgan review of ASL implementation (2020)"
    summary: "The legislation is sound but implementation is inconsistent; reliance on diagnosis to unlock support is a problem."
    body: |
      Use as context when planning: do not make classroom adaptations conditional on a diagnosis; treat inclusion as every teacher's responsibility; put relationships before process.
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
      jurisdiction: [scotland]
      cfe_level: [early, first, second, third, fourth, senior]
      curriculum_area: [all]
      artefact_type: [lesson_plan]
    evidence:
      rating: strong
      rationale: "Independent review commissioned by Scottish Ministers (clm-ACC-morgan-implementation)."
    claims: [clm-ACC-morgan-implementation, clm-ACC-morgan-diagnosis, clm-ACC-morgan-visibility, clm-ACC-morgan-inclusion, clm-ACC-morgan-themes]

  - id: cau-ACC-needs-not-labels
    type: caution
    title: "Plan from the individual's needs, not from labels"
    summary: "Choose adaptations by barrier and by what works for this pupil; diagnostic labels are hints only."
    body: |
      The often_relevant_to field on adaptations is a hint, never a rule. Start from the observed barrier (for example decoding, processing speed, sensory load), trial an adaptation, ask the pupil, and keep what works. Do not wait for a diagnosis before adapting, and do not assume every pupil with a label needs the same adaptations.
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
      jurisdiction: [scotland]
      cfe_level: [early, first, second, third, fourth, senior]
      curriculum_area: [all]
      artefact_type: [lesson_plan, worksheet, slides, form, interaction]
    evidence:
      rating: strong
      rationale: "EEF guidance, ASL Code and Scottish dyslexia definition agree (clm-ACC-needs-eef)."
    claims: [clm-ACC-needs-eef, clm-ACC-needs-question, clm-ACC-needs-code, clm-ACC-needs-adt, clm-ACC-needs-dyslexia-continuum, clm-ACC-needs-hints]

  - id: cau-ACC-dyslexia-fonts
    type: caution
    title: "Specialist dyslexia fonts: no reading benefit"
    summary: "Trials of OpenDyslexic and Dyslexie found no gains in reading speed or accuracy; spacing, not letter shape, is the likely active ingredient."
    body: |
      Do not convert class materials to a specialist dyslexia font or present it as support. Use plain fonts with good spacing; allow an individual's preferred font.
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
      jurisdiction: [scotland]
      cfe_level: [early, first, second, third, fourth, senior]
      curriculum_area: [all]
      artefact_type: [worksheet, slides, form]
    evidence:
      rating: not_recommended
      rationale: "Two trials found no benefit (clm-ACC-font-opendyslexic, clm-ACC-font-dyslexie)."
    claims: [clm-ACC-font-opendyslexic, clm-ACC-font-dyslexie, clm-ACC-font-spacing-confound, clm-ACC-font-preference-ok]

  - id: cau-ACC-scaffolds-temporary-high-expectations
    type: caution
    title: "Adaptations keep expectations high; scaffolds fade"
    summary: "Access adaptations should keep the same learning goal; scaffolds are temporary and planned to be removed."
    body: |
      For each adaptation check: does the pupil still meet the learning intention? If an adaptation changes the goal (changes_goal true) a teacher must approve it. Plan how each scaffold will be faded. Inclusive practice is built into planning for all, not bolted on.
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
