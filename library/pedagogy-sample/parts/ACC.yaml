    type: adaptation
    title: "Pupil-preferred font"
    summary: "Allow an individual pupil to use a font they find comfortable, without assuming a dyslexia font will help."
    body: |
      Offer a choice of plain fonts in digital copies. If a pupil prefers a specialist font, they may use it, but do not change class materials for it and do not treat it as support for reading difficulties.
