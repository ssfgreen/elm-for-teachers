    type: adaptation
    title: "Extra processing time"
    summary: "Wait longer after questions and instructions, without adding more words."
    body: |
      After asking or instructing, wait at least ten seconds before rephrasing. If you repeat, use the same words. Allow extra time for written tasks by reducing quantity rather than rushing.
