  - id: psg-ACC-eef-scaffolding
    source_id: src-ACC-eef-send-2020
    locator: "p.26 (Scaffolding)"
    text: >-
      Scaffolds are temporary supports (visual, verbal or written, such as a writing frame
      or a task checklist) that the teacher removes gradually as the pupil becomes
      independent; for pupils with SEND a scaffold may stay longer.
    excerpt_type: paraphrase
    fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
