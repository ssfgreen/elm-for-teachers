    support_type: paraphrase
  - id: clm-ACC-chunkread-paragraphs
    entry_id: adp-ACC-chunked-reading-checks
    text: "Short paragraphs of around five lines are recommended for dyslexic readers."
    supported_by: [psg-ACC-dysscot-writing]
    support_type: paraphrase

  - id: clm-ACC-go-eef
    entry_id: adp-ACC-graphic-organisers
    text: "The EEF gives graphic organisers such as Venn diagrams, T-charts, mind maps and the Frayer model as cognitive strategies."
    supported_by: [psg-ACC-eef-graphic-organisers]
    support_type: paraphrase
  - id: clm-ACC-go-flowcharts
    entry_id: adp-ACC-graphic-organisers
    text: "Flow charts help readers follow procedures and sequences."
    supported_by: [psg-ACC-bda-lists-images]
    support_type: paraphrase
  - id: clm-ACC-go-fade
    entry_id: adp-ACC-graphic-organisers
    text: "Scaffolds such as pre-filled organisers should be removed gradually as pupils become independent."
    supported_by: [psg-ACC-eef-scaffolding]
    support_type: paraphrase

  - id: clm-ACC-l1-glossary
    entry_id: adp-ACC-home-language-glossary
    text: "EAL learners can create bilingual glossaries of key topic words and use bilingual dictionaries."
    supported_by: [psg-ACC-bell-glossary]
    support_type: paraphrase
  - id: clm-ACC-l1-transfer
    entry_id: adp-ACC-home-language-glossary
    text: "Skills transfer across languages, so using the first language supports curriculum access and the learning of English rather than replacing it."
    supported_by: [psg-ACC-bell-glossary]
    support_type: paraphrase
  - id: clm-ACC-l1-translanguaging
    entry_id: adp-ACC-home-language-glossary
    text: "The Bell Foundation describes codeswitching and translanguaging as very useful in the classroom."
    supported_by: [psg-ACC-bell-quote]
    support_type: direct_quote
  - id: clm-ACC-l1-dual-books
    entry_id: adp-ACC-home-language-glossary
    text: "Dual-language books and pupil-made illustrated glossaries are recommended EAL strategies in Scottish primary schools."
    supported_by: [psg-ACC-abd-l1]
    support_type: paraphrase
  - id: clm-ACC-l1-code
    entry_id: adp-ACC-home-language-glossary
    text: "Scottish statutory guidance says a lack of English should be addressed in a programme that reflects the child's existing skills."
    supported_by: [psg-ACC-code-ch2-examples]
    support_type: paraphrase

  - id: clm-ACC-frame-eef
    entry_id: adp-ACC-writing-frames-sentence-starters
    text: "Writing frames are an example of a scaffold, which can later be reduced, for example by moving headings to the board."
    supported_by: [psg-ACC-eef-scaffolding]
    support_type: paraphrase
  - id: clm-ACC-frame-eal
    entry_id: adp-ACC-writing-frames-sentence-starters
    text: "Sentence starters and sentence-building scaffolds support EAL learners' writing."
    supported_by: [psg-ACC-abd-frames]
    support_type: paraphrase
  - id: clm-ACC-frame-model
    entry_id: adp-ACC-writing-frames-sentence-starters
    text: "Modelling useful phrases and sentence structures helps pupils with language difficulties answer questions."
    supported_by: [psg-ACC-dld-time-check]
    support_type: paraphrase

  - id: clm-ACC-quiet-noise
    entry_id: adp-ACC-quiet-space-noise
    text: "Managing classroom noise and allowing headphones where noise cannot be reduced help learners with sensory sensitivities."
    supported_by: [psg-ACC-at-sensory-env]
    support_type: paraphrase
  - id: clm-ACC-quiet-space
    entry_id: adp-ACC-quiet-space-noise
    text: "An agreed safe or quiet space to regulate is a recommended adjustment and a universal support."
    supported_by: [psg-ACC-at-sensory-breaks, psg-ACC-at-universal-supports]
    support_type: paraphrase

  - id: clm-ACC-move-breaks
    entry_id: adp-ACC-movement-breaks
    text: "Regular movement breaks should be scheduled even when the child appears calm."
    supported_by: [psg-ACC-at-sensory-breaks]
    support_type: paraphrase

  - id: clm-ACC-digital-books
    entry_id: adp-ACC-accessible-digital-texts
    text: "Books for All provides accessible digital versions of books used in the Scottish curriculum."
    supported_by: [psg-ACC-call-resources]
    support_type: paraphrase
  - id: clm-ACC-digital-resize
    entry_id: adp-ACC-accessible-digital-texts
    text: "Digital text should resize to 200% without loss of content."
    supported_by: [psg-ACC-wcag-1-4-8]
    support_type: paraphrase

  - id: clm-ACC-symbols-code
    entry_id: adp-ACC-symbol-supported-text
    text: "Communication symbols are given in Scottish statutory guidance as an example of additional support."
    supported_by: [psg-ACC-code-ch2-examples]
    support_type: paraphrase
  - id: clm-ACC-symbols-call
    entry_id: adp-ACC-symbol-supported-text
    text: "CALL Scotland's Symbols for All provides printable symbolised curriculum resources."
    supported_by: [psg-ACC-call-resources]
    support_type: paraphrase
  - id: clm-ACC-symbols-stage
    entry_id: adp-ACC-symbol-supported-text
    text: "Visual supports should match the learner's stage of communication."
    supported_by: [psg-ACC-at-visual-purposes]
    support_type: paraphrase

  - id: clm-ACC-repeat-same
    entry_id: adp-ACC-repeat-and-check-instructions
    text: "When an instruction is repeated, the same words should be used, ideally with visual support."
    supported_by: [psg-ACC-nas-processing]
    support_type: paraphrase
  - id: clm-ACC-repeat-back
    entry_id: adp-ACC-repeat-and-check-instructions
    text: "Asking pupils to repeat instructions back checks understanding."
    supported_by: [psg-ACC-dld-time-check]
    support_type: paraphrase
  - id: clm-ACC-repeat-visible
    entry_id: adp-ACC-repeat-and-check-instructions
    text: "Keeping numbered written steps visible reduces the load of remembering spoken instructions."
    supported_by: [psg-ACC-bda-lists-images, psg-ACC-at-comm-time]
    support_type: inference_by_curator

  - id: clm-ACC-lrl-wcag
    entry_id: adp-ACC-lower-reading-level-version
    text: "Where text needs a reading level above lower secondary, a supplementary simpler version should be available."
    supported_by: [psg-ACC-wcag-3-1-5]
    support_type: paraphrase
  - id: clm-ACC-lrl-plain
    entry_id: adp-ACC-lower-reading-level-version
    text: "Conversational language without unfamiliar jargon makes text easier to read."
    supported_by: [psg-ACC-dysscot-plain]
    support_type: paraphrase
  - id: clm-ACC-lrl-goal
    entry_id: adp-ACC-lower-reading-level-version
    text: "A simplified text should supplement rather than replace the original where reading that text is the learning goal, to keep challenge appropriate."
    supported_by: [psg-ACC-eef-high-expectations]
    support_type: inference_by_curator

  # --- Scottish context ---
  - id: clm-ACC-asl-definition
    entry_id: cau-ACC-asl-act-code-of-practice
    text: "In Scotland a child has additional support needs if, for any reason, they need support beyond what is generally provided to peers to benefit from school education."
    supported_by: [psg-ACC-code-ch2-definition]
    support_type: paraphrase
  - id: clm-ACC-asl-factors
    entry_id: cau-ACC-asl-act-code-of-practice
    text: "Additional support needs can arise from the learning environment, family circumstances, disability or health, or social and emotional factors, and can be short or long term."
    supported_by: [psg-ACC-code-ch2-factors]
    support_type: paraphrase
  - id: clm-ACC-asl-regard
    entry_id: cau-ACC-asl-act-code-of-practice
    text: "Education authorities must have regard to the Code of Practice, which should be read alongside GIRFEC and Curriculum for Excellence."
    supported_by: [psg-ACC-code-ch1-purpose]
    support_type: paraphrase
  - id: clm-ACC-asl-support-types
    entry_id: cau-ACC-asl-act-code-of-practice
    text: "Additional support includes approaches to learning and teaching, support from personnel and provision of resources."
    supported_by: [psg-ACC-code-ch2-support-types]
    support_type: paraphrase

  - id: clm-ACC-girfec-what
    entry_id: cau-ACC-girfec
    text: "GIRFEC is Scotland's rights-based national approach to giving children the right support at the right time, using eight wellbeing indicators."
    supported_by: [psg-ACC-girfec-what]
    support_type: paraphrase
  - id: clm-ACC-girfec-childplan
    entry_id: cau-ACC-girfec
    text: "Where several agencies are involved, a Child's Plan coordinated by a Lead Professional can record and coordinate support."
    supported_by: [psg-ACC-code-ch3-girfec, psg-ACC-girfec-what]
    support_type: paraphrase
  - id: clm-ACC-girfec-views
    entry_id: cau-ACC-girfec
    text: "The views of children and parents should be sought, taken into account and recorded."
    supported_by: [psg-ACC-code-ch3-girfec, psg-ACC-iep-contents]
    support_type: paraphrase

  - id: clm-ACC-staged-least
    entry_id: cau-ACC-staged-intervention
    text: "Staged intervention aims to meet needs early and with the least intrusive level of intervention."
    supported_by: [psg-ACC-at-universal-quote, psg-ACC-code-ch3-staged]
    support_type: direct_quote
  - id: clm-ACC-staged-models
    entry_id: cau-ACC-staged-intervention
    text: "Local authorities use different staged models, typically three to six stages; the Act does not prescribe one."
    supported_by: [psg-ACC-code-ch3-staged, psg-ACC-at-universal-supports]
    support_type: paraphrase
  - id: clm-ACC-staged-universal
    entry_id: cau-ACC-staged-intervention
    text: "Most additional support needs are met at the universal level, where the class teacher has first responsibility."
    supported_by: [psg-ACC-at-universal-supports]
    support_type: paraphrase

  - id: clm-ACC-iep-who
    entry_id: cau-ACC-iep
    text: "An IEP is a non-statutory working plan for learners whose outcomes cannot be met through universal class or group planning alone."
    supported_by: [psg-ACC-iep-who]
    support_type: paraphrase
  - id: clm-ACC-iep-content
    entry_id: cau-ACC-iep
    text: "An IEP sets prioritised, measurable outcomes with the child and family, reviewed at least termly for short-term outcomes and annually for long-term targets."
    supported_by: [psg-ACC-iep-contents]
    support_type: paraphrase
  - id: clm-ACC-iep-staged
    entry_id: cau-ACC-iep
    text: "Staged intervention is used to decide the appropriate level of planning, including whether an IEP is needed."
    supported_by: [psg-ACC-iep-staged]
    support_type: paraphrase
  - id: clm-ACC-iep-code
    entry_id: cau-ACC-iep
    text: "An IEP should include the educational objectives of any co-ordinated support plan."
    supported_by: [psg-ACC-code-ch3-iep]
    support_type: paraphrase

  - id: clm-ACC-morgan-implementation
    entry_id: cau-ACC-morgan-review
    text: "The 2020 Morgan review found the principles of the ASL legislation sound but their implementation fragmented and inconsistent."
    supported_by: [psg-ACC-morgan-legislation]
    support_type: paraphrase
  - id: clm-ACC-morgan-diagnosis
    entry_id: cau-ACC-morgan-review
    text: "The review found access to support was often made dependent on a diagnosis, acting as a way of rationing resources."
    supported_by: [psg-ACC-morgan-diagnosis]
    support_type: paraphrase
  - id: clm-ACC-morgan-visibility
    entry_id: cau-ACC-morgan-review
    text: "The review found additional support for learning was not visible or equally valued, although around 30.9% of pupils had an identified additional support need."
    supported_by: [psg-ACC-morgan-visibility]
    support_type: paraphrase
  - id: clm-ACC-morgan-inclusion
    entry_id: cau-ACC-morgan-review
    text: "The review found no assurance that all professionals accept inclusion and the presumption of mainstreaming as part of their role."
    supported_by: [psg-ACC-morgan-mainstreaming]
    support_type: paraphrase
  - id: clm-ACC-morgan-themes
    entry_id: cau-ACC-morgan-review
    text: "The review report is organised around nine themes, including vision and visibility, mainstreaming and inclusion, and workforce development."
    supported_by: [psg-ACC-morgan-themes]
    support_type: paraphrase

  - id: clm-ACC-needs-eef
    entry_id: cau-ACC-needs-not-labels
    text: "For day-to-day teaching, knowing a pupil's specific needs is more useful than knowing their diagnosis, because categories overlap and pupils with the same diagnosis differ."
    supported_by: [psg-ACC-eef-needs-not-diagnosis]
    support_type: paraphrase
  - id: clm-ACC-needs-question
    entry_id: cau-ACC-needs-not-labels
    text: "The key question is what this individual pupil needs, not what works for a diagnostic group."
    supported_by: [psg-ACC-eef-key-question]
    support_type: paraphrase
  - id: clm-ACC-needs-code
    entry_id: cau-ACC-needs-not-labels
    text: "Scottish statutory guidance says children should be seen as individuals and support tailored to their needs, since labels help some families and limit others."
    supported_by: [psg-ACC-code-ch2-labels]
    support_type: paraphrase
  - id: clm-ACC-needs-adt
    entry_id: cau-ACC-needs-not-labels
    text: "In Scotland, receiving additional support does not depend on a formal diagnosis of dyslexia."
    supported_by: [psg-ACC-adt-def-no-label]
    support_type: paraphrase
  - id: clm-ACC-needs-dyslexia-continuum
    entry_id: cau-ACC-needs-not-labels
    text: "The Scottish working definition describes dyslexia as a continuum whose impact depends on the task, environment and support."
    supported_by: [psg-ACC-adt-def-quote, psg-ACC-adt-def-context]
    support_type: direct_quote
  - id: clm-ACC-needs-hints
    entry_id: cau-ACC-needs-not-labels
    text: "Diagnostic labels attached to adaptations in this library are hints only; selection should start from the observed barrier and what works for the pupil."
    supported_by: [psg-ACC-eef-needs-not-diagnosis, psg-ACC-code-ch2-labels, psg-ACC-morgan-diagnosis]
    support_type: inference_by_curator

  - id: clm-ACC-scaf-temporary
    entry_id: cau-ACC-scaffolds-temporary-high-expectations
    text: "Scaffolds are temporary and should be removed gradually, though they may stay longer for some pupils with SEND."
    supported_by: [psg-ACC-eef-scaffolding]
    support_type: paraphrase
  - id: clm-ACC-scaf-expectations
    entry_id: cau-ACC-scaffolds-temporary-high-expectations
    text: "Teachers should hold high expectations for all pupils and guard against support that leaves pupils with undemanding tasks."
    supported_by: [psg-ACC-eef-high-expectations]
    support_type: paraphrase
  - id: clm-ACC-scaf-five
    entry_id: cau-ACC-scaffolds-temporary-high-expectations
    text: "Flexible grouping, cognitive and metacognitive strategies, explicit instruction, technology and scaffolding are the EEF's starting point for teaching all pupils."
    supported_by: [psg-ACC-eef-five-strategies]
    support_type: paraphrase
  - id: clm-ACC-scaf-all
    entry_id: cau-ACC-scaffolds-temporary-high-expectations
    text: "Good teaching for pupils with SEND is good teaching for all."
    supported_by: [psg-ACC-eef-good-teaching-all]
    support_type: direct_quote
  - id: clm-ACC-scaf-inclusion
    entry_id: cau-ACC-scaffolds-temporary-high-expectations
    text: "In Scotland, inclusion means building the needs of all learners into curriculum planning, resources and approaches."
    supported_by: [psg-ACC-adt-inclusion-meaning]
    support_type: paraphrase
