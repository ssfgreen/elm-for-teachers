      barrier: [figurative_language, language_comprehension]
      access_dimension: language
      changes_goal: false
      often_relevant_to: [autism, developmental language disorder, EAL]
    evidence:
      rating: practitioner_wisdom
      rationale: "Autism Toolbox, NAS and DLD guidance (clm-ACC-literal-overliteral)."
    risks:
      - "Do not strip figurative language out of P7 texts where understanding it is the learning intention; explain it instead."
    render_settings: { idioms_in_instructions: false, exact_times_and_quantities: true, figurative_gloss_table: true }
    artefact_recipes:
      worksheet: "Two-column 'What it says / What it means' table for figurative phrases in the extract."
      interaction: "Replace 'Wrap it up' with 'Finish your sentence. You have 2 minutes.'"
    claims: [clm-ACC-literal-overliteral, clm-ACC-literal-idioms, clm-ACC-literal-dld, clm-ACC-literal-teach]

