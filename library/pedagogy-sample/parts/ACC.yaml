  - id: psg-ACC-eef-explicit
    source_id: src-ACC-eef-send-2020
    locator: "p.24 (Explicit instruction, Box 8)"
    text: >-
      Explicit instruction means teacher demonstration followed by guided then independent
      practice, teaching in small steps with clear and unambiguous language, examples and
      non-examples, and highlighting essential content.
    excerpt_type: paraphrase
    fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
    verified_by_fetch: true

  - id: psg-ACC-eef-small-steps
    source_id: src-ACC-eef-send-2020
    locator: "p.13"
    text: >-
      Breaking tasks into smaller steps is given as one way of making tasks manageable.
    excerpt_type: paraphrase
    fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
    verified_by_fetch: true

  - id: psg-ACC-eef-graphic-organisers
    source_id: src-ACC-eef-send-2020
    locator: "p.23 (Box 7 and Figure 3)"
    text: >-
      Graphic organisers such as Venn diagrams, T-charts, mind maps and the Frayer model
      are given as examples of cognitive strategies.
    excerpt_type: paraphrase
    fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
    verified_by_fetch: true

  - id: psg-ACC-eef-vocab
    source_id: src-ACC-eef-send-2020
    locator: "p.14 and p.16 (case example)"
    text: >-
      Pre-teaching of vocabulary, and direct vocabulary instruction for an individual
      pupil, are given as examples of responding to identified needs.
    excerpt_type: paraphrase
    fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
    verified_by_fetch: true

  - id: psg-ACC-eef-technology
    source_id: src-ACC-eef-send-2020
    locator: "p.25 (Using technology)"
    text: >-
      Technology can support pupils with SEND through instructional apps, non-instructional
      tools such as note-taking apps, and speech-generating apps for pupils with
      communication difficulties.
    excerpt_type: paraphrase
    fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
    verified_by_fetch: true

  - id: psg-ACC-eef-flexible-grouping
    source_id: src-ACC-eef-send-2020
    locator: "p.22 (Flexible grouping)"
    text: >-
      Flexible grouping places pupils together temporarily around a shared need and
      disbands the group once its purpose is met, as an alternative to fixed streaming.
