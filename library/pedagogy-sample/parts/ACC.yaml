passages:

  # --- BDA Dyslexia Style Guide 2023 ---
  - id: psg-ACC-bda-fonts
    source_id: src-ACC-bda-style-guide-2023
    locator: "Section 'Readable fonts'"
    text: >-
      Recommends a sans serif font such as Arial or Comic Sans, with Verdana, Tahoma,
      Century Gothic, Trebuchet, Calibri or Open Sans as alternatives, at 12 to 14 point
      (about 16 to 19 px); some readers need larger text.
    excerpt_type: paraphrase
    fetched_url: https://www.bdadyslexia.org.uk/advice/employers/creating-a-dyslexia-friendly-workplace/dyslexia-friendly-style-guide
    verified_by_fetch: true

  - id: psg-ACC-bda-spacing
    source_id: src-ACC-bda-style-guide-2023
    locator: "Section 'Readable fonts'"
    text: >-
      Advises letter spacing of roughly 35% of the average letter width (more than this
      harms readability), word spacing at least 3.5 times the letter spacing, and line
      spacing of about 1.5, scaled with word spacing.
    excerpt_type: paraphrase
    fetched_url: https://www.bdadyslexia.org.uk/advice/employers/creating-a-dyslexia-friendly-workplace/dyslexia-friendly-style-guide
    verified_by_fetch: true

  - id: psg-ACC-bda-emphasis
    source_id: src-ACC-bda-style-guide-2023
    locator: "Section 'Readable fonts'"
    text: >-
      Advises against underlining and italics because they make text look crowded; bold
      should be used for emphasis, and capitals should be avoided, especially in
      continuous text.
    excerpt_type: paraphrase
    fetched_url: https://www.bdadyslexia.org.uk/advice/employers/creating-a-dyslexia-friendly-workplace/dyslexia-friendly-style-guide
    verified_by_fetch: true

  - id: psg-ACC-bda-headings
    source_id: src-ACC-bda-style-guide-2023
    locator: "Section 'Headings and structure'"
    text: >-
      Headings should be at least 20% larger than body text, optionally bold, built with
      the word processor's heading styles so assistive technology can read the structure,
      with extra space around headings and between paragraphs.
    excerpt_type: paraphrase
    fetched_url: https://www.bdadyslexia.org.uk/advice/employers/creating-a-dyslexia-friendly-workplace/dyslexia-friendly-style-guide
    verified_by_fetch: true

  - id: psg-ACC-bda-colour
    source_id: src-ACC-bda-style-guide-2023
    locator: "Section 'Colour'"
    text: >-
      Use a single plain background colour with no patterns or pictures, sufficient
      contrast, and dark text on a light background that is not pure white (cream or a
      soft pastel); avoid green with red or pink; prefer matt paper thick enough to stop
      show-through.
    excerpt_type: paraphrase
    fetched_url: https://www.bdadyslexia.org.uk/advice/employers/creating-a-dyslexia-friendly-workplace/dyslexia-friendly-style-guide
    verified_by_fetch: true

  - id: psg-ACC-bda-layout
    source_id: src-ACC-bda-style-guide-2023
    locator: "Section 'Layout'"
    text: >-
      Left-align text and do not justify it; avoid multi-column layouts; keep text runs
      short (around 60 to 70 characters); use white space to reduce clutter and group
      related content; use regular headings in long documents.
    excerpt_type: paraphrase
    fetched_url: https://www.bdadyslexia.org.uk/advice/employers/creating-a-dyslexia-friendly-workplace/dyslexia-friendly-style-guide
    verified_by_fetch: true

  - id: psg-ACC-bda-writing
    source_id: src-ACC-bda-style-guide-2023
    locator: "Section 'Writing style'"
    text: >-
      Write in the active voice with short paragraphs and plain everyday language; give
      clear instructions without double negatives; spell out abbreviations on first use
      and provide a glossary of abbreviations and jargon.
    excerpt_type: paraphrase
    fetched_url: https://www.bdadyslexia.org.uk/advice/employers/creating-a-dyslexia-friendly-workplace/dyslexia-friendly-style-guide
    verified_by_fetch: true

  - id: psg-ACC-bda-lists-images
    source_id: src-ACC-bda-style-guide-2023
    locator: "Section 'Writing style'"
    text: >-
      Support text with images, flow charts for procedures and pictograms, and prefer
      bullet points and numbered lists to continuous prose.
    excerpt_type: paraphrase
    fetched_url: https://www.bdadyslexia.org.uk/advice/employers/creating-a-dyslexia-friendly-workplace/dyslexia-friendly-style-guide
    verified_by_fetch: true

  # --- Dyslexia Scotland typed content 2025 ---
  - id: psg-ACC-dysscot-spacing
    source_id: src-ACC-dysscot-typed-content-2025
    locator: "UNCONFIRMED: about p.2, spacing guidance (page numbers inferred from extracted text)"
    text: >-
      Increase letter and word spacing (a simple default is about 30 to 35% of font size,
      adjusted to the reader's preference, with word spacing in proportion), avoid
      excessive gaps, use 1.5 line spacing and clear paragraph breaks.
    excerpt_type: paraphrase
    fetched_url: https://dyslexiascotland.org.uk/wp-content/uploads/2025/10/formats.pdf
    verified_by_fetch: true

  - id: psg-ACC-dysscot-line-length
    source_id: src-ACC-dysscot-typed-content-2025
    locator: "UNCONFIRMED: about p.3, line length guidance"
    text: >-
      Aim for lines of roughly 50 to 75 characters; shorter lines often help dyslexic
      readers.
    excerpt_type: paraphrase
    fetched_url: https://dyslexiascotland.org.uk/wp-content/uploads/2025/10/formats.pdf
    verified_by_fetch: true

  - id: psg-ACC-dysscot-typeface
    source_id: src-ACC-dysscot-typed-content-2025
    locator: "UNCONFIRMED: about pp.3 to 4, typeface and font size guidance"
    text: >-
      No single dyslexia-friendly font has been shown to be better; use a plain, evenly
      spaced font without decorative or oblique styles; sans serif is often preferred
      though evidence of advantage is inconsistent; specialist dyslexia fonts only if the
      individual finds them helpful; at least 12 point body text, and let readers choose
      larger text or their preferred font.
    excerpt_type: paraphrase
    fetched_url: https://dyslexiascotland.org.uk/wp-content/uploads/2025/10/formats.pdf
    verified_by_fetch: true

  - id: psg-ACC-dysscot-layout
    source_id: src-ACC-dysscot-typed-content-2025
    locator: "UNCONFIRMED: about p.5, alignment, layout and headings"
    text: >-
      Align text left and avoid full justification; keep layouts clean and uncluttered;
      chunk content under clear headings and subheadings; headings bolder and larger than
      body text, never smaller.
    excerpt_type: paraphrase
    fetched_url: https://dyslexiascotland.org.uk/wp-content/uploads/2025/10/formats.pdf
    verified_by_fetch: true

  - id: psg-ACC-dysscot-writing
    source_id: src-ACC-dysscot-typed-content-2025
    locator: "UNCONFIRMED: about pp.5 to 6, writing style and emphasis"
    text: >-
      Keep sentences to about 25 words or fewer and paragraphs to about five lines; put
      key information first; make key information or actions visually distinct from the
      surrounding text.
    excerpt_type: paraphrase
    fetched_url: https://dyslexiascotland.org.uk/wp-content/uploads/2025/10/formats.pdf
    verified_by_fetch: true

  - id: psg-ACC-dysscot-plain
    source_id: src-ACC-dysscot-typed-content-2025
    locator: "UNCONFIRMED: about p.6, writing style (language)"
    text: >-
      Write conversationally, avoid jargon the audience does not know, and for general
      audiences aim at a low reading age (about eight years).
    excerpt_type: paraphrase
    fetched_url: https://dyslexiascotland.org.uk/wp-content/uploads/2025/10/formats.pdf
    verified_by_fetch: true

  - id: psg-ACC-dysscot-background
    source_id: src-ACC-dysscot-typed-content-2025
    locator: "UNCONFIRMED: about p.7, background colour, paper and contrast"
    text: >-
      Prefer off-white or tinted backgrounds (for example cream or peach) with dark text;
      some readers prefer lower-contrast pairs such as navy on pale yellow and preferences
      vary; use matte paper; meet at least a 4.5:1 contrast ratio.
    excerpt_type: paraphrase
    fetched_url: https://dyslexiascotland.org.uk/wp-content/uploads/2025/10/formats.pdf
    verified_by_fetch: true

  - id: psg-ACC-dysscot-slides-formats
    source_id: src-ACC-dysscot-typed-content-2025
    locator: "UNCONFIRMED: about p.8, slides, digital accessibility and format options"
    text: >-
      On slides use text sparingly (32 point suggested as a minimum); offer multiple or
      customisable formats, text-to-speech and accessibility toolbars; add diagrams,
      photos or video where helpful.
    excerpt_type: paraphrase
    fetched_url: https://dyslexiascotland.org.uk/wp-content/uploads/2025/10/formats.pdf
    verified_by_fetch: true

  # --- WCAG 2.2 ---
  - id: psg-ACC-wcag-1-4-3
    source_id: src-ACC-wcag-22
    locator: "Success Criterion 1.4.3 Contrast (Minimum), Level AA"
    text: >-
      Text needs a contrast ratio of at least 4.5:1 against its background; large text
      (18 point, or 14 point bold) needs at least 3:1.
    excerpt_type: paraphrase
    fetched_url: https://www.w3.org/TR/WCAG22/
    verified_by_fetch: true

  - id: psg-ACC-wcag-1-4-12
    source_id: src-ACC-wcag-22
    locator: "Success Criterion 1.4.12 Text Spacing, Level AA"
    text: >-
      Content must still work when users set line height to at least 1.5 times font size,
      paragraph spacing to 2 times, letter spacing to 0.12 times and word spacing to 0.16
      times font size.
    excerpt_type: paraphrase
    fetched_url: https://www.w3.org/TR/WCAG22/
