    fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
    verified_by_fetch: true

  - id: psg-ACC-eef-high-expectations
    source_id: src-ACC-eef-send-2020
    locator: "p.5, p.22 and p.34"
    text: >-
      Calls for high expectations for the learning of all pupils and an appropriate level
      of challenge, and warns that some support can leave pupils with undemanding tasks.
    excerpt_type: paraphrase
    fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
    verified_by_fetch: true

  # --- Font and spacing research ---
  - id: psg-ACC-zorzi-abstract
    source_id: src-ACC-zorzi-2012
    locator: "Abstract"
    text: >-
      In a large unselected sample of Italian and French children with dyslexia, simply
      increasing letter spacing substantially improved text reading without any training;
      the authors link this to greater sensitivity to crowding between neighbouring
      letters.
    excerpt_type: paraphrase
    fetched_url: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.1073/pnas.1205566109&resultType=core&format=json
    verified_by_fetch: true

  - id: psg-ACC-wery-abstract
    source_id: src-ACC-wery-diliberto-2017
    locator: "Abstract"
    text: >-
      In a single-subject alternating treatment study of 12 primary-aged pupils with
      dyslexia, OpenDyslexic produced no gains in reading rate or accuracy compared with
      Arial or Times New Roman, and no pupil preferred it.
    excerpt_type: paraphrase
    fetched_url: https://link.springer.com/article/10.1007/s11881-016-0127-1
    verified_by_fetch: true

  - id: psg-ACC-kuster-findings
    source_id: src-ACC-kuster-2018
    locator: "Abstract and Results (Experiments 1 and 2)"
    text: >-
      Across two experiments with Dutch children aged about 7 to 12 (170 with dyslexia in
      the first; 102 with and 45 without in the second), Dyslexie did not improve reading
      speed or accuracy; most children preferred Arial or Times New Roman, and preference
      was unrelated to performance. Children who like it need not be discouraged.
    excerpt_type: paraphrase
    fetched_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5934461/
    verified_by_fetch: true

  - id: psg-ACC-kuster-spacing
    source_id: src-ACC-kuster-2018
    locator: "UNCONFIRMED: Discussion (horizontal spacing and Marinus et al. 2016)"
    text: >-
      The authors note that horizontal letter spacing was not controlled and cite earlier
      work in which Dyslexie's apparent advantage disappeared once spacing was matched,
      suggesting spacing rather than letter shape drives such effects.
    excerpt_type: paraphrase
    fetched_url: https://pmc.ncbi.nlm.nih.gov/articles/PMC5934461/
    verified_by_fetch: true

  # --- Addressing Dyslexia Toolkit ---
