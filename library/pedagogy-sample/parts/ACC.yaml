    body: |
      Before whole-class questioning, quietly tell the pupil the question they will be asked, or let them rehearse with a partner. Use their name first, keep the question short and direct, and offer a choice ("Was it the king or the barons?") if needed. Avoid unannounced cold calling for this pupil.
