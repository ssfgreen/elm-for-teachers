  # --- EEF SEND guidance report ---
  - id: psg-ACC-eef-needs-not-diagnosis
    source_id: src-ACC-eef-send-2020
    locator: "p.15 (Recommendation 2)"
    text: >-
      For most day-to-day teaching decisions a diagnosis is less useful than knowing the
      pupil's specific needs: diagnostic categories overlap, and two pupils with the same
      diagnosis can have quite different needs.
    excerpt_type: paraphrase
    fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
    verified_by_fetch: true

  - id: psg-ACC-eef-key-question
    source_id: src-ACC-eef-send-2020
    locator: "p.7"
    text: >-
      The key question is what this individual pupil needs, not what works for a
      diagnostic group such as dyslexia.
    excerpt_type: paraphrase
    fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
    verified_by_fetch: true

  - id: psg-ACC-eef-good-teaching-all
    source_id: src-ACC-eef-send-2020
    locator: "p.8"
    text: "good teaching for pupils with SEND is good teaching for all"
    excerpt_type: quote
    fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
    verified_by_fetch: true

  - id: psg-ACC-eef-five-strategies
    source_id: src-ACC-eef-send-2020
    locator: "pp.20 to 26 (Recommendation 3)"
    text: >-
      Recommendation 3 names five strategies (flexible grouping, cognitive and
      metacognitive strategies, explicit instruction, using technology, and scaffolding)
      and advises using them as the starting point for classroom teaching for all pupils.
    excerpt_type: paraphrase
    fetched_url: https://dera.ioe.ac.uk/37846/1/EEF_Special_Educational_Needs_in_Mainstream_Schools_Guidance_Report.pdf
