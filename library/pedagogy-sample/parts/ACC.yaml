  - id: adp-ACC-text-to-speech
    type: adaptation
    title: "Text-to-speech and read aloud"
    summary: "Let the pupil hear text read aloud, using a Scottish computer voice or an adult reader, so decoding does not block access to content."
    body: |
      Provide the text digitally (editable Word, Google Doc or accessible PDF) so a text-to-speech tool can read it. In Scotland, Scottish-accented voices are free to schools through CALL Scotland. Check the pupil can start, pause and replay. Where the purpose of the task is decoding practice, use text-to-speech for instructions only.
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
      jurisdiction: [scotland]
      cfe_level: [second, third]
      stage: [p7, s1]
      curriculum_area: [all]
      artefact_type: [worksheet, slides, form]
      barrier: [decoding, reading_fluency, visual_access]
      access_dimension: representation
      changes_goal: false
      often_relevant_to: [dyslexia, visual impairment, EAL, developmental language disorder]
    evidence:
      rating: practitioner_wisdom
      rationale: "Scottish assistive technology provision and dyslexia format guidance (clm-ACC-tts-scottish-voice)."
    risks:
      - "In a P7 reading lesson where independent decoding is the goal, reading the text aloud changes the task; restrict to instructions."
      - "Scanned images of text cannot be read aloud; supply real text."
    render_settings: { tts_compatible: true, provide_editable_copy: true, scanned_text_images: false }
    artefact_recipes:
      worksheet: "Supply an editable copy alongside print; put each task's text in real text, not images."
      slides: "Share the deck in an editable format so it can be read aloud."
      interaction: "S1 history: pupil listens to the primary source through headphones while peers read silently."
    claims: [clm-ACC-tts-scottish-voice, clm-ACC-tts-call-tools, clm-ACC-tts-offer, clm-ACC-tts-technology]

  - id: adp-ACC-individual-spacing-background
    type: adaptation
    title: "Individual letter spacing, font size and background preferences"
    summary: "Widen letter and word spacing and change background tint for a pupil, tuned to what they find easiest."
    body: |
      Start from the baseline format rules, then trial with the pupil: wider letter spacing (towards 0.35 em), word spacing in proportion, larger text, and a tinted background such as cream or pale yellow. Record what works in the pupil's profile as overrides. Preferences vary, so ask rather than assume.
    status: draft
    version: "0.1"
    curated_by: [ACC]
    facets:
      jurisdiction: [scotland]
      cfe_level: [second, third]
      stage: [p7, s1]
      curriculum_area: [all]
      artefact_type: [worksheet, slides, form]
      barrier: [decoding, reading_fluency, sensory_load, visual_crowding]
      access_dimension: layout
      changes_goal: false
      often_relevant_to: [dyslexia, visual impairment]
    evidence:
      rating: moderate
      rationale: "Trial evidence that extra letter spacing helps children with dyslexia (clm-ACC-spacing-zorzi)."
    risks:
      - "Very wide spacing can reduce readability; tune to the reader."
      - "Coloured backgrounds are a comfort preference, not a treatment for dyslexia."
    render_settings:
      letter_spacing_em_options: [0.12, 0.35]
      word_spacing_ratio_to_letter: 3.5
      line_spacing: 1.5
      background_options: [cream, pale_yellow, off_white, pastel_blue]
      font_size_pt_options: [14, 16, 18]
      learner_override: true
    artefact_recipes:
      worksheet: "Generate a personal copy with the pupil's stored spacing, size and tint; keep page breaks at task boundaries."
      slides: "Give the pupil a digital copy they can view with their own settings."
    claims: [clm-ACC-spacing-zorzi, clm-ACC-spacing-preference, clm-ACC-spacing-not-font, clm-ACC-bg-preference]

