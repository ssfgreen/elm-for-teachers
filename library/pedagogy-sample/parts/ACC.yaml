  # --- ASL Code of Practice 2017 ---
  - id: psg-ACC-code-ch1-purpose
    source_id: src-ACC-sg-asl-code-2017
    locator: "Introduction, paras 1, 3 and 5"
    text: >-
      The 2004 Act (as amended) is the legal framework for identifying and addressing the
      additional support needs of children facing barriers to learning; education
      authorities must have regard to the code; it should be read alongside GIRFEC and
      Curriculum for Excellence.
    excerpt_type: paraphrase
    fetched_url: https://www.gov.scot/publications/supporting-childrens-learning-statutory-guidance-education-additional-support-learning-scotland/
    verified_by_fetch: true

  - id: psg-ACC-code-ch2-definition
    source_id: src-ACC-sg-asl-code-2017
    locator: "Chapter 2, para 1 (section 1(1) of the Act) and para 7"
    text: >-
      A child has additional support needs where, for whatever reason, they are or are
      likely to be unable to benefit from school education without additional support;
      additional support means provision additional to, or different from, that generally
      made for peers of the same age.
    excerpt_type: paraphrase
    fetched_url: https://www.gov.scot/publications/supporting-childrens-learning-statutory-guidance-education-additional-support-learning-scotland/pages/3/
    verified_by_fetch: true

  - id: psg-ACC-code-ch2-support-types
    source_id: src-ACC-sg-asl-code-2017
    locator: "Chapter 2, para 12"
    text: >-
      Additional support falls into three overlapping areas: approaches to learning and
      teaching, support from personnel, and provision of resources.
    excerpt_type: paraphrase
    fetched_url: https://www.gov.scot/publications/supporting-childrens-learning-statutory-guidance-education-additional-support-learning-scotland/pages/3/
    verified_by_fetch: true

  - id: psg-ACC-code-ch2-factors
    source_id: src-ACC-sg-asl-code-2017
    locator: "Chapter 2, paras 16 to 22"
    text: >-
      Needs can arise from the learning environment (including teaching that does not take
      account of needs), family circumstances, disability or health, or social and
      emotional factors; a child may be affected by more than one, and needs may be short
      or long term.
    excerpt_type: paraphrase
    fetched_url: https://www.gov.scot/publications/supporting-childrens-learning-statutory-guidance-education-additional-support-learning-scotland/pages/3/
    verified_by_fetch: true

  - id: psg-ACC-code-ch2-labels
    source_id: src-ACC-sg-asl-code-2017
    locator: "Chapter 2, paras 23 to 25"
    text: >-
      The same factor affects children differently; some families find labels such as
      dyslexia or autism helpful while others find them limiting or stigmatising, so
      children should be seen as individuals with support tailored to their needs,
      provided early and without singling them out.
    excerpt_type: paraphrase
    fetched_url: https://dera.ioe.ac.uk/id/eprint/30765/1/00529411.pdf
    verified_by_fetch: true

  - id: psg-ACC-code-ch2-examples
    source_id: src-ACC-sg-asl-code-2017
    locator: "Chapter 2, paras 13 and 24"
    text: >-
      Examples of additional support include in-class support from an EAL teacher and
      communication symbols for an autistic child; a lack of English should be addressed
      within a learning programme that reflects the child's existing skills.
    excerpt_type: paraphrase
    fetched_url: https://www.gov.scot/publications/supporting-childrens-learning-statutory-guidance-education-additional-support-learning-scotland/pages/3/
    verified_by_fetch: true

  - id: psg-ACC-code-ch3-staged
    source_id: src-ACC-sg-asl-code-2017
    locator: "Chapter 3, paras 30 to 31"
    text: >-
      Authorities commonly use staged approaches (usually three to six stages) to resolve
      difficulties early with the least intrusive action; the Act does not prescribe a
      particular model.
    excerpt_type: paraphrase
    fetched_url: https://dera.ioe.ac.uk/id/eprint/30765/1/00529411.pdf
    verified_by_fetch: true

  - id: psg-ACC-code-ch3-iep
    source_id: src-ACC-sg-asl-code-2017
    locator: "Chapter 3, para 9"
    text: >-
      An individualised educational programme may provide more detailed planning for a
      child, usually within school, and should incorporate any educational objectives from
      a co-ordinated support plan.
    excerpt_type: paraphrase
    fetched_url: https://dera.ioe.ac.uk/id/eprint/30765/1/00529411.pdf
    verified_by_fetch: true

  - id: psg-ACC-code-ch3-girfec
    source_id: src-ACC-sg-asl-code-2017
    locator: "Chapter 3, paras 5 to 9"
    text: >-
      GIRFEC puts children's rights and wellbeing at the centre; a Child's Plan,
      coordinated by a Lead Professional where agencies are involved, can record support;
      the views of children and parents should be sought, taken into account and noted.
    excerpt_type: paraphrase
    fetched_url: https://dera.ioe.ac.uk/id/eprint/30765/1/00529411.pdf
    verified_by_fetch: true

  # --- Morgan review 2020 ---
  - id: psg-ACC-morgan-legislation
    source_id: src-ACC-morgan-review-2020-summary
    locator: "Executive summary, 'Overview of findings'"
    text: >-
      The review found no fundamental flaw in the principles of the legislation; the
      problem lies in putting them into practice, which is fragmented, inconsistent and
      overly dependent on individuals.
    excerpt_type: paraphrase
    fetched_url: https://www.gov.scot/publications/review-additional-support-learning-implementation-executive-summary/pages/3/
    verified_by_fetch: true

  - id: psg-ACC-morgan-diagnosis
    source_id: src-ACC-morgan-review-2020-summary
    locator: "Executive summary, 'Overview of findings'"
    text: >-
      Access to support is often made conditional on a diagnosis, which operates as a way
      of rationing scarce resources, and individual planning can produce plans that do not
      lead to the support they describe.
    excerpt_type: paraphrase
    fetched_url: https://www.gov.scot/publications/review-additional-support-learning-implementation-executive-summary/pages/3/
