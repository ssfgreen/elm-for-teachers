    source_id: src-ACC-morgan-review-2020-summary
    locator: "Executive summary, 'Overview of findings'"
    text: >-
      Additional support for learning is not visible or equally valued in the system,
      although around 30.9% of pupils were identified with an additional support need;
      the review calls for relationships to come before processes.
    excerpt_type: paraphrase
    fetched_url: https://www.gov.scot/publications/review-additional-support-learning-implementation-executive-summary/pages/3/
