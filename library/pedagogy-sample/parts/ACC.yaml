    evidence:
      rating: strong
      rationale: "EEF guidance report (clm-ACC-scaf-temporary)."
    relations:
      uses_principle: [prn-EVD-scaffolding]
    claims: [clm-ACC-scaf-temporary, clm-ACC-scaf-expectations, clm-ACC-scaf-five, clm-ACC-scaf-all, clm-ACC-scaf-inclusion]

claims:

  # --- format rules ---
  - id: clm-ACC-emph-bold
    entry_id: fmt-ACC-emphasis-bold
    text: "Use bold for emphasis; italics and underlining make text look crowded for many readers."
    supported_by: [psg-ACC-bda-emphasis]
    support_type: paraphrase
  - id: clm-ACC-emph-no-caps
    entry_id: fmt-ACC-emphasis-bold
    text: "Avoid writing in capitals for emphasis, especially in continuous text."
    supported_by: [psg-ACC-bda-emphasis]
    support_type: paraphrase
  - id: clm-ACC-emph-key-actions
    entry_id: fmt-ACC-emphasis-bold
    text: "Key information and actions should be made visually distinct from the surrounding text."
    supported_by: [psg-ACC-dysscot-writing]
    support_type: paraphrase

  - id: clm-ACC-align-left
    entry_id: fmt-ACC-left-aligned-ragged-right
    text: "Text should be left aligned and not justified, in a single column rather than multiple columns."
    supported_by: [psg-ACC-bda-layout, psg-ACC-dysscot-layout]
    support_type: paraphrase
  - id: clm-ACC-align-wcag
    entry_id: fmt-ACC-left-aligned-ragged-right
    text: "WCAG 2.2 advises that blocks of text are not justified and are no wider than 80 characters."
    supported_by: [psg-ACC-wcag-1-4-8]
    support_type: paraphrase
  - id: clm-ACC-line-length
    entry_id: fmt-ACC-left-aligned-ragged-right
    text: "Shorter lines, roughly 50 to 75 characters, are recommended and often help dyslexic readers."
    supported_by: [psg-ACC-dysscot-line-length, psg-ACC-bda-layout]
    support_type: paraphrase

  - id: clm-ACC-font-sans
    entry_id: fmt-ACC-readable-font-size
    text: "A plain, evenly spaced sans serif font such as Arial, Verdana or Calibri is the recommended default."
    supported_by: [psg-ACC-bda-fonts, psg-ACC-dysscot-typeface]
    support_type: paraphrase
  - id: clm-ACC-font-no-special-advantage
    entry_id: fmt-ACC-readable-font-size
    text: "No single font has been shown to be best for dyslexic readers, and specialist dyslexia fonts did not improve reading in trials."
    supported_by: [psg-ACC-dysscot-typeface, psg-ACC-wery-abstract, psg-ACC-kuster-findings]
    support_type: paraphrase
  - id: clm-ACC-font-size
    entry_id: fmt-ACC-readable-font-size
    text: "Body text should be at least 12 point, with 12 to 14 point recommended and larger text for readers who need it."
    supported_by: [psg-ACC-bda-fonts, psg-ACC-dysscot-typeface]
    support_type: paraphrase

  - id: clm-ACC-spacing-line
    entry_id: fmt-ACC-text-spacing
    text: "Line spacing of about 1.5 is recommended."
    supported_by: [psg-ACC-bda-spacing, psg-ACC-dysscot-spacing, psg-ACC-wcag-1-4-8]
    support_type: paraphrase
  - id: clm-ACC-spacing-tolerate
    entry_id: fmt-ACC-text-spacing
    text: "Digital content should keep working when users raise line height to 1.5, paragraph spacing to 2, letter spacing to 0.12 and word spacing to 0.16 times the font size."
    supported_by: [psg-ACC-wcag-1-4-12]
    support_type: paraphrase
  - id: clm-ACC-spacing-paragraph
    entry_id: fmt-ACC-text-spacing
    text: "Extra space should separate paragraphs and surround headings."
    supported_by: [psg-ACC-bda-headings, psg-ACC-dysscot-spacing]
    support_type: paraphrase

  - id: clm-ACC-clutter-white-space
    entry_id: fmt-ACC-uncluttered-white-space
    text: "Clean, uncluttered layouts that use white space to group related content are recommended."
    supported_by: [psg-ACC-bda-layout, psg-ACC-dysscot-layout]
    support_type: paraphrase
  - id: clm-ACC-clutter-plain-background
    entry_id: fmt-ACC-uncluttered-white-space
    text: "Backgrounds should be a single plain colour without patterns or pictures."
    supported_by: [psg-ACC-bda-colour]
    support_type: paraphrase
  - id: clm-ACC-clutter-sensory
    entry_id: fmt-ACC-uncluttered-white-space
    text: "Reducing visual clutter also lowers sensory load for learners who are sensitive to it."
    supported_by: [psg-ACC-at-sensory-env]
    support_type: inference_by_curator

  - id: clm-ACC-chunk-headings
    entry_id: fmt-ACC-one-task-per-block
    text: "Content should be chunked under clear headings and subheadings."
    supported_by: [psg-ACC-dysscot-layout]
    support_type: paraphrase
  - id: clm-ACC-chunk-short-sentences
    entry_id: fmt-ACC-one-task-per-block
    text: "Sentences of about 25 words or fewer and paragraphs of about five lines, with key information first, are recommended."
    supported_by: [psg-ACC-dysscot-writing]
    support_type: paraphrase
  - id: clm-ACC-chunk-small-steps
    entry_id: fmt-ACC-one-task-per-block
    text: "Breaking tasks and teaching into small steps is part of explicit instruction for pupils with SEND."
    supported_by: [psg-ACC-eef-explicit, psg-ACC-eef-small-steps]
    support_type: paraphrase
  - id: clm-ACC-chunk-one-at-a-time
    entry_id: fmt-ACC-one-task-per-block
    text: "Giving one piece of information or one instruction at a time helps pupils with communication needs."
    supported_by: [psg-ACC-nas-chunk, psg-ACC-dld-instructions]
    support_type: paraphrase

  - id: clm-ACC-plain-active
    entry_id: fmt-ACC-plain-language-instructions
    text: "Instructions should use the active voice and plain everyday words, without double negatives."
    supported_by: [psg-ACC-bda-writing]
    support_type: paraphrase
  - id: clm-ACC-plain-lists
    entry_id: fmt-ACC-plain-language-instructions
    text: "Numbered lists and bullet points are preferable to continuous prose for procedures."
    supported_by: [psg-ACC-bda-lists-images]
    support_type: paraphrase
  - id: clm-ACC-plain-positive
    entry_id: fmt-ACC-plain-language-instructions
    text: "Telling pupils what to do is clearer than telling them what not to do."
    supported_by: [psg-ACC-nas-positive-alt]
    support_type: paraphrase
  - id: clm-ACC-plain-labels
    entry_id: fmt-ACC-plain-language-instructions
    text: "Every place where a pupil must respond should carry a label or instruction."
    supported_by: [psg-ACC-wcag-3-3-2]
    support_type: paraphrase
  - id: clm-ACC-plain-unambiguous
    entry_id: fmt-ACC-plain-language-instructions
    text: "Explicit instruction for pupils with SEND uses clear and unambiguous language."
    supported_by: [psg-ACC-eef-explicit]
    support_type: paraphrase

  - id: clm-ACC-colour-contrast
    entry_id: fmt-ACC-colour-contrast-background
    text: "Body text should have a contrast ratio of at least 4.5:1 with its background (3:1 for large text)."
    supported_by: [psg-ACC-wcag-1-4-3, psg-ACC-dysscot-background]
    support_type: paraphrase
  - id: clm-ACC-colour-not-white
    entry_id: fmt-ACC-colour-contrast-background
    text: "Dark text on an off-white or cream background is preferred to stark white."
    supported_by: [psg-ACC-bda-colour, psg-ACC-dysscot-background]
    support_type: paraphrase
  - id: clm-ACC-colour-not-sole
    entry_id: fmt-ACC-colour-contrast-background
    text: "Colour must never be the only way information or an action is signalled."
    supported_by: [psg-ACC-wcag-1-4-1]
    support_type: paraphrase
  - id: clm-ACC-colour-red-green
    entry_id: fmt-ACC-colour-contrast-background
    text: "Green with red or pink should be avoided because these are hard to tell apart for people with colour vision deficiency."
    supported_by: [psg-ACC-bda-colour]
    support_type: paraphrase

  - id: clm-ACC-head-size
    entry_id: fmt-ACC-heading-hierarchy
    text: "Headings should be at least 20% larger than body text, bold, and never smaller than body text."
    supported_by: [psg-ACC-bda-headings, psg-ACC-dysscot-layout]
    support_type: paraphrase
  - id: clm-ACC-head-styles
    entry_id: fmt-ACC-heading-hierarchy
    text: "Headings should be created with built-in heading styles so their structure is available to assistive technology."
    supported_by: [psg-ACC-bda-headings, psg-ACC-wcag-1-3-1]
    support_type: paraphrase
  - id: clm-ACC-head-descriptive
    entry_id: fmt-ACC-heading-hierarchy
    text: "Headings and labels should describe the topic or purpose of the content."
    supported_by: [psg-ACC-wcag-2-4-6]
    support_type: paraphrase
  - id: clm-ACC-head-consistent
    entry_id: fmt-ACC-heading-hierarchy
    text: "Elements that do the same job should be identified the same way throughout a set of materials."
    supported_by: [psg-ACC-wcag-3-2-4]
    support_type: direct_quote

  - id: clm-ACC-slides-sparse
    entry_id: fmt-ACC-accessible-slides
    text: "Slides should use text sparingly at a large size, with 32 point suggested as a minimum."
    supported_by: [psg-ACC-dysscot-slides-formats]
    support_type: paraphrase
  - id: clm-ACC-slides-alt-text
    entry_id: fmt-ACC-accessible-slides
    text: "Meaningful images need a text alternative; purely decorative images do not."
    supported_by: [psg-ACC-wcag-1-1-1]
    support_type: paraphrase
  - id: clm-ACC-slides-formats
    entry_id: fmt-ACC-accessible-slides
    text: "Offering materials in customisable formats that work with text-to-speech is recommended."
    supported_by: [psg-ACC-dysscot-slides-formats]
    support_type: paraphrase
  - id: clm-ACC-slides-dual
    entry_id: fmt-ACC-accessible-slides
    text: "Text should be supported with images, diagrams and flow charts."
    supported_by: [psg-ACC-bda-lists-images, psg-ACC-dysscot-slides-formats]
    support_type: paraphrase

  # --- adaptations ---
  - id: clm-ACC-tts-scottish-voice
    entry_id: adp-ACC-text-to-speech
    text: "Scottish-accented computer voices for reading resources aloud are free to the Scottish public sector through CALL Scotland."
    supported_by: [psg-ACC-scotvoice]
    support_type: paraphrase
  - id: clm-ACC-tts-call-tools
    entry_id: adp-ACC-text-to-speech
    text: "CALL Scotland provides free text-to-speech and literacy support tools and accessible curriculum books for Scottish learners."
    supported_by: [psg-ACC-call-resources]
    support_type: paraphrase
  - id: clm-ACC-tts-offer
    entry_id: adp-ACC-text-to-speech
    text: "Dyslexia Scotland recommends offering text-to-speech and customisable formats."
    supported_by: [psg-ACC-dysscot-slides-formats]
    support_type: paraphrase
  - id: clm-ACC-tts-technology
    entry_id: adp-ACC-text-to-speech
    text: "Using technology to support access is one of the EEF's five recommended classroom strategies for pupils with SEND."
    supported_by: [psg-ACC-eef-five-strategies, psg-ACC-eef-technology]
    support_type: paraphrase

  - id: clm-ACC-spacing-zorzi
    entry_id: adp-ACC-individual-spacing-background
    text: "Increasing letter spacing improved text reading in a large sample of Italian and French children with dyslexia, without any training."
    supported_by: [psg-ACC-zorzi-abstract]
    support_type: paraphrase
  - id: clm-ACC-spacing-preference
    entry_id: adp-ACC-individual-spacing-background
    text: "Wider letter and word spacing should be adjusted to the individual reader's preference, avoiding excessive gaps."
    supported_by: [psg-ACC-dysscot-spacing, psg-ACC-bda-spacing]
    support_type: paraphrase
  - id: clm-ACC-spacing-not-font
    entry_id: adp-ACC-individual-spacing-background
    text: "Spacing, rather than letter shape, may explain benefits once attributed to dyslexia fonts."
    supported_by: [psg-ACC-kuster-spacing]
    support_type: paraphrase
  - id: clm-ACC-bg-preference
    entry_id: adp-ACC-individual-spacing-background
    text: "Background colour preferences vary between readers; some prefer tinted or lower-contrast combinations."
    supported_by: [psg-ACC-dysscot-background]
    support_type: paraphrase

  - id: clm-ACC-font-preference-ok
    entry_id: adp-ACC-preferred-font
    text: "Readers may use a preferred font, including a specialist one, if they find it helpful, but most children in one trial preferred standard fonts."
    supported_by: [psg-ACC-dysscot-typeface, psg-ACC-kuster-findings]
    support_type: paraphrase
  - id: clm-ACC-font-opendyslexic
    entry_id: cau-ACC-dyslexia-fonts
    text: "OpenDyslexic produced no gains in reading rate or accuracy compared with Arial or Times New Roman in a small study of pupils with dyslexia."
    supported_by: [psg-ACC-wery-abstract]
    support_type: paraphrase
  - id: clm-ACC-font-dyslexie
    entry_id: cau-ACC-dyslexia-fonts
    text: "The Dyslexie font did not improve reading speed or accuracy for children with or without dyslexia."
    supported_by: [psg-ACC-kuster-findings]
    support_type: paraphrase
  - id: clm-ACC-font-spacing-confound
    entry_id: cau-ACC-dyslexia-fonts
    text: "Apparent advantages of dyslexia fonts may be due to their wider spacing rather than their letter shapes."
    supported_by: [psg-ACC-kuster-spacing, psg-ACC-zorzi-abstract]
    support_type: inference_by_curator

  - id: clm-ACC-vocab-eef
    entry_id: adp-ACC-pre-taught-vocab-word-bank
    text: "Pre-teaching vocabulary is given by the EEF as an example of responding to identified needs."
    supported_by: [psg-ACC-eef-vocab]
    support_type: paraphrase
  - id: clm-ACC-vocab-dld
    entry_id: adp-ACC-pre-taught-vocab-word-bank
    text: "Pupils with developmental language disorder do not pick up new words incidentally and benefit from explicit teaching of key subject vocabulary."
    supported_by: [psg-ACC-dld-vocab]
    support_type: paraphrase
  - id: clm-ACC-vocab-wordbank
    entry_id: adp-ACC-pre-taught-vocab-word-bank
    text: "For EAL learners, key words can be pre-taught with visuals and word banks kept to hand during writing."
    supported_by: [psg-ACC-abd-visuals-vocab]
    support_type: paraphrase
  - id: clm-ACC-vocab-glossary
    entry_id: adp-ACC-pre-taught-vocab-word-bank
    text: "A glossary of jargon and abbreviations supports readers."
    supported_by: [psg-ACC-bda-writing]
    support_type: paraphrase

  - id: clm-ACC-img-eal
    entry_id: adp-ACC-images-with-vocabulary
    text: "Visuals, pictorial flashcards and visual dictionaries support EAL learners with new vocabulary."
    supported_by: [psg-ACC-abd-visuals-vocab]
    support_type: paraphrase
  - id: clm-ACC-img-dld
    entry_id: adp-ACC-images-with-vocabulary
    text: "Pictures on worksheets and other visual prompts support memory and understanding for pupils with language difficulties."
    supported_by: [psg-ACC-dld-visual, psg-ACC-nas-visual]
    support_type: paraphrase
  - id: clm-ACC-img-labels
    entry_id: adp-ACC-images-with-vocabulary
    text: "Clear labels and visual supports help learners with language and communication difficulties and learners of English as an additional language."
    supported_by: [psg-ACC-at-incl-universal]
    support_type: paraphrase
  - id: clm-ACC-img-alt
    entry_id: adp-ACC-images-with-vocabulary
    text: "Images that carry meaning in digital materials need a text alternative."
    supported_by: [psg-ACC-wcag-1-1-1]
    support_type: paraphrase

  - id: clm-ACC-literal-overliteral
    entry_id: adp-ACC-literal-language
    text: "Autistic learners can interpret language literally and may miss meaning that differs from the words said."
    supported_by: [psg-ACC-at-comm-literal]
    support_type: paraphrase
  - id: clm-ACC-literal-idioms
    entry_id: adp-ACC-literal-language
    text: "Figurative phrases and vague words about time or size can be misunderstood, so realistic, exact timings help."
    supported_by: [psg-ACC-nas-figurative]
    support_type: paraphrase
  - id: clm-ACC-literal-dld
    entry_id: adp-ACC-literal-language
    text: "Pupils with developmental language disorder often struggle with idioms and metaphors, so instructions should be literal."
    supported_by: [psg-ACC-dld-instructions]
    support_type: paraphrase
  - id: clm-ACC-literal-teach
    entry_id: adp-ACC-literal-language
    text: "Where figurative language is part of the learning, explaining it explicitly is preferable to removing it."
    supported_by: [psg-ACC-nas-figurative, psg-ACC-eef-explicit, psg-ACC-eef-high-expectations]
    support_type: inference_by_curator

  - id: clm-ACC-sched-benefit
    entry_id: adp-ACC-visual-schedule
    text: "Autistic learners are likely to benefit from visual supports matched to their developmental stage."
    supported_by: [psg-ACC-at-visual-quote]
    support_type: direct_quote
  - id: clm-ACC-sched-purposes
    entry_id: adp-ACC-visual-schedule
    text: "Visual timetables and schedules provide predictability, reduce anxiety and build independence, and work best when used consistently."
    supported_by: [psg-ACC-at-visual-purposes]
    support_type: paraphrase
  - id: clm-ACC-sched-universal
    entry_id: adp-ACC-visual-schedule
    text: "Visual timetables are listed as a universal support in Scottish staged intervention."
    supported_by: [psg-ACC-at-universal-supports, psg-ACC-at-sensory-breaks]
    support_type: paraphrase
  - id: clm-ACC-sched-predictable
    entry_id: adp-ACC-visual-schedule
    text: "Making the learning day predictable and planning adjustments in advance are key messages for inclusive classrooms."
    supported_by: [psg-ACC-at-incl-universal]
    support_type: paraphrase
  - id: clm-ACC-sched-timings
    entry_id: adp-ACC-visual-schedule
    text: "Give realistic timings and keep to them."
    supported_by: [psg-ACC-nas-figurative]
    support_type: paraphrase

  - id: clm-ACC-steps-lists
    entry_id: adp-ACC-numbered-steps-with-model
    text: "Numbered lists and flow charts make procedures easier to follow than continuous prose."
    supported_by: [psg-ACC-bda-lists-images]
    support_type: paraphrase
  - id: clm-ACC-steps-checklist
    entry_id: adp-ACC-numbered-steps-with-model
    text: "Task checklists are an example of a visual scaffold for pupils with SEND."
    supported_by: [psg-ACC-eef-scaffolding]
    support_type: paraphrase
  - id: clm-ACC-steps-model
    entry_id: adp-ACC-numbered-steps-with-model
    text: "Demonstrating and modelling a task before guided and independent practice is central to explicit instruction."
    supported_by: [psg-ACC-eef-explicit, psg-ACC-abd-frames]
    support_type: paraphrase
  - id: clm-ACC-steps-one-action
    entry_id: adp-ACC-numbered-steps-with-model
    text: "Several spoken instructions given together are hard for some learners to organise, so give one at a time in the order they happen."
    supported_by: [psg-ACC-dld-instructions, psg-ACC-at-comm-time]
    support_type: paraphrase

  - id: clm-ACC-resp-alternatives
    entry_id: adp-ACC-alternative-response-modes
    text: "Writing or pictures can be accepted as alternatives to speech, and different ways of communicating should be validated."
    supported_by: [psg-ACC-nas-positive-alt]
    support_type: paraphrase
  - id: clm-ACC-resp-technology
    entry_id: adp-ACC-alternative-response-modes
    text: "Technology such as note-taking and speech-generating apps can support pupils with SEND to respond and communicate."
    supported_by: [psg-ACC-eef-technology]
    support_type: paraphrase
  - id: clm-ACC-resp-goal-check
    entry_id: adp-ACC-alternative-response-modes
    text: "Before changing the response mode, check whether the response mode itself is what is being taught or assessed, to keep expectations high."
    supported_by: [psg-ACC-eef-high-expectations]
    support_type: inference_by_curator

  - id: clm-ACC-time-wait
    entry_id: adp-ACC-extra-processing-time
    text: "Pause for at least ten seconds after a question or instruction without adding words, and repeat using the same words."
    supported_by: [psg-ACC-nas-processing]
    support_type: paraphrase
  - id: clm-ACC-time-respond
    entry_id: adp-ACC-extra-processing-time
    text: "Some learners struggle to respond in the expected time, so adults should allow time and wait."
    supported_by: [psg-ACC-at-comm-time]
    support_type: paraphrase
  - id: clm-ACC-time-dld
    entry_id: adp-ACC-extra-processing-time
    text: "Pupils with language difficulties need extra time both to understand instructions and to put answers into words."
    supported_by: [psg-ACC-dld-time-check]
    support_type: paraphrase

  - id: clm-ACC-warn-name
    entry_id: adp-ACC-warned-questioning
    text: "Using the pupil's name first lets them know they are being addressed."
    supported_by: [psg-ACC-nas-name-first]
    support_type: paraphrase
  - id: clm-ACC-warn-questions
    entry_id: adp-ACC-warned-questioning
    text: "Questions should be clear, direct and limited in number, with limited choices offered where possible."
    supported_by: [psg-ACC-nas-questions]
    support_type: paraphrase
  - id: clm-ACC-warn-wait
    entry_id: adp-ACC-warned-questioning
    text: "Processing time after a question should not be filled with more talk."
    supported_by: [psg-ACC-nas-processing]
    support_type: paraphrase
  - id: clm-ACC-warn-advance
    entry_id: adp-ACC-warned-questioning
    text: "Telling an anxious pupil in advance what they will be asked is a reasonable extension of guidance to reduce demands and allow time when learners are anxious."
    supported_by: [psg-ACC-at-comm-time, psg-ACC-nas-processing]
    support_type: inference_by_curator

  - id: clm-ACC-roles-scripts
    entry_id: adp-ACC-defined-group-roles
    text: "Clear roles and scripts are a reasonable adjustment for autistic learners in group work."
    supported_by: [psg-ACC-at-comm-groups]
    support_type: paraphrase
  - id: clm-ACC-roles-visual
    entry_id: adp-ACC-defined-group-roles
    text: "Visual supports can help peer interaction during group work."
    supported_by: [psg-ACC-at-comm-groups]
    support_type: paraphrase
  - id: clm-ACC-roles-flexible
    entry_id: adp-ACC-defined-group-roles
    text: "Groupings should be flexible and temporary, formed around a shared need and disbanded when done."
    supported_by: [psg-ACC-eef-flexible-grouping]
    support_type: paraphrase

  - id: clm-ACC-lowstim-clutter
    entry_id: adp-ACC-low-stimulus-slides
    text: "Reducing visual clutter and softening the sensory environment helps learners who are sensitive to sensory input."
    supported_by: [psg-ACC-at-sensory-env]
    support_type: paraphrase
  - id: clm-ACC-lowstim-background
    entry_id: adp-ACC-low-stimulus-slides
    text: "Plain backgrounds without patterns or pictures are recommended."
    supported_by: [psg-ACC-bda-colour]
    support_type: paraphrase
  - id: clm-ACC-lowstim-sparse
    entry_id: adp-ACC-low-stimulus-slides
    text: "Slides should carry little text."
    supported_by: [psg-ACC-dysscot-slides-formats]
    support_type: paraphrase

  - id: clm-ACC-chunkread-check
    entry_id: adp-ACC-chunked-reading-checks
    text: "Information should be given in small chunks with understanding checked before moving on."
    supported_by: [psg-ACC-nas-chunk]
    support_type: paraphrase
  - id: clm-ACC-chunkread-steps
    entry_id: adp-ACC-chunked-reading-checks
    text: "Teaching in small steps is a feature of explicit instruction for pupils with SEND."
    supported_by: [psg-ACC-eef-explicit]
    support_type: paraphrase
  - id: clm-ACC-chunkread-recap
    entry_id: adp-ACC-chunked-reading-checks
