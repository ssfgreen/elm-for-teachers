    type: adaptation
    title: "Repeat, check back and leave instructions visible"
    summary: "Repeat instructions in the same words, ask the pupil to say them back, and keep them written up."
    body: |
      After giving instructions, check one or two pupils can say them back. If repeating, keep the same wording. Leave the numbered steps on the board or desk for the whole task.
