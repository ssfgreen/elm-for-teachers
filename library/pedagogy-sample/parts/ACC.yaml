  - id: adp-ACC-lower-reading-level-version
    type: adaptation
    title: "Lower reading-level version of a text"
    summary: "Provide a version of a text in simpler language alongside the original. Flags as a possible change to the goal."
    body: |
      Rewrite with shorter sentences, common words and key terms kept and glossed. In S1 history, where the goal is historical understanding, this is usually access only. In P7 English, where reading that text is the goal, it modifies the task: use it as a pre-read before the original, not a replacement. Flagged changes_goal true so a teacher must decide.
