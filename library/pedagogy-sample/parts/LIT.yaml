passages:
  # --- EEF KS2 guidance -----------------------------------------------------
  - id: psg-LIT-eefks2-recs
    source_id: src-LIT-eef-ks2-literacy
    locator: "EEF news release 'EEF publishes updated Key Stage 2 literacy guidance', list of recommendations"
    excerpt_type: paraphrase
    text: >-
      The guidance makes seven recommendations: develop pupils' language; support fluent
      reading; teach comprehension strategies through modelling and guided practice; teach
      writing composition strategies the same way; build transcription and sentence
      construction through regular practice; target teaching through accurate assessment;
      and use high-quality structured interventions for struggling pupils. The second
      edition keeps the recommendations and adds models and classroom examples.
    fetched_url: https://educationendowmentfoundation.org.uk/news/eef-publishes-updated-key-stage-2-literacy-guidance
    verified_by_fetch: true

  - id: psg-LIT-eefks2-tier2-quote
    source_id: src-LIT-eef-ks2-literacy
    locator: "p.16, Recommendation 1, Figure 3 (tiers of vocabulary)"
    excerpt_type: quote
    text: "Explicit teaching may best focus on Tier 2 words."
    fetched_url: https://159-northumberland.eschools.co.uk/storage/secure_download/OGZVU2RRTjRkMnJoRitzeFh2cUtpUT09
    verified_by_fetch: true

  - id: psg-LIT-eefks2-vocab-method
    source_id: src-LIT-eef-ks2-literacy
    locator: "p.16, Recommendation 1 (vocabulary)"
    excerpt_type: paraphrase
    text: >-
      Tier 2 words are ambitious words met across many subjects; Tier 3 words are less
      common and topic-specific. The report advises pre-teaching new words that support
      comprehension, giving repeated encounters in speaking, reading and writing, and
      having pupils use new words actively.
    fetched_url: https://159-northumberland.eschools.co.uk/storage/secure_download/OGZVU2RRTjRkMnJoRitzeFh2cUtpUT09
    verified_by_fetch: true

  - id: psg-LIT-eefks2-fluency-gor
    source_id: src-LIT-eef-ks2-literacy
    locator: "p.19, Recommendation 2 (fluent reading)"
    excerpt_type: paraphrase
    text: >-
      In guided oral reading an adult or peer models fluent reading of a passage, then
      pupils read the same text aloud and receive feedback. In repeated reading pupils
      re-read a short, meaningful passage a set number of times or until they reach a
      suitable level of fluency.
    fetched_url: https://159-northumberland.eschools.co.uk/storage/secure_download/OGZVU2RRTjRkMnJoRitzeFh2cUtpUT09
    verified_by_fetch: true

  - id: psg-LIT-eefks2-readers-theatre
    source_id: src-LIT-eef-ks2-literacy
    locator: "pp.19-20, Recommendation 2, Figure 6 (Reader's Theatre)"
    excerpt_type: paraphrase
    text: >-
      Figure 6 gives a nine-step guide to Reader's Theatre that moves from adult modelling
      and echo reading of a script, through paired and group rehearsal, to performance and
      reflection.
    fetched_url: https://159-northumberland.eschools.co.uk/storage/secure_download/OGZVU2RRTjRkMnJoRitzeFh2cUtpUT09
    verified_by_fetch: true

  - id: psg-LIT-eefks2-comp-strategies
    source_id: src-LIT-eef-ks2-literacy
    locator: "pp.23-24 and p.26 (Figure 9), Recommendation 3"
    excerpt_type: paraphrase
    text: >-
      Pupils should be taught prediction, questioning, clarifying, summarising and
      activating prior knowledge. Each strategy is modelled and then practised until
      embedded, with a gradual release model shifting responsibility from teacher to pupil.
    fetched_url: https://159-northumberland.eschools.co.uk/storage/secure_download/OGZVU2RRTjRkMnJoRitzeFh2cUtpUT09
    verified_by_fetch: true

  - id: psg-LIT-eefks2-reciprocal-box4
    source_id: src-LIT-eef-ks2-literacy
    locator: "p.25, Box 4 (Reciprocal Reading)"
    excerpt_type: paraphrase
    text: >-
      Box 4 describes a 12-week Reciprocal Reading programme teaching predict, clarify,
      question and summarise. In the EEF trial the targeted version, delivered by teaching
      assistants to small groups of Year 5 and 6 pupils, improved reading comprehension
      and overall reading, but the whole-class version in Year 4 did no better than usual
      provision.
    fetched_url: https://159-northumberland.eschools.co.uk/storage/secure_download/OGZVU2RRTjRkMnJoRitzeFh2cUtpUT09
    verified_by_fetch: true

  - id: psg-LIT-eefks2-writing-stages
    source_id: src-LIT-eef-ks2-literacy
    locator: "pp.30-31, Recommendation 4 (writing composition)"
    excerpt_type: paraphrase
    text: >-
      Writing is presented in five stages: planning, drafting, revising, editing and
      publishing. Strategies for each are taught by gradual release: the teacher explains
      how and when to use a strategy, then models it. Shared writing lets the teacher
      think aloud. The process is not strictly linear, so aspects may need re-modelling.
    fetched_url: https://159-northumberland.eschools.co.uk/storage/secure_download/OGZVU2RRTjRkMnJoRitzeFh2cUtpUT09
    verified_by_fetch: true

  - id: psg-LIT-eefks2-self-reg
    source_id: src-LIT-eef-ks2-literacy
    locator: "pp.29-30, Recommendation 4 (Simple View of Writing; planning and revising)"
    excerpt_type: paraphrase
    text: >-
      Self-regulation, planning and monitoring are treated as essential to writing.
      Suggested moves include pupils writing goals to refer back to, drafting checklists
      that pupils eventually create themselves, and re-reading to check whether goals are
      met. Over time pupils should take more responsibility for choosing strategies.
    fetched_url: https://159-northumberland.eschools.co.uk/storage/secure_download/OGZVU2RRTjRkMnJoRitzeFh2cUtpUT09
    verified_by_fetch: true

  - id: psg-LIT-eefks2-sentence-combining
    source_id: src-LIT-eef-ks2-literacy
    locator: "p.37, Recommendation 5 (sentence construction)"
    excerpt_type: paraphrase
    text: >-
      Sentence combining joins simple sentences into a more complex one (for example two
      short sentences joined with a 'because' clause); sentence expanding adds detail such
      as an adjective or adverb. The teacher models first, then pupils practise together
      and independently.
    fetched_url: https://159-northumberland.eschools.co.uk/storage/secure_download/OGZVU2RRTjRkMnJoRitzeFh2cUtpUT09
    verified_by_fetch: true

  - id: psg-LIT-eefks2-talk
    source_id: src-LIT-eef-ks2-literacy
    locator: "pp.13-14, Recommendation 1 (speaking and listening; Box 1)"
    excerpt_type: paraphrase
    text: >-
      Speaking and listening underpin reading and writing, and pupils should articulate
      ideas orally before writing. Quality talk uses open questions, probing follow-ups,
      building on answers and ensuring every pupil is heard. Structured approaches with
      well-designed tasks are reported to give the largest gains; Box 1 gives a jigsaw
      group example.
    fetched_url: https://159-northumberland.eschools.co.uk/storage/secure_download/OGZVU2RRTjRkMnJoRitzeFh2cUtpUT09
    verified_by_fetch: true

  - id: psg-LIT-eefks2-motivation
    source_id: src-LIT-eef-ks2-literacy
    locator: "p.15, Recommendation 1 (motivation and engagement; Box 2)"
    excerpt_type: paraphrase
    text: >-
      Reading motivation is linked to a school culture that puts reading and discussion
      of texts at its centre. Box 2 describes the PEER framework and CROWD prompts for
      dialogue during shared reading.
    fetched_url: https://159-northumberland.eschools.co.uk/storage/secure_download/OGZVU2RRTjRkMnJoRitzeFh2cUtpUT09
    verified_by_fetch: true

  # --- EEF Toolkit ----------------------------------------------------------
  - id: psg-LIT-eeftk-rcs-impact
    source_id: src-LIT-eef-toolkit-reading-comprehension
    locator: "Headline summary and 'Key findings'"
    excerpt_type: paraphrase
    text: >-
      Reading comprehension strategies are estimated at about seven months' additional
      progress for very low cost, with moderate evidence security (184 studies). They are
      usually taught through explicit instruction and modelling of how an expert reader
      uses them, aiming for pupils to apply them automatically and independently.
    fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/reading-comprehension-strategies
    verified_by_fetch: true

  - id: psg-LIT-eeftk-rcs-text-quote
    source_id: src-LIT-eef-toolkit-reading-comprehension
    locator: "UNCONFIRMED: main page body, paragraph on choosing texts"
    excerpt_type: quote
    text: "effective, but not overwhelming"
    fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/reading-comprehension-strategies
    verified_by_fetch: true

  - id: psg-LIT-eeftk-rcs-caution
    source_id: src-LIT-eef-toolkit-reading-comprehension
    locator: "UNCONFIRMED: 'Key findings' and evidence-strength notes"
    excerpt_type: paraphrase
    text: >-
      Strategies should be applied across tasks and subjects, not only practised in
      isolation. For whole-class teaching, more sustained and frequent teaching appears
      better. Some studies were not independently evaluated, so the average impact should
      be read with care.
    fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/reading-comprehension-strategies
    verified_by_fetch: true

  - id: psg-LIT-eeftk-oral-impact
    source_id: src-LIT-eef-toolkit-oral-language
    locator: "Headline summary and 'Key findings'"
    excerpt_type: paraphrase
    text: >-
      Oral language interventions are estimated at about six months' additional progress
      for very low cost, with high evidence security (188 studies). The strongest effects
      come from approaches integrated with the curriculum, especially literacy, and most
      outcomes measured are reading comprehension.
    fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/oral-language-interventions
    verified_by_fetch: true

  - id: psg-LIT-eeftk-oral-structured-quote
    source_id: src-LIT-eef-toolkit-oral-language
    locator: "UNCONFIRMED: section 'What is it?' list of approaches"
    excerpt_type: quote
    text: "structured questioning to develop reading comprehension"
    fetched_url: https://educationendowmentfoundation.org.uk/education-evidence/teaching-learning-toolkit/oral-language-interventions
    verified_by_fetch: true

  - id: psg-LIT-eeftk-oral-vocab
    source_id: src-LIT-eef-toolkit-oral-language
