      knowledge_type: [procedural]
      expertise: [novice, developing]
      artefact_type: [slides, worksheet, lesson_plan, interaction]
    evidence:
      rating: moderate
      rationale: "Fluency is an EEF KS2 recommendation with guided oral reading and repeated reading described as core practices (clm-LIT-flu-gor)."
    prerequisites: ["Pupils can decode most words in the passage"]
    risks:
      - "Unguided repetition can reduce engagement; always link expression to meaning."
      - "Reading aloud can cause anxiety; allow rehearsal in pairs before any audience."
