  # --- Tell Me ---------------------------------------------------------------
  - id: psg-LIT-chambers-quote
    source_id: src-LIT-chambers-tell-me
    locator: "Part Two, Chapter 25 'Why Tell me?', pp.137-138"
    excerpt_type: quote
    text: "conversational glottal stop"
    fetched_url: https://aidanchambers.co.uk/tellme.pdf
    verified_by_fetch: true

  - id: psg-LIT-chambers-why
    source_id: src-LIT-chambers-tell-me
    locator: "Part Two, Chapter 25 'Why Tell me?', pp.137-138"
    excerpt_type: paraphrase
    text: >-
      Chambers avoids asking 'Why?' because it can sound like an interrogation or test,
      demands a complete explanation at once and gives no specific detail to start from,
      so children fall back on words like 'boring'. 'Tell me' signals genuine interest in
      the reader's view and invites conversation.
    fetched_url: https://aidanchambers.co.uk/tellme.pdf
    verified_by_fetch: true

  - id: psg-LIT-chambers-sharings
    source_id: src-LIT-chambers-tell-me
    locator: "Part Two, Chapter 20 'The Three Sharings', p.104"
    excerpt_type: paraphrase
    text: >-
      Booktalk is organised as three sharings: sharing enthusiasms (likes and dislikes),
      sharing puzzles (what confused readers, where meaning is negotiated) and sharing
      connections (patterns within the text, to other texts and to the reader's life).
    fetched_url: https://aidanchambers.co.uk/tellme.pdf
    verified_by_fetch: true

  - id: psg-LIT-chambers-framework
    source_id: src-LIT-chambers-tell-me
    locator: "Part Two, Chapter 31 'The Framework of Tell me Questions', p.178"
    excerpt_type: paraphrase
    text: >-
      The four basic questions ask what readers liked, what they disliked, what puzzled
      them and what patterns or connections they noticed. Experienced groups often move
      straight to puzzles and patterns.
    fetched_url: https://aidanchambers.co.uk/tellme.pdf
    verified_by_fetch: true

  - id: psg-LIT-vic-tellme-run
    source_id: src-LIT-vic-tell-me
    locator: "Section 'How to use this strategy'"
    excerpt_type: paraphrase
    text: >-
      Teachers use the questions as prompts rather than a checklist, allow thinking time,
      model a response only if pupils are unsure and hold back their own opinions so they
      do not carry special authority. Sentence starters and words for possibility and
      certainty support pupils' talk.
    fetched_url: https://www.education.vic.gov.au/Documents/school/teachers/teachingresources/diversity/eal/continuum/tellme.pdf
    verified_by_fetch: true

