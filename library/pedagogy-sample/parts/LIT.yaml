  # --- Close reading ----------------------------------------------------------
  - id: psg-LIT-ff12-features
    source_id: src-LIT-fisher-frey-2012
    locator: "pp.180-182 and p.185 (question categories figure)"
    excerpt_type: paraphrase
    text: >-
      Close reading uses short, complex passages (often at or above grade level), limited
      frontloading, several rereadings each with a new purpose, text-dependent questions
      that require evidence from the text, annotation, and partner or small-group
      discussion. Question types run from general understanding and key details through
      vocabulary and structure and author's purpose to inference and opinion.
    fetched_url: https://s3-us-west-1.amazonaws.com/fisher-and-frey/documents/close_reading_elem.pdf
    verified_by_fetch: true

  - id: psg-LIT-ff12-cautions
    source_id: src-LIT-fisher-frey-2012
    locator: "p.180 and pp.180-181, 187"
    excerpt_type: paraphrase
    text: >-
      Close reading should sit alongside read-alouds, modelling, guided reading,
      discussion and independent reading, not replace them, and not every text warrants
      it. The findings come from an early, small study (14 primary teachers and
      observations in secondary classrooms).
    fetched_url: https://s3-us-west-1.amazonaws.com/fisher-and-frey/documents/close_reading_elem.pdf
    verified_by_fetch: true

  - id: psg-LIT-ff15-evidence
    source_id: src-LIT-fisher-frey-2015
    locator: "p.57"
    excerpt_type: paraphrase
    text: >-
      The authors acknowledge little agreement on the essential components of close
      reading or on whether it works, with some critics calling it untested; early
      studies with older struggling readers and younger pupils are cited as promising.
    fetched_url: https://www.readinghalloffame.org/sites/default/files/kappan_close_read.pdf
    verified_by_fetch: true

  - id: psg-LIT-ff15-annotation
    source_id: src-LIT-fisher-frey-2015
    locator: "pp.59-60 (rereading and annotating; action after reading)"
    excerpt_type: paraphrase
    text: >-
      Three annotation marks are suggested: underline key ideas, circle unclear words and
      write margin notes in your own words. Close reading should lead on to writing,
      debate, investigation or presentation.
    fetched_url: https://www.readinghalloffame.org/sites/default/files/kappan_close_read.pdf
    verified_by_fetch: true

