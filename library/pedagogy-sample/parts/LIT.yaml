    locator: "Page 7, opening section on the Frayer Model"
    excerpt_type: paraphrase
    text: >-
      The Frayer Model is a graphic organiser for key terms central to a unit: the term
      sits in the centre surrounded by four boxes for definition, characteristics,
      examples and non-examples. Initial teaching is teacher-directed with the teacher
      modelling their thinking.
    fetched_url: https://iris.peabody.vanderbilt.edu/module/sec-rdng/cresource/q2/p07/
