      knowledge_type: [procedural, metacognitive]
      expertise: [novice, developing]
      artefact_type: [slides, lesson_plan, interaction]
    evidence:
      rating: moderate
      rationale: "EEF KS2 recommends modelling writing strategies with think-aloud through gradual release (clm-LIT-msw-gradual)."
    prerequisites: ["Pupils know the purpose and audience of the text type"]
    risks:
      - "Showing a finished model without the thinking gives pupils less to copy than live composition."
