    excerpt_type: paraphrase
    text: >-
      Reading for pleasure pedagogy is set out as four elements: social reading
      environments; reading aloud; independent reading time; and informal book talk,
      inside-text talk and recommendations. Teachers are framed as Reading Teachers,
      teachers who read and readers who teach.
