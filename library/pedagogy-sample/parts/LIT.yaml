  # 4 ---------------------------------------------------------------------------
  - id: act-LIT-fluency-guided-repeated-reading
    type: activity_type
    title: "Fluency practice: guided oral reading, repeated, echo and paired reading"
    summary: >-
      An adult or peer models a short passage, pupils echo and re-read it aloud with
      feedback until it is accurate, well paced and expressive.
    body: |
      **Routine (10 to 15 minutes, several times a week).**
      1. Choose a short, meaningful passage (around 150 to 250 words) from the class text.
      2. Teacher reads it aloud fluently, drawing attention to phrasing and expression.
      3. Echo reading: pupils repeat sentence by sentence.
      4. Paired repeated reading: partners take turns re-reading, giving one specific piece of feedback.
      5. Final read focusing on meaning: "What does the way you read it show about the character?"

      Keep the purpose meaningful (performance, recording, reading to younger pupils).
    status: draft
    version: "0.1"
    curated_by: [agent-LIT]
    reviewed_by: []
