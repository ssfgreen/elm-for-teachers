  - id: sig-LIT-tell-me-booktalk
    type: signature_pedagogy
    title: "Book talk with Aidan Chambers' 'Tell me' framework"
    summary: >-
      Open, genuinely curious book discussion built on likes, dislikes, puzzles and
      patterns, using 'Tell me...' rather than 'Why?'.
    body: |
      1. After reading, collect responses on four lists: likes, dislikes, puzzles, patterns.
      2. Look for links across the lists; puzzles usually drive the richest talk.
      3. Use "Tell me..." prompts ("Tell me about the part that puzzled you", "Tell me
         where you noticed that pattern") and follow up with "How do you know that?"
      4. Give thinking time; hold back your own interpretation until later.
      5. Offer stems and language of possibility (perhaps, it might be, definitely).
    status: draft
    version: "0.1"
