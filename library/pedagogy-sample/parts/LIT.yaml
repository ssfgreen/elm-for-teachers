    title: "Frayer model for key vocabulary"
    summary: >-
      A four-box organiser (definition, characteristics, examples, non-examples) used,
      with discussion, to build understanding of a concept-rich word.
    body: |
      Use for a small number of concept-rich words (for example *theme*, *persuade*,
      *metaphor*, *justice* in a class novel). Teacher models one completed Frayer with
      think-aloud, the class completes a second together, then pairs complete a third and
      justify their examples and non-examples. Supply a pupil-friendly definition on first
      use. Spread completion over more than one lesson if needed.
