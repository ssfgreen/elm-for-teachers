    source_id: src-LIT-iris-frayer
    locator: "Page 7, guided practice, independent practice and cautions sections"
    excerpt_type: paraphrase
    text: >-
      After modelling, the class discusses the definition together and the teacher guides
      the other boxes; later pupils complete boxes alone or in pairs and explain their
      reasoning. The model need not be finished in one lesson, should not be set as a
      homework worksheet because discussion is essential, and on first use the teacher
      should supply a pupil-friendly definition.
    fetched_url: https://iris.peabody.vanderbilt.edu/module/sec-rdng/cresource/q2/p07/
