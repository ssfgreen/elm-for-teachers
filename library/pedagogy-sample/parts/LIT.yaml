  - id: sig-LIT-writing-strategy-instruction
    type: signature_pedagogy
    title: "Writing process with explicit planning and revision strategies"
    summary: >-
      Teach pupils named strategies for planning, drafting, revising and editing, with
      clear product goals and checklists they gradually own.
    body: |
      1. Set specific product goals (for example "give three reasons with evidence").
      2. Teach a planning strategy (for example a boxed plan for a persuasive text) by
         modelling, then guided practice.
      3. Draft from the plan.
      4. Revise against the goals: reread, check each goal, improve one paragraph.
      5. Edit for spelling and punctuation separately from revising for meaning.
      6. Fade support: pupils write their own goals and checklists.

      Collaborative planning and peer revision partners add further benefit.
    status: draft
    version: "0.1"
