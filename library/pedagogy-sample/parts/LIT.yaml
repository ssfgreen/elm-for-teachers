entries:
  # 1 ---------------------------------------------------------------------------
  - id: sig-LIT-reciprocal-reading
    type: signature_pedagogy
    title: "Reciprocal reading (predict, question, clarify, summarise)"
    summary: >-
      Pupils learn four comprehension moves through teacher modelling, then take turns
      leading small-group dialogue about a text while the teacher fades support.
    body: |
      **What it is.** A structured dialogue about a text, segment by segment, using four
      moves: predict, question, clarify, summarise. The teacher models all four, then
      pupils take turns as discussion leader.

      **How to run it at P7.**
      1. Model each move with think-aloud on a short text (one move per lesson at first).
      2. Give role cards with sentence starters ("I predict... because...", "I wonder why...",
         "A word I need to clarify is... I worked it out by...", "In a few words, this part is about...").
      3. Groups of four read a section, each leading one move; rotate roles.
      4. Fade: whole-class modelling, then groups, then pairs, then individual use.

      **Evidence in brief.** Strong underlying evidence for comprehension strategy
      teaching; the EEF trial suggests the targeted small-group version is more reliable
      than a whole-class roll-out.
    status: draft
    version: "0.1"
    curated_by: [agent-LIT]
    reviewed_by: []
    facets:
      jurisdiction: [scotland]
      cfe_level: [second]
      stage: [p7]
      curriculum_area: [languages]
      subject: [literacy and English, reading]
      lesson_purpose: [introduce, guided_practice, independent_practice]
      knowledge_type: [procedural, metacognitive]
      expertise: [novice, developing]
      artefact_type: [slides, worksheet, lesson_plan, interaction]
    evidence:
      rating: moderate
      rationale: "Original reciprocal teaching studies and EEF Toolkit support strategy teaching; EEF trial mixed for whole-class use (clm-LIT-rr-eef-trial)."
    prerequisites:
      - "Pupils decode the chosen text accurately enough to focus on meaning"
      - "Teacher has modelled each move at least once"
    risks:
      - "Whole-class delivery without sustained modelling may add little (EEF trial with Year 4)."
      - "Roles can become a box-ticking routine; keep the focus on meaning, not the cards."
      - "aligns_to ids follow the CUR naming convention; codes verified against the E&O document but the CUR entries are owned by another agent."
    relations:
      uses_principle: [prn-EVD-reading-comprehension-strategies, prn-EVD-metacognition, prn-EVD-scaffolding, prn-EVD-collaborative-learning, prn-EVD-explicit-instruction]
      demonstrated_by: [exm-LIT-reciprocal-reading-group-session]
      aligns_to: [cur-CUR-lit-2-13a, cur-CUR-eng-2-17a, cur-CUR-lit-2-16a]
    artefact_recipes:
      slides: >-
        Slide per move with icon, purpose and one starter; a short extract from the class
        novel with the teacher's think-aloud annotations revealed step by step.
      worksheet: >-
        Four-quadrant reading log (Predict, Question, Clarify, Summarise) beside a
        numbered text extract; summary box limited to 20 words.
      form: >-
        Exit form: "Which move helped you most today and where in the text?" plus a
        one-line summary of the chapter.
      lesson_plan: >-
        Model (10 min think-aloud) then Try (groups of four with role cards, 20 min) then
        Apply (pairs on next section) then Secure (plenary comparing summaries).
      interaction: >-
        Rotating discussion leader; teacher circulates prompting "How did you work that
        out?" and steps back as groups become fluent.
    claims: [clm-LIT-rr-four-strategies, clm-LIT-rr-turn-taking, clm-LIT-rr-original-results, clm-LIT-rr-eef-trial, clm-LIT-rr-comp-strategies-impact, clm-LIT-rr-scotland, clm-LIT-rr-sustained]

  # 2 ---------------------------------------------------------------------------
  - id: sig-LIT-explicit-vocabulary-tier2
    type: signature_pedagogy
    title: "Explicit vocabulary instruction focused on Tier 2 words"
    summary: >-
      Select ambitious, widely useful words from class texts, pre-teach them, then give
      repeated, active encounters across talk, reading and writing.
    body: |
      **Selecting words.** From the next chapter or text, pick 5 to 8 Tier 2 words (for
      example *reluctant*, *consequence*, *reveal*) that matter for comprehension and will
      recur across subjects. Tier 3 words (subject-specific) are taught in context as needed.

      **Teaching routine.** Say it, read it, pupil-friendly definition, example in the
      text, pupils' own example, non-example, then use it in talk that day. Revisit the
      words across the week in reading, discussion and writing.

      **Tools.** The Frayer model (act-LIT-frayer-model) suits conceptually rich words.
    status: draft
    version: "0.1"
    curated_by: [agent-LIT]
    reviewed_by: []
    facets:
      jurisdiction: [scotland]
      cfe_level: [second]
      stage: [p7]
      curriculum_area: [languages]
      subject: [literacy and English, vocabulary]
      lesson_purpose: [introduce, guided_practice, apply_transfer]
      knowledge_type: [declarative, conceptual]
      expertise: [novice, developing]
      artefact_type: [slides, worksheet, lesson_plan, interaction]
