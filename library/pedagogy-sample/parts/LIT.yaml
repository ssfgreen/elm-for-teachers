  - id: act-LIT-sentence-combining
    type: activity_type
    title: "Sentence-level instruction: combining, expanding and 'because, but, so'"
    summary: >-
      Short, frequent practice joining and expanding sentences, including completing a
      stem three ways with because, but and so, to build syntactic range and reasoning.
    body: |
      **Sentence combining.** Give two or three short sentences from a topic or the class
      novel; pupils join them in different ways (conjunctions, relative clauses, fronted
      adverbials) and discuss which version works best.

      **Because, but, so.** Give a stem tied to content, for example "Charlotte hid the
      letter...". Pupils complete it three times: because (explanation), but (contrast),
      so (consequence).

      **Sentence expanding.** Add who, what, when, where, why detail to a kernel sentence.

      Model first, then pairs, then independent; keep it to 10 minutes and connect to the
      writing in hand.
    status: draft
    version: "0.1"
    curated_by: [agent-LIT]
