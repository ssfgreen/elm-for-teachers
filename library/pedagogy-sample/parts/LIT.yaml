      The Teachers as Readers research (2006-11) found primary teachers' knowledge of
      children's literature was too narrow to support reader development and that they
      underestimated children's home reading. When teachers explored pupils' informal
      reading, they came to see reading as more social and introduced more talk-based
      activities.
