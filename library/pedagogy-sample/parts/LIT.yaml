  # 14 --------------------------------------------------------------------------
  - id: exm-LIT-reciprocal-reading-group-session
    type: exemplar
    title: "Exemplar: 40-minute reciprocal reading session for a P7 group"
    summary: >-
      A Model, Try, Apply, Secure lesson using role cards and sentence starters on a
      short information text.
    body: |
      **Text.** Two-page non-fiction article on a P7 topic, split into four sections.

      **Model (10 min).** Teacher reads section 1 aloud and thinks aloud through predict,
      question, clarify, summarise.

      **Try (15 min).** Groups of four, one role card each (Predictor, Questioner,
      Clarifier, Summariser) with sentence starters; section 2; roles rotate for section 3.

      **Apply (10 min).** Pairs read section 4 and complete a summary wheel in few words.

      **Secure (5 min).** Groups share one clarified word and how they worked it out; one
      summary is compared with the teacher's.
    status: draft
    version: "0.1"
    curated_by: [agent-LIT]
    reviewed_by: []
    facets:
      jurisdiction: [scotland]
      cfe_level: [second]
      stage: [p7]
      curriculum_area: [languages]
      subject: [literacy and English, reading]
      lesson_purpose: [guided_practice]
      knowledge_type: [procedural, metacognitive]
      expertise: [novice, developing]
      artefact_type: [lesson_plan, worksheet]
    evidence:
      rating: practitioner_wisdom
      rationale: "Structure taken from the Edinburgh Literacy Hub guide hosted by Education Scotland (clm-LIT-exrr-model-try)."
    prerequisites: ["Each move modelled in earlier lessons"]
    risks: ["Group size and roles may need adjusting for pupils who find group talk difficult."]
    relations:
      uses_principle: [prn-EVD-reading-comprehension-strategies, prn-EVD-collaborative-learning, prn-EVD-scaffolding]
      aligns_to: [cur-CUR-lit-2-13a, cur-CUR-lit-2-14a]
    artefact_recipes:
      lesson_plan: "As in body: Model, Try, Apply, Secure."
      worksheet: "Four role cards with starters ('I predict...', 'I wonder...', 'I clarified... by...', 'This part is about...') and a summary wheel."
    claims: [clm-LIT-exrr-prompts, clm-LIT-exrr-model-try]

