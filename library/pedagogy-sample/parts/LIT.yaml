  # --- Palincsar and Brown ---------------------------------------------------
  - id: psg-LIT-pb-four
    source_id: src-LIT-palincsar-brown-1983
    locator: "pp.3-4 and p.13"
    excerpt_type: paraphrase
    text: >-
      The four activities (summarising, questioning, clarifying, predicting) were chosen
      because each can both improve comprehension and let the reader check whether
      comprehension is happening.
    fetched_url: https://files.eric.ed.gov/fulltext/ED225135.pdf
    verified_by_fetch: true

  - id: psg-LIT-pb-dialogue
    source_id: src-LIT-palincsar-brown-1983
    locator: "pp.13-14 and pp.21-23"
    excerpt_type: paraphrase
    text: >-
      Adult and pupils take turns leading a dialogue on each segment of text: the leader
      asks a question, summarises, predicts and clarifies. The adult supports with prompts,
      brief instruction, modelling and specific praise, modelling heavily at first and
      handing over as pupils' contributions improve.
    fetched_url: https://files.eric.ed.gov/fulltext/ED225135.pdf
    verified_by_fetch: true

  - id: psg-LIT-pb-results
    source_id: src-LIT-palincsar-brown-1983
    locator: "pp.10, 17-19, 46-50"
    excerpt_type: paraphrase
    text: >-
      Participants were seventh graders (about 12 to 13) who decoded adequately but
      comprehended poorly. In Study 1 daily comprehension scores rose from about 15 per
      cent to about 80 per cent and were largely maintained; in Study 3 classroom teachers
      working with reading groups obtained gains similar to the investigator's.
    fetched_url: https://files.eric.ed.gov/fulltext/ED225135.pdf
    verified_by_fetch: true

