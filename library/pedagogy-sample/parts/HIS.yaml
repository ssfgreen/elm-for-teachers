passages:
  # ---------------- Ofsted ----------------
  - id: psg-HIS-ofsted-subst-disc-interplay
    source_id: src-HIS-ofsted-history-review-2021
    locator: "Securing progression in disciplinary knowledge > Complexities in developing pupils' disciplinary knowledge > The interplay between substantive and disciplinary knowledge"
    text: "each is meaningless without the other"
    excerpt_type: quote
    fetched_url: https://www.gov.uk/government/publications/research-review-series-history/research-review-series-history
    verified_by_fetch: true

  - id: psg-HIS-ofsted-second-order-list
    source_id: src-HIS-ofsted-history-review-2021
    locator: "Securing progression in disciplinary knowledge > Developing disciplinary thinking through disciplinary concepts"
    text: "Lists the disciplinary (second-order) concepts as cause, consequence, change and continuity, similarity and difference, historical significance, sources and evidence, and historical interpretations."
    excerpt_type: paraphrase
    fetched_url: https://www.gov.uk/government/publications/research-review-series-history/research-review-series-history
    verified_by_fetch: true

  - id: psg-HIS-ofsted-one-argument
    source_id: src-HIS-ofsted-history-review-2021
    locator: "Developing disciplinary thinking through disciplinary concepts > Consequence"
    text: "Advises keeping an enquiry focused on one type of historical argument at a time (for example causation or consequence) rather than mixing them."
    excerpt_type: paraphrase
    fetched_url: https://www.gov.uk/government/publications/research-review-series-history/research-review-series-history
    verified_by_fetch: true

  - id: psg-HIS-ofsted-sources-question
    source_id: src-HIS-ofsted-history-review-2021
    locator: "Developing disciplinary thinking through disciplinary concepts > Sources and evidence"
    text: "Argues that bias is not automatically a weakness: a source can only be judged useful or reliable in relation to a particular historical question."
    excerpt_type: paraphrase
    fetched_url: https://www.gov.uk/government/publications/research-review-series-history/research-review-series-history
    verified_by_fetch: true

  - id: psg-HIS-ofsted-sources-generic
    source_id: src-HIS-ofsted-history-review-2021
    locator: "Developing disciplinary thinking through disciplinary concepts > Sources and evidence"
    text: "Recommends that pupils meet varied types of source and longer extracts rather than short snippets, and that generic exam-style source questions are avoided at key stage 3 and earlier."
    excerpt_type: paraphrase
    fetched_url: https://www.gov.uk/government/publications/research-review-series-history/research-review-series-history
    verified_by_fetch: true

  - id: psg-HIS-ofsted-avoid-generic
    source_id: src-HIS-ofsted-history-review-2021
    locator: "Some principles for developing pupils' disciplinary knowledge > Avoiding generic approaches"
    text: "Warns that generic heuristics such as the '5Ws' can create misconceptions about how historians work with the past."
    excerpt_type: paraphrase
    fetched_url: https://www.gov.uk/government/publications/research-review-series-history/research-review-series-history
    verified_by_fetch: true

  - id: psg-HIS-ofsted-enquiry-questions
    source_id: src-HIS-ofsted-history-review-2021
    locator: "Securing progression in disciplinary knowledge > Enquiry questions"
    text: "Describes enquiry questions as a way to organise content and build pupils' knowledge across a series of lessons, with enquiry meaning the tools and methods historians use."
    excerpt_type: paraphrase
    fetched_url: https://www.gov.uk/government/publications/research-review-series-history/research-review-series-history
    verified_by_fetch: true

  - id: psg-HIS-ofsted-narrative-hinterland
    source_id: src-HIS-ofsted-history-review-2021
    locator: "The importance of context and repetition when learning new concepts > The role of background content > Hinterland information can connect and organise information into coherent narratives"
    text: "Explains that stories, with agents, causes and conflict, help organise complex content, and that rich background ('hinterland') detail often supports learning of the core content."
    excerpt_type: paraphrase
    fetched_url: https://www.gov.uk/government/publications/research-review-series-history/research-review-series-history
    verified_by_fetch: true

  - id: psg-HIS-ofsted-fingertip
    source_id: src-HIS-ofsted-history-review-2021
    locator: "Prioritising content in the curriculum > Fingertip and residue knowledge"
    text: "Notes that the quality of pupils' written historical arguments depends on secure, readily available ('fingertip') knowledge of the topic at the time of writing."
    excerpt_type: paraphrase
    fetched_url: https://www.gov.uk/government/publications/research-review-series-history/research-review-series-history
    verified_by_fetch: true

  - id: psg-HIS-ofsted-chronology
    source_id: src-HIS-ofsted-history-review-2021
    locator: "Chronological knowledge > Developing pupils' mental timeline"
    text: "Describes chronological knowledge as highly generative, supporting a secure mental timeline; overview and depth study reinforce each other."
    excerpt_type: paraphrase
    fetched_url: https://www.gov.uk/government/publications/research-review-series-history/research-review-series-history
    verified_by_fetch: true

  - id: psg-HIS-ofsted-timelines-assess
    source_id: src-HIS-ofsted-history-review-2021
    locator: "Effective teaching in history > Teaching chronological knowledge; Assessment in history > Formative assessment"
    text: "Discusses timelines as a way to organise chronological knowledge and notes they can be used formatively to check pupils' chronological knowledge."
    excerpt_type: paraphrase
    fetched_url: https://www.gov.uk/government/publications/research-review-series-history/research-review-series-history
    verified_by_fetch: true

  - id: psg-HIS-ofsted-reading
    source_id: src-HIS-ofsted-history-review-2021
    locator: "Effective teaching in history > Reading extended texts"
    text: "Explains that background knowledge shapes reading comprehension in history, and that pupils benefit from reading appropriately challenging texts, including the work of academic historians."
    excerpt_type: paraphrase
    fetched_url: https://www.gov.uk/government/publications/research-review-series-history/research-review-series-history
    verified_by_fetch: true

  - id: psg-HIS-ofsted-essay-outcome
    source_id: src-HIS-ofsted-history-review-2021
    locator: "Assessment in history > Assessing disciplinary knowledge"
    text: "Notes that essay-style outcome tasks help build knowledge and argument but are complex to use as assessment instruments."
    excerpt_type: paraphrase
    fetched_url: https://www.gov.uk/government/publications/research-review-series-history/research-review-series-history
    verified_by_fetch: true

  - id: psg-HIS-ofsted-local-history
    source_id: src-HIS-ofsted-history-review-2021
    locator: "Developing early historical knowledge; Diversity and representativeness"
    text: "Suggests family and local history can connect new concepts to familiar contexts and help pupils consider similarity and difference."
    excerpt_type: paraphrase
    fetched_url: https://www.gov.uk/government/publications/research-review-series-history/research-review-series-history
    verified_by_fetch: true

  - id: psg-HIS-ofsted-perspective
    source_id: src-HIS-ofsted-history-review-2021
    locator: "UNCONFIRMED: section preceding 'Methodological approaches and schools of historical thought' (cultural history discussion; footnote citing Benger on recasting empathy as historical perspective)"
    text: "Treats reconstructing the attitudes and values of past societies as something pupils do by following historians' methods, with a footnote pointing to work that recasts empathy as historical perspective."
    excerpt_type: paraphrase
    fetched_url: https://www.gov.uk/government/publications/research-review-series-history/research-review-series-history
    verified_by_fetch: true

  # ---------------- Education Scotland ----------------
  - id: psg-HIS-eo-principles
    source_id: src-HIS-edscot-socstudies-eo
    locator: "p.1, principles and practice statement (what learning in social studies enables)"
    text: "Learning in social studies should build understanding of Scotland's history, heritage and culture, help learners explore and assess different kinds of sources and evidence, and place people, periods and events in time and place."
    excerpt_type: paraphrase
    fetched_url: https://education.gov.scot/media/rh3fq1gi/social-studies-eo.pdf
    verified_by_fetch: true

  - id: psg-HIS-eo-soc301a
    source_id: src-HIS-edscot-socstudies-eo
    locator: "p.2, People, past events and societies, SOC 3-01a"
    text: "SOC 3-01a: the learner uses knowledge of a historical period to interpret evidence and present an informed view."
    excerpt_type: paraphrase
    fetched_url: https://education.gov.scot/media/rh3fq1gi/social-studies-eo.pdf
    verified_by_fetch: true

  - id: psg-HIS-eo-soc302a
    source_id: src-HIS-edscot-socstudies-eo
    locator: "p.2, People, past events and societies, SOC 3-02a"
    text: "SOC 3-02a: the learner links current and previous studies and shows how people and events contributed to the development of the Scottish nation."
    excerpt_type: paraphrase
    fetched_url: https://education.gov.scot/media/rh3fq1gi/social-studies-eo.pdf
    verified_by_fetch: true

  - id: psg-HIS-eo-soc305a-306a
    source_id: src-HIS-edscot-socstudies-eo
    locator: "pp.4-5, People, past events and societies, SOC 3-05a and SOC 3-06a"
    text: "SOC 3-05a asks learners to describe factors behind a major social, political or economic change and assess its impact; SOC 3-06a asks them to discuss motives in a significant turning point and assess its consequences then and since."
    excerpt_type: paraphrase
    fetched_url: https://education.gov.scot/media/rh3fq1gi/social-studies-eo.pdf
    verified_by_fetch: true

  - id: psg-HIS-eo-soc304a
    source_id: src-HIS-edscot-socstudies-eo
    locator: "p.3, People, past events and societies, SOC 3-04a"
    text: "SOC 3-04a: the learner explains similarities and differences in the lifestyles, values and attitudes of people in the past by comparing Scotland with another society."
    excerpt_type: paraphrase
    fetched_url: https://education.gov.scot/media/rh3fq1gi/social-studies-eo.pdf
    verified_by_fetch: true

  - id: psg-HIS-bench-301a
    source_id: src-HIS-edscot-socstudies-benchmarks-2017
    locator: "p.14, Third Level, People, past events and societies, SOC 3-01a"
    text: "Benchmark for SOC 3-01a: the learner compares a range of primary and secondary sources and draws at least three valid conclusions about a historical period."
    excerpt_type: paraphrase
    fetched_url: https://dera.ioe.ac.uk/28595/1/Social%20StudiesBenchmarksPDF.pdf
    verified_by_fetch: true

  - id: psg-HIS-bench-305a-306a
    source_id: src-HIS-edscot-socstudies-benchmarks-2017
    locator: "p.14, Third Level, SOC 3-05a and SOC 3-06a"
    text: "Benchmarks: identify at least three factors behind a change and give at least two valid opinions on its effect; give at least two valid opinions on motives in a turning point and a valid opinion on its impact."
    excerpt_type: paraphrase
    fetched_url: https://dera.ioe.ac.uk/28595/1/Social%20StudiesBenchmarksPDF.pdf
    verified_by_fetch: true

  - id: psg-HIS-bench-purpose
    source_id: src-HIS-edscot-socstudies-benchmarks-2017
    locator: "p.2, introduction"
    text: "States that benchmarks support professional judgement and moderation and are not intended to be ticked off individually as assessment checklists."
    excerpt_type: paraphrase
    fetched_url: https://dera.ioe.ac.uk/28595/1/Social%20StudiesBenchmarksPDF.pdf
    verified_by_fetch: true

