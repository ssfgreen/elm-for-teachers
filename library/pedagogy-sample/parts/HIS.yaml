entries:
  # =====================================================================
  - id: sig-HIS-enquiry-question-sequence
    type: signature_pedagogy
    title: "Historical enquiry questions and enquiry sequences"
    summary: "Organise a block of S1 history lessons around one carefully worded, answerable historical question that pupils build knowledge towards and answer in an outcome task."
    body: |
      An enquiry question (for example "Why did Scottish nobles write to the Pope in 1320?") frames 4 to 8 lessons. Each lesson adds substantive knowledge that pupils need to answer it, and the sequence ends in an outcome task (often extended writing). This is structured, teacher-led enquiry, not discovery learning: the teacher selects content and sources and teaches the knowledge explicitly.
      Good questions are tied to one second-order concept at a time (cause, consequence, change, significance, evidence, interpretation), use precise historical content and invite an argued answer. Plan questions across S1 to S3 so that concepts and periods are revisited.
    status: draft
    version: "0.1"
    curated_by: [agent-HIS]
    facets:
      jurisdiction: [scotland]
      cfe_level: [third]
      stage: [s1]
      curriculum_area: [social_studies]
      subject: [history]
      lesson_purpose: [introduce, guided_practice, apply_transfer]
      knowledge_type: [disciplinary, declarative, conceptual]
      expertise: [novice, developing]
      artefact_type: [lesson_plan, slides, worksheet]
    evidence:
      rating: practitioner_wisdom
      rationale: "Long-standing subject community practice (HA, Riley) endorsed in the Ofsted review; not trial-tested as a package (clm-HIS-enquiry-organises)."
    prerequisites: ["Teacher has mapped the substantive content needed to answer the question"]
    risks:
      - "Treating enquiry as open discovery with pupils left to find knowledge unaided"
      - "Questions that mix several second-order concepts and blur the argument"
    relations:
      uses_principle: [prn-EVD-guided-inquiry, prn-EVD-explicit-instruction, prn-EVD-spaced-practice]
      demonstrated_by: [exm-HIS-arbroath-enquiry]
      aligns_to: [cur-CUR-soc-3-01a, cur-CUR-soc-3-05a, cur-CUR-soc-3-06a]
    artefact_recipes:
      slides: "Enquiry question on every slide header; a 'where are we in the enquiry?' tracker slide at the start of each lesson showing which part of the answer today's knowledge builds."
      worksheet: "Enquiry question in a box at the top; knowledge-gathering grid with one row per lesson; final box 'My answer so far' updated at the end of each lesson."
      form: "Exit ticket: 'What did today add to our answer to the enquiry question?' plus one retrieval question from a previous lesson."
      lesson_plan: "Lesson 1 hook and question; lessons 2 to 5 knowledge and sources each tied to the question; lesson 6 planning; lesson 7 outcome task. Note the single second-order concept in focus."
      interaction: "Start each lesson with pairs restating the enquiry question and their current provisional answer; teacher cold-calls two pairs."
    claims: [clm-HIS-enquiry-organises, clm-HIS-enquiry-not-discovery, clm-HIS-enquiry-one-concept, clm-HIS-enquiry-sequence-ks]

  # =====================================================================
  - id: sig-HIS-second-order-concepts
    type: signature_pedagogy
    title: "Teaching second-order (disciplinary) concepts explicitly"
    summary: "Make the disciplinary concepts historians use (cause and consequence, change and continuity, similarity and difference, significance, evidence, interpretations, perspective) explicit objects of teaching, always through specific content."
    body: |
      Second-order concepts shape the kind of argument pupils make about substantive content. In S1, introduce them by name, model what an answer in that concept sounds like, and give repeated practice across different topics. Seixas's six historical thinking concepts (significance, evidence, continuity and change, cause and consequence, historical perspectives, ethical dimension) and the Ofsted list overlap closely; choose one vocabulary for the department and use it consistently.
      These concepts are never taught as free-floating skills: substantive and disciplinary knowledge depend on each other.
    status: draft
    version: "0.1"
    curated_by: [agent-HIS]
    facets:
      jurisdiction: [scotland]
      cfe_level: [third]
      stage: [s1]
      curriculum_area: [social_studies]
      subject: [history]
      lesson_purpose: [introduce, guided_practice]
      knowledge_type: [disciplinary, conceptual]
      expertise: [novice, developing]
      artefact_type: [slides, worksheet, lesson_plan]
    evidence:
      rating: moderate
      rationale: "Grounded in research traditions synthesised by Seixas and in the Ofsted review (clm-HIS-soc-list, clm-HIS-soc-model)."
    risks: ["Teaching concepts as generic skills detached from content"]
    relations:
      uses_principle: [prn-EVD-explicit-instruction, prn-EVD-worked-examples, prn-EVD-scaffolding]
      aligns_to: [cur-CUR-soc-3-01a, cur-CUR-soc-3-04a, cur-CUR-soc-3-05a, cur-CUR-soc-3-06a]
    artefact_recipes:
      slides: "One concept icon per enquiry (e.g. a chain for cause); slide with a model sentence for the concept, such as 'X mattered more than Y because...'."
      worksheet: "Concept box: definition in plain words, two model sentences, then pupils write their own sentence about today's content."
      form: "Multiple-choice: which question is a change question and which is a cause question?"
      lesson_plan: "Name the concept, model it on known content, guided practice in pairs, independent sentence, revisit next week on new content."
      interaction: "Sentence stems on the board for discussion: 'One thing that stayed the same was...', 'This was significant because...'."
    claims: [clm-HIS-soc-list, clm-HIS-soc-model, clm-HIS-soc-interplay]

  # =====================================================================
  - id: sig-HIS-knowledge-rich-narrative
    type: signature_pedagogy
    title: "Substantive knowledge first: knowledge-rich narrative and storytelling"
    summary: "Secure pupils' knowledge of the period through vivid teacher narrative and rich background before asking them to interpret sources or write arguments."
    body: |
      Pupils can only interpret evidence and argue if they know enough about the period. Tell the story of the period with people, motives, causes and conflict; include memorable 'hinterland' detail that helps pupils hold the core content. Check and retrieve the key knowledge before source work and before extended writing.
    status: draft
    version: "0.1"
    curated_by: [agent-HIS]
    facets:
      jurisdiction: [scotland]
      cfe_level: [third]
      stage: [s1]
      curriculum_area: [social_studies]
      subject: [history]
      lesson_purpose: [introduce]
      knowledge_type: [declarative]
      expertise: [novice]
      artefact_type: [slides, lesson_plan, worksheet]
    evidence:
      rating: moderate
      rationale: "Ofsted research review synthesis on narrative, hinterland and fingertip knowledge (clm-HIS-narrative-organises, clm-HIS-fingertip)."
    risks: ["Narrative presented as the single true account without signalling that historians construct accounts"]
    relations:
      uses_principle: [prn-EVD-explicit-instruction, prn-EVD-retrieval-practice, prn-EVD-dual-coding]
      aligns_to: [cur-CUR-soc-3-01a]
    artefact_recipes:
      slides: "Story told in 5 to 8 slides, each with one image and a short caption; named people and a clear 'problem' they faced."
      worksheet: "Knowledge organiser: timeline strip, 6 to 8 key people and terms with one-line definitions, a short narrative paragraph."
      form: "Five-question retrieval quiz on the narrative before the source lesson."
      lesson_plan: "Teacher narrative (10 to 15 minutes) with pauses for prediction questions; retrieval quiz next lesson before sources."
      interaction: "Pause the story: 'What do you think she did next, and why?' Pupils discuss in pairs for 30 seconds."
    claims: [clm-HIS-narrative-organises, clm-HIS-fingertip, clm-HIS-soc-interplay-2]

  # =====================================================================
  - id: act-HIS-source-analysis-scaffold
    type: activity_type
    title: "Scaffolded source analysis: provenance, content, context, for a question"
    summary: "Teach pupils to read a source as evidence for a specific question, using a short routine (who made it, when and why; what it says; what we know about the time; how it compares with other sources)."
    body: |
      Give a source with its provenance visible. Pupils work through: provenance (author, date, purpose, audience); content (what it says or shows, key words); context (what we already know about the period that helps us read it); corroboration (does another source agree?). Always frame this around the enquiry question: "How useful is this for finding out why...?" rather than a generic "Is it biased?".
      Use varied source types and, as pupils grow in confidence, longer extracts. Avoid exam-style generic source question formats in S1.
    status: draft
    version: "0.1"
    curated_by: [agent-HIS]
    facets:
      jurisdiction: [scotland]
      cfe_level: [third]
      stage: [s1]
      curriculum_area: [social_studies]
      subject: [history]
      lesson_purpose: [guided_practice, independent_practice]
      knowledge_type: [disciplinary, procedural]
      expertise: [novice, developing]
      artefact_type: [worksheet, slides, interaction]
    evidence:
      rating: moderate
      rationale: "Reading moves derived from Wineburg's research as operationalised by SHEG/DIG; Ofsted review on question-specific evaluation (clm-HIS-src-question, clm-HIS-src-heuristics)."
    prerequisites: ["Pupils know the narrative of the period (sig-HIS-knowledge-rich-narrative)"]
    risks: ["Turning the routine into a generic checklist; equating bias with uselessness"]
    relations:
      uses_principle: [prn-EVD-scaffolding, prn-EVD-worked-examples, prn-EVD-reading-comprehension-strategies]
      aligns_to: [cur-CUR-soc-3-01a]
      caution_from: [cau-HIS-generic-source-questions]
    artefact_recipes:
      slides: "Source on the left; four labelled boxes on the right (Who/when/why; What it says; What we know; Does another source agree?). Teacher models the first source thinking aloud."
      worksheet: "Source with provenance line in bold above it; four-box scaffold with sentence stems; final box 'For our question, this source is useful because... but...'."
      form: "Two short-answer items: 'Who made this source and why?' and 'Give one thing from your own knowledge that helps explain it.'"
      lesson_plan: "Model one source (I do), pairs analyse a second (we do), individuals a third (you do), then compare the three for the enquiry question."
      interaction: "Pairs annotate a printed source with coloured pens, one colour per box; teacher circulates and asks 'how do you know that from the source?'."
    claims: [clm-HIS-src-heuristics, clm-HIS-src-taught, clm-HIS-src-question, clm-HIS-src-varied, clm-HIS-src-benchmark]

