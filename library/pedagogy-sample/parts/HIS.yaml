    title: "Disciplinary reading and extended analytical writing in history"
    summary: "Teach pupils to read challenging historical texts and to write structured, argued answers to enquiry questions, with knowledge, oral rehearsal and paragraph models in place first."
    body: |
      Reading: give S1 pupils appropriately challenging history texts (including short extracts of historians' writing), pre-teaching the context they need to comprehend them.
