  - id: act-HIS-causation-card-sort
    type: activity_type
    title: "Causation card sorts and diamond or relevance rankings"
    summary: "Pupils sort, rank and link cards naming causes of an event, then justify the arrangement aloud and in writing; design matters so pupils do the reasoning."
    body: |
      Cards carry short names or concepts (not ready-made explanations) so pupils must explain each cause. Variants: sort by type (political, economic, religious); arrange by timescale (long, medium, short term); place nearer or further from the question card by relevance; size circles by importance and justify the size; draw links between cards.
      Sorting into categories alone is not enough: build in a weighing step ("which mattered most and how did they combine?") and a justification step, then feed the arrangement into a paragraph plan. Living graphs (plotting events against a criterion such as success over time) are a related scaffold.
    status: draft
    version: "0.1"
    curated_by: [agent-HIS]
