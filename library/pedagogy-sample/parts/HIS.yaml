  - id: cau-HIS-holocaust-no-simulation
    type: caution
    title: "Teaching the Holocaust: no simulations or role play identifying with victims or perpetrators"
    summary: "Do not use simulations, role play or 'imagine you are' writing that puts pupils in the place of victims or perpetrators; avoid shock imagery and gimmicky tasks; use testimony, individual stories and full historical context."
    body: |
      - No simulation games or role play recreating Holocaust experiences, and no creative writing asking pupils to imagine being a victim or perpetrator.
      - If imaginative work is used at all, use an observer position (for example a journalist from a neutral country) and always debrief.
      - Do not use graphic atrocity images to shock; the history can be taught without them. Contextualise perpetrator-produced material as propaganda.
      - Avoid trivialising tasks (word searches, crosswords, model building, counting objects).
      - Present victims as individuals with agency, using first-person testimony and stories of life before and after; study perpetrators as people who made choices.
      - Prepare pupils emotionally, keep to age-appropriate material (for S1, individual stories of victims, escape and rescue are a suitable entry point) and allow time for reflection.
    status: draft
    version: "0.1"
    curated_by: [agent-HIS]
    facets:
      jurisdiction: [scotland]
      cfe_level: [third, fourth, senior]
      stage: [s1, s2, s3]
      curriculum_area: [social_studies, rme]
      subject: [history]
      artefact_type: [slides, worksheet, lesson_plan, interaction]
    evidence:
      rating: not_recommended
      rationale: "Simulation and role play are advised against by IHRA and USHMM guidance (clm-HIS-hol-ihra, clm-HIS-hol-ushmm)."
    risks: ["Pupils believe they understand what victims experienced", "Over-identification or fascination with perpetrators", "Distress"]
    relations:
      conflicts_with: [act-HIS-historical-perspective-in-role]
    claims: [clm-HIS-hol-ihra, clm-HIS-hol-ushmm, clm-HIS-hol-observer, clm-HIS-hol-images, clm-HIS-hol-gimmicks, clm-HIS-hol-people, clm-HIS-hol-age]

