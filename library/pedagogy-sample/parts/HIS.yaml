  - id: cau-HIS-generic-source-questions
    type: caution
    title: "Avoid generic source questions and 'bias = bad' in S1"
    summary: "Do not drill exam-style generic source questions or teach that biased sources are useless; evaluate sources for a specific historical question and avoid generic 5Ws heuristics."
    body: |
      In S1, source work should serve the enquiry question. Teaching a one-size routine ("Who wrote it? Is it biased?") or the generic 5Ws can create misconceptions. A biased source can be very useful for some questions (for example about attitudes). Use varied sources and build towards longer extracts.
    status: draft
    version: "0.1"
    curated_by: [agent-HIS]
    facets:
      jurisdiction: [scotland]
      cfe_level: [third]
      stage: [s1]
      curriculum_area: [social_studies]
      subject: [history]
      artefact_type: [worksheet, form, slides]
    evidence:
      rating: moderate
      rationale: "Ofsted research review synthesis (clm-HIS-gen-bias, clm-HIS-gen-5ws)."
    relations:
      conflicts_with: []
    claims: [clm-HIS-gen-bias, clm-HIS-gen-5ws, clm-HIS-gen-exam, clm-HIS-gen-benchmarks]

