# The app: two copies of the image, each serving the API and the built client.
apiVersion: v1
kind: Service
metadata:
  name: app
spec:
  selector:
    app.kubernetes.io/name: app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
    spec:
      # The image's user "node" is 1000; a number lets Kubernetes check it is not root.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      # A chat turn winds up within 200 s (agent.max_turn_ms); let it finish on a rollout, after the
      # 5 s preStop pause below.
      terminationGracePeriodSeconds: 245
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: app
      containers:
        - name: app
          image: edw-app
          envFrom:
            - configMapRef: { name: edw-settings }
            - secretRef: { name: edw-app }
          env:
            # Refuses the admin password here: admins sign in with Google or Microsoft.
            - { name: DEPLOY_ENV, value: production }
          ports:
            - { name: http, containerPort: 3000 }
          # A few seconds for the gateway to stop sending new requests before the copy stops.
          lifecycle:
            preStop:
              exec:
                command: ['sleep', '5']
          # Traffic only once the database answers and every migration is applied.
          readinessProbe:
            httpGet: { path: /api/health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 768Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app
